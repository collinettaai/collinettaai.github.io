/* ============================ IN-MEMORY CACHES ============================ */
// Etag cache: path -> {etag, sha, content, type, lastChecked}
// Lives in memory only (never localStorage). Session-backed via sessionStorage for intra-session speed.
const etagCache = new Map();

function saveEtagCacheToSession() {
  try {
    const obj = {};
    etagCache.forEach((v, k) => { obj[k] = v; });
    sessionStorage.setItem('collinettaai.etags', JSON.stringify({
      _savedAt: nowIso(),
      _dataRepo: CONFIG.DATA_REPO_NAME,
      entries: obj
    }));
  } catch (e) { console.warn('etag cache persist failed', e); }
}

function loadEtagCacheFromSession() {
  try {
    const raw = sessionStorage.getItem('collinettaai.etags');
    if (!raw) return;
    const parsed = JSON.parse(raw);
    // Invalidate cache older than 30 min
    if ((new Date() - new Date(parsed._savedAt)) > 30 * 60 * 1000) {
      sessionStorage.removeItem('collinettaai.etags');
      return;
    }
    // Invalida se la cache è stata creata per un repo diverso da quello attuale
    // (necessario dopo la migrazione al repo dati CollinettaAI-data)
    if (parsed._dataRepo !== CONFIG.DATA_REPO_NAME) {
      sessionStorage.removeItem('collinettaai.etags');
      return;
    }
    Object.entries(parsed.entries || {}).forEach(([k, v]) => etagCache.set(k, v));
  } catch (e) { console.warn('etag cache load failed', e); }
}

// Rate limit monitor (visible to admin)
const rateLimit = { remaining: null, limit: null, resetAt: null, updatedAt: null };

function updateRateLimitFromHeaders(res) {
  const rem = res.headers.get('x-ratelimit-remaining');
  const lim = res.headers.get('x-ratelimit-limit');
  const reset = res.headers.get('x-ratelimit-reset');
  if (rem !== null) rateLimit.remaining = parseInt(rem, 10);
  if (lim !== null) rateLimit.limit = parseInt(lim, 10);
  if (reset !== null) rateLimit.resetAt = new Date(parseInt(reset, 10) * 1000);
  rateLimit.updatedAt = new Date();
  updateRateLimitIndicator();
}

function updateRateLimitIndicator() {
  const el = document.getElementById('rate-limit-indicator');
  if (!el) return;
  if (rateLimit.remaining === null) return;
  el.textContent = `API ${rateLimit.remaining}/${rateLimit.limit}`;
  el.classList.remove('warning', 'danger');
  if (rateLimit.remaining < 200) el.classList.add('danger');
  else if (rateLimit.remaining < 1000) el.classList.add('warning');
  if (rateLimit.resetAt) {
    const minToReset = Math.max(0, Math.ceil((rateLimit.resetAt - new Date()) / 60000));
    el.title = `GitHub API: ${rateLimit.remaining}/${rateLimit.limit} restanti. Reset tra ${minToReset} min.`;
  }
}

/*
 * Modulo `gh`: fa CRUD sul repo DATI (CollinettaAI-data) usando il PAT-data
 * presente nella sessione. Tutte le chiamate content/* / cestino/* / locks.yml
 * passano da qui.
 */
const gh = {
  _repo: () => CONFIG.DATA_REPO_NAME,
  _headers() {
    return {
      'Authorization': `token ${state.session.tokenData}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  },
  _headersWithEtag(path) {
    const h = this._headers();
    const cached = etagCache.get(path);
    if (cached && cached.etag) h['If-None-Match'] = cached.etag;
    return h;
  },
  async getFile(path) {
    const cached = etagCache.get(path);
    const url = `${CONFIG.API_BASE}/repos/${CONFIG.REPO_OWNER}/${this._repo()}/contents/${encodeURIComponent(path).replace(/%2F/g, '/')}?ref=${CONFIG.BRANCH}`;
    const res = await fetch(url, { headers: this._headersWithEtag(path), cache: 'no-store' });
    updateRateLimitFromHeaders(res);
    if (res.status === 304 && cached) {
      return { content: cached.content, sha: cached.sha, path };
    }
    if (res.status === 404) { etagCache.delete(path); return null; }
    if (!res.ok) throw new Error(`GET ${path}: ${res.status}`);
    const data = await res.json();
    if (data.type !== 'file') return data;
    let content = data.content ? new TextDecoder().decode(base64ToBuffer(data.content.replace(/\n/g, ''))) : '';
    // Fallback per file > 1 MB: l'API Contents non restituisce il campo content
    // (encoding 'none'), quindi recupero il contenuto via Blobs API (limite 100 MB).
    if (!content && data.sha && data.encoding === 'none') {
      const blobUrl = `${CONFIG.API_BASE}/repos/${CONFIG.REPO_OWNER}/${this._repo()}/git/blobs/${data.sha}`;
      const blobRes = await fetch(blobUrl, { headers: this._headers(), cache: 'no-store' });
      updateRateLimitFromHeaders(blobRes);
      if (blobRes.ok) {
        const blob = await blobRes.json();
        if (blob.content) content = new TextDecoder().decode(base64ToBuffer(blob.content.replace(/\n/g, '')));
      }
    }
    const etag = res.headers.get('etag');
    if (etag) etagCache.set(path, { etag, sha: data.sha, content, type: 'file', lastChecked: nowIso() });
    return { content, sha: data.sha, path: data.path };
  },
  // Fetch file binari (immagini, PDF, ecc.) ritornando il base64 grezzo invece di testo decoded.
  // Usato per repo privati dove raw.githubusercontent.com non funziona col token.
  // Restituisce { base64, sha, path, mimeType } oppure null se 404.
  async getFileBase64(path) {
    const url = `${CONFIG.API_BASE}/repos/${CONFIG.REPO_OWNER}/${this._repo()}/contents/${encodeURIComponent(path).replace(/%2F/g, '/')}?ref=${CONFIG.BRANCH}`;
    const res = await fetch(url, { headers: this._headers(), cache: 'no-store' });
    updateRateLimitFromHeaders(res);
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(`GET ${path}: ${res.status}`);
    const data = await res.json();
    if (data.type !== 'file') return null;
    // Inferisco MIME type dall'estensione
    const ext = (path.split('.').pop() || '').toLowerCase();
    const mimeMap = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', pdf: 'application/pdf' };
    const mimeType = mimeMap[ext] || 'application/octet-stream';
    const base64 = (data.content || '').replace(/\n/g, '');
    return { base64, sha: data.sha, path: data.path, mimeType };
  },
  async listDir(path) {
    const url = `${CONFIG.API_BASE}/repos/${CONFIG.REPO_OWNER}/${this._repo()}/contents/${encodeURIComponent(path).replace(/%2F/g, '/')}?ref=${CONFIG.BRANCH}`;
    const cached = etagCache.get('dir:' + path);
    const headers = this._headers();
    if (cached && cached.etag) headers['If-None-Match'] = cached.etag;
    const res = await fetch(url, { headers, cache: 'no-store' });
    updateRateLimitFromHeaders(res);
    if (res.status === 304 && cached) return cached.content;
    if (res.status === 404) { etagCache.delete('dir:' + path); return []; }
    if (!res.ok) throw new Error(`LIST ${path}: ${res.status}`);
    const data = await res.json();
    const etag = res.headers.get('etag');
    if (etag) etagCache.set('dir:' + path, { etag, content: data, type: 'dir', lastChecked: nowIso() });
    return data;
  },
  async getTree() {
    const url = `${CONFIG.API_BASE}/repos/${CONFIG.REPO_OWNER}/${this._repo()}/git/trees/${CONFIG.BRANCH}?recursive=1`;
    const cached = etagCache.get('tree:' + CONFIG.BRANCH);
    const headers = this._headers();
    if (cached && cached.etag) headers['If-None-Match'] = cached.etag;
    const res = await fetch(url, { headers, cache: 'no-store' });
    updateRateLimitFromHeaders(res);
    if (res.status === 304 && cached) return cached.content;
    if (!res.ok) throw new Error(`GET TREE: ${res.status}`);
    const data = await res.json();
    const etag = res.headers.get('etag');
    if (etag) etagCache.set('tree:' + CONFIG.BRANCH, { etag, content: data, type: 'tree', lastChecked: nowIso() });
    return data;
  },
  // opts.silent = true salta l'overlay bloccante (usato dai lock, scritture di plumbing in background).
  async putFile(path, content, sha, message, contentIsBase64 = false, opts = {}) {
    const _do = async () => {
      const url = `${CONFIG.API_BASE}/repos/${CONFIG.REPO_OWNER}/${this._repo()}/contents/${encodeURIComponent(path).replace(/%2F/g, '/')}`;
      let contentB64;
      if (contentIsBase64) {
        // Caller ha già fatto base64 encoding (file binari come immagini)
        contentB64 = content;
      } else {
        const enc = new TextEncoder();
        const bytes = enc.encode(content);
        let binary = '';
        bytes.forEach(b => binary += String.fromCharCode(b));
        contentB64 = btoa(binary);
      }
      const body = { message, content: contentB64, branch: CONFIG.BRANCH };
      if (sha) body.sha = sha;
      const res = await fetch(url, {
        method: 'PUT',
        headers: { ...this._headers(), 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (res.status === 409 || res.status === 422) {
        const txt = await res.text();
        if (txt.includes('does not match') || txt.includes('conflict') || res.status === 409) {
          const err = new Error('conflict'); err.code = 'CONFLICT'; throw err;
        }
        throw new Error(`PUT ${path}: ${res.status} ${txt}`);
      }
      if (!res.ok) throw new Error(`PUT ${path}: ${res.status} ${await res.text()}`);
      return await res.json();
    };
    if (opts.silent || typeof withSaveOverlay !== 'function') return _do();
    return withSaveOverlay(_do, 'Salvataggio in corso…');
  },
  async deleteFile(path, sha, message, opts = {}) {
    const _do = async () => {
      const url = `${CONFIG.API_BASE}/repos/${CONFIG.REPO_OWNER}/${this._repo()}/contents/${encodeURIComponent(path).replace(/%2F/g, '/')}`;
      const body = { message, sha, branch: CONFIG.BRANCH };
      const res = await fetch(url, {
        method: 'DELETE',
        headers: { ...this._headers(), 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error(`DELETE ${path}: ${res.status}`);
      return await res.json();
    };
    if (opts.silent || typeof withSaveOverlay !== 'function') return _do();
    return withSaveOverlay(_do, 'Eliminazione in corso…');
  }
};

/*
 * Modulo `gh_auth`: fa CRUD sul repo AUTH (CollinettaAI-auth) usando il PAT-auth
 * presente nella sessione (solo admin). Serve per la UI di gestione utenti.
 * Chi non è admin NON deve invocare questo modulo — le sue funzioni

const gh_auth = {
  _assertAdmin() {
    if (!state.session || !state.session.tokenAuth) {
      throw new Error('Operazione riservata agli amministratori (manca token_auth).');
    }
  },
  _headers() {
    this._assertAdmin();
    return {
      'Authorization': `token ${state.session.tokenAuth}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  },
  async getTokensFile() {
    this._assertAdmin();
    const url = `${CONFIG.API_BASE}/repos/${CONFIG.REPO_OWNER}/${CONFIG.AUTH_REPO_NAME}/contents/data/encrypted-tokens.json?ref=${CONFIG.BRANCH}&t=${Date.now()}`;
    const res = await fetch(url, { headers: this._headers(), cache: 'no-store' });
    if (res.status === 404) throw new Error('File auth non trovato.');
    if (!res.ok) throw new Error(`GET auth: ${res.status}`);
    const meta = await res.json();
    const json = new TextDecoder().decode(base64ToBuffer(meta.content.replace(/\n/g, '')));
    return { data: JSON.parse(json), sha: meta.sha };
  },
  async putTokensFile(tokensObj, sha, message) {
    this._assertAdmin();
    const content = JSON.stringify(tokensObj, null, 2) + '\n';
    const url = `${CONFIG.API_BASE}/repos/${CONFIG.REPO_OWNER}/${CONFIG.AUTH_REPO_NAME}/contents/data/encrypted-tokens.json`;
    const enc = new TextEncoder();
    const bytes = enc.encode(content);
    let binary = '';
    bytes.forEach(b => binary += String.fromCharCode(b));
    const contentB64 = btoa(binary);
    const body = { message, content: contentB64, branch: CONFIG.BRANCH };
    if (sha) body.sha = sha;
    const res = await fetch(url, {
      method: 'PUT',
      headers: { ...this._headers(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(`PUT auth: ${res.status} ${await res.text()}`);
    return await res.json();
  }
};

/* ============================ CONTENT PARSING ============================ */
function parseMarkdown(text) {
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  if (m) {
    let frontmatter = {};
    try { frontmatter = jsyaml.load(m[1]) || {}; } catch (e) { console.warn('YAML parse error', e); }
    return { frontmatter, body: m[2] || '' };
  }
  return { frontmatter: {}, body: text };
}

function stringifyMarkdown(frontmatter, body) {
  const yamlStr = jsyaml.dump(frontmatter, { lineWidth: 120, noRefs: true, sortKeys: false });
  return `---\n${yamlStr}---\n\n${String(body).trimStart()}`;
}

/* Dopo il render di una scheda, chiama questa per scrollare al blocco in attesa.
   Se l'elemento esiste, scrolla con flash; poi consuma pendingBlockHash.
   Safe da chiamare anche quando pendingBlockHash è null. */
function scrollToPendingBlock() {
  if (!state.pendingBlockHash) return;
  const targetId = state.pendingBlockHash;

  // Funzione che esegue lo scroll vero e proprio. Riutilizzata per il primo scroll
  // e per il re-scroll dopo il caricamento delle immagini (vedi sotto).
  const doScroll = (consumeHash) => {
    const el = document.getElementById(targetId);
    if (!el) return;
    // Misura altezza topbar e banner edit-mode reali (cambia in PWA standalone con notch)
    const tb = document.querySelector('header.topbar');
    let tbH = 60;
    if (tb) {
      const h = Math.round(tb.getBoundingClientRect().height);
      if (h > 30 && h < 200) {
        document.documentElement.style.setProperty('--topbar-height', h + 'px');
        tbH = h;
      }
    }
    const banner = document.getElementById('edit-mode-banner');
    let bannerH = 0;
    if (banner && !banner.classList.contains('hidden')) {
      bannerH = Math.round(banner.getBoundingClientRect().height);
    }
    // Calcolo manuale dell'offset (più affidabile di scrollIntoView su mobile/PWA)
    const rect = el.getBoundingClientRect();
    const targetTop = window.scrollY + rect.top - tbH - bannerH - 12;
    try {
      window.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });
    } catch {
      window.scrollTo(0, Math.max(0, targetTop));
    }
    if (consumeHash) {
      el.classList.add('bl-flash');
      setTimeout(() => el.classList.remove('bl-flash'), 2000);
    }
  };

  // Primo scroll dopo render iniziale: doppio rAF + 50ms per attendere fonts/layout iniziali
  requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(() => {
    const el = document.getElementById(targetId);
    if (!el) {
      state.pendingBlockHash = null;
      return;
    }
    doScroll(true);

    // Re-scroll dopo caricamento immagini: in PWA o con connessione lenta, le immagini
    // del contenuto possono caricarsi dopo lo scroll iniziale, spostando il blocco target.
    // Listener 'load' su ogni img non ancora caricata; quando completate, re-aggiusto.
    const imgs = document.querySelectorAll('main.content img');
    let pendingImgs = 0;
    let rescheduled = false;
    imgs.forEach(img => {
      if (!img.complete) {
        pendingImgs++;
        const onDone = () => {
          pendingImgs--;
          if (pendingImgs <= 0 && !rescheduled) {
            rescheduled = true;
            // Aspetto un frame per stabilizzare il layout post-image, poi re-scrollo
            requestAnimationFrame(() => doScroll(false));
          }
        };
        img.addEventListener('load', onDone, { once: true });
        img.addEventListener('error', onDone, { once: true });
      }
    });

    state.pendingBlockHash = null;
  }, 50)));
}

const SESSION_KEY = 'collinettaai.session';
// Usa localStorage solo se l'app è installata come PWA (mobile "Aggiungi a home")
// Negli altri casi usa sessionStorage (si cancella a fine sessione).
function isStandalonePWA() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
    || window.navigator.standalone === true;
}
function sessionStore() {
  return isStandalonePWA() ? localStorage : sessionStorage;
}
function saveSession() {
  if (state.session) sessionStore().setItem(SESSION_KEY, JSON.stringify(state.session));
}
function loadSession() {
  // Cerca sia in localStorage (PWA) sia in sessionStorage (web)
  const raw = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}
function clearSession() {
  localStorage.removeItem(SESSION_KEY);
  sessionStorage.removeItem(SESSION_KEY);
  // Pulisco la cache tema/font: al prossimo login, l'utente vedrà i suoi
  // device_prefs caricati da userPrefs.load(), non quelli del precedente utente.
  try {
    sessionStorage.removeItem('collinettaai.theme-cache');
    sessionStorage.removeItem('collinettaai.font-cache');
    localStorage.removeItem('collinettaai.theme-pref');
    localStorage.removeItem('collinettaai.font-pref');
  } catch {}
  state.session = null;
}


/* ============================ INDEX BUILD ============================ */
async function buildIndex() {
  const startTime = Date.now();
  loadEtagCacheFromSession();
  const index = { procedure: [], clinica: [], moduli: [], cestino: [], numeri: null, capitoli: [], lastIndexed: nowIso() };

  // Single tree call to discover all files
  let tree;
  try {
    tree = await gh.getTree();
  } catch (e) {
    console.warn('Tree API failed, falling back to recursive walk', e);
    return await buildIndexFallback();
  }

  // Filter file paths by section
  const procPaths = [], clinicaPaths = [], cestinoPaths = [];
  const specialFiles = { numeri: null, capitoli: null, numeriOsa: null, numeriIov: null, calendar: null, moduliIndex: null };
  (tree.tree || []).forEach(item => {
    if (item.type !== 'blob') return;
    const p = item.path;
    if (p === 'content/numeri.yml') specialFiles.numeri = p;
    else if (p === 'content/numeri-osa.yml') specialFiles.numeriOsa = p;
    else if (p === 'content/numeri-iov.yml') specialFiles.numeriIov = p;
    else if (p === 'content/capitoli.yml') specialFiles.capitoli = p;
    else if (p === 'content/calendar.yml') specialFiles.calendar = p;
    else if (p === 'content/moduli/index.yml') specialFiles.moduliIndex = p;
    // Cartella per scheda: ogni procedura/clinica è una cartella con dentro scheda.md + img/.
    // Il filtro `/scheda.md` è ancorato alla fine del path per non catturare altri .md eventuali.
    else if (p.startsWith('content/procedure/') && p.endsWith('/scheda.md')) procPaths.push(p);
    else if (p.startsWith('content/clinica/') && p.endsWith('/scheda.md')) clinicaPaths.push(p);
    // I moduli compilabili NON sono più .md singoli: sono cartelle con boxes.yml + pagine PNG.
    // L'indicizzazione globale legge solo content/moduli/index.yml; i dettagli (boxes.yml e PNG)
    // vengono fetch lazy quando l'utente apre un modulo specifico.
    else if (p.startsWith('cestino/') && p.endsWith('.md')) cestinoPaths.push(p);
  });
  // Track which extended directories exist (for lazy-load toggles)
  state.numeriExtendedAvailable = {
    osa: !!specialFiles.numeriOsa,
    iov: !!specialFiles.numeriIov
  };

  // Parallel fetch all md files in batches of 10 to avoid overwhelming API
  async function fetchBatch(paths) {
    const results = [];
    const batchSize = 10;
    for (let i = 0; i < paths.length; i += batchSize) {
      const batch = paths.slice(i, i + batchSize);
      const batchResults = await Promise.all(batch.map(p =>
        gh.getFile(p).catch(e => { console.warn('fetch error', p, e); return null; })
      ));
      results.push(...batchResults);
    }
    return results;
  }

  // Fetch everything in parallel
  const [procFiles, clinicaFiles, cestinoFiles, numeriFile, capitoliFile, calendarFile, moduliIndexFile] = await Promise.all([
    fetchBatch(procPaths),
    fetchBatch(clinicaPaths),
    fetchBatch(cestinoPaths),
    specialFiles.numeri ? gh.getFile(specialFiles.numeri).catch(() => null) : Promise.resolve(null),
    specialFiles.capitoli ? gh.getFile(specialFiles.capitoli).catch(() => null) : Promise.resolve(null),
    specialFiles.calendar ? gh.getFile(specialFiles.calendar).catch(() => null) : Promise.resolve(null),
    specialFiles.moduliIndex ? gh.getFile(specialFiles.moduliIndex).catch(() => null) : Promise.resolve(null)
  ]);

  // Process procedure files
  // Path schema (cartella per scheda): content/procedure/<cat>/[<sub>/[<sotto>/]]<slug>/scheda.md
  // Lo slug è il nome della CARTELLA (penultimo elemento), non il filename.
  procFiles.forEach((file, i) => {
    if (!file) return;
    const path = procPaths[i];
    const { frontmatter, body } = parseMarkdown(file.content);
    const relPath = path.replace(/^content\/procedure\//, '');
    const parts = relPath.split('/');
    // parts: [cat, ...nested, slug, 'scheda.md']
    // Tolgo 'scheda.md' (ultimo) → resta [cat, ...nested, slug]
    const dirParts = parts.slice(0, -1);
    const slug = dirParts[dirParts.length - 1];
    const categoryParts = dirParts.slice(0, -1);  // tutto prima dello slug
    const autoCategoria = categoryParts[0] || (frontmatter.categoria || 'altre');
    const autoSottocategoria = categoryParts[1] || null;
    const autoSottoSotto = categoryParts[2] || null;
    index.procedure.push({
      ...frontmatter,
      slug, path, sha: file.sha,
      categoria: frontmatter.categoria || autoCategoria,
      sottocategoria: frontmatter.sottocategoria || autoSottocategoria || autoSottoSotto,
      body_preview: body.substring(0, 300),
      body
    });
  });

  // Process clinica files
  // Path schema: content/clinica/[<sub>/[<sotto>/]]<slug>/scheda.md
  clinicaFiles.forEach((file, i) => {
    if (!file) return;
    const path = clinicaPaths[i];
    const { frontmatter, body } = parseMarkdown(file.content);
    const relPath = path.replace(/^content\/clinica\//, '');
    const parts = relPath.split('/');
    const dirParts = parts.slice(0, -1);  // toglie 'scheda.md'
    const slug = dirParts[dirParts.length - 1];
    const categoryParts = dirParts.slice(0, -1);  // sotto-cartelle prima dello slug
    const autoSottocategoria = categoryParts[0] || null;
    const autoSottoSotto = categoryParts[1] || null;
    index.clinica.push({
      ...frontmatter,
      slug, path, sha: file.sha,
      categoria: 'clinica',
      sottocategoria: frontmatter.sottocategoria || autoSottocategoria,
      sotto_sottocategoria: frontmatter.sotto_sottocategoria || autoSottoSotto,
      body_preview: body.substring(0, 300),
      body
    });
  });

  // Process moduli compilabili — l'indice è un singolo content/moduli/index.yml
  // che elenca slug, titolo, descrizione, pagine, autore, aggiornato.
  // I dettagli (boxes.yml, PNG) si fetcheranno lazy quando l'utente apre un modulo.
  if (moduliIndexFile) {
    try {
      const parsed = jsyaml.load(moduliIndexFile.content) || {};
      const arr = parsed.moduli || [];
      arr.forEach(m => {
        if (!m || !m.slug) return;
        index.moduli.push({
          slug: m.slug,
          path: `content/moduli/${m.slug}/`,
          titolo: m.titolo || m.slug,
          descrizione: m.descrizione || '',
          tag: Array.isArray(m.tag) ? m.tag : [],
          termini_equivalenti: Array.isArray(m.termini_equivalenti) ? m.termini_equivalenti : [],
          note: m.note || '',
          pagine: m.pagine || 1,
          autore: m.autore || '',
          categoria: m.categoria || '',
          aggiornato: m.aggiornato || null,
          ultima_modifica: m.aggiornato || null  // alias per timeAgo() usato altrove
        });
      });
    } catch (e) { console.warn('YAML parse error moduli/index.yml', e); }
  }

  // Process cestino
  cestinoFiles.forEach((file, i) => {
    if (!file) return;
    const path = cestinoPaths[i];
    const filename = path.split('/').pop();
    const { frontmatter } = parseMarkdown(file.content);
    index.cestino.push({ filename, path, sha: file.sha, ...frontmatter });
  });

  // Numeri.yml (AOPD — sempre caricato)
  if (numeriFile) {
    try {
      const parsed = jsyaml.load(numeriFile.content) || {};
      // Tag every group with its source ospedale (default 'aopd')
      const ospedaleId = (parsed.ospedale && parsed.ospedale.id) || 'aopd';
      (parsed.gruppi || []).forEach(g => { g._source = ospedaleId; });
      index.numeri = { ...parsed, _sha: numeriFile.sha, _path: numeriFile.path };
    } catch (e) { console.warn('numeri parse error', e); }
  }
  // Initialize extended numeri stash (filled on demand by loadExtendedNumeri)
  index.numeriExtended = { osa: null, iov: null };

  // Capitoli.yml
  // capitoli.yml non è più usato (sezione Manuale rimossa); index.capitoli resta vuoto.


  // Calendar.yml (eventi condivisi)
  index.calendar = { eventi: [], _sha: null, _path: 'content/calendar.yml' };
  if (calendarFile) {
    try {
      const parsed = jsyaml.load(calendarFile.content) || {};
      const eventi = Array.isArray(parsed.eventi) ? parsed.eventi : [];
      // Migrazione in-memory: vecchia categoria 'didattica' → 'seminari'
      eventi.forEach(e => { if (e && e.categoria === 'didattica') e.categoria = 'seminari'; });
      index.calendar = {
        eventi,
        _sha: calendarFile.sha,
        _path: calendarFile.path
      };
    } catch (e) { console.warn('calendar parse error', e); }
  }

  state.index = index;
  // LetterAI: pre-carica la libreria casi in background, così il conteggio in sidebar
  // è pronto. Non-bloccante e best-effort: se il modulo non è ancora caricato o le cartelle
  // non esistono, il modulo carica comunque on-demand all'apertura della sezione.
  if (typeof ensureLetterAI === 'function') {
    ensureLetterAI()
      .then(L => L && typeof L.loadLibrary === 'function' ? L.loadLibrary() : null)
      .catch(e => console.warn('[LetterAI] preload libreria', e));
  }
  // Restore extended-numeri toggles from session (load in background)
  try {
    const saved = JSON.parse(sessionStorage.getItem('numeri_show_ext') || '{}');
    state.showExtendedNumeri = { osa: !!saved.osa, iov: !!saved.iov };
    // Load on-demand quando l'utente preme i chip OSA/IOV
    if (state.showExtendedNumeri.osa && state.numeriExtendedAvailable.osa) {
      loadExtendedNumeri('osa').catch(e => console.warn('OSA load failed', e));
    }
    if (state.showExtendedNumeri.iov && state.numeriExtendedAvailable.iov) {
      loadExtendedNumeri('iov').catch(e => console.warn('IOV load failed', e));
    }
  } catch (e) {
    state.showExtendedNumeri = { osa: false, iov: false };
  }
  rebuildSearchIndex();
  updateNavCounts();
  saveEtagCacheToSession();
  updateRateLimitIndicator();

  const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
  console.log(`[buildIndex] ${elapsed}s — ${index.procedure.length}p ${index.clinica.length}c ${index.moduli.length}m · rate ${rateLimit.remaining}/${rateLimit.limit}`);
  return index;
}

// ---- Extended numeri (OSA / IOV) lazy loading ----------------------------

// Entry-point per i chip OSA/IOV nella rubrica: carica on-demand + naviga
async function openExtendedSource(source) {
  if (source !== 'osa' && source !== 'iov') return;
  if (!state.numeriExtendedAvailable || !state.numeriExtendedAvailable[source]) {
    toast(`File numeri-${source}.yml non disponibile nel repo`, 'error');
    return;
  }
  // Flag di visualizzazione persistente (usato anche dalla search)
  if (!state.showExtendedNumeri) state.showExtendedNumeri = { osa: false, iov: false };
  state.showExtendedNumeri[source] = true;
  try { sessionStorage.setItem('numeri_show_ext', JSON.stringify(state.showExtendedNumeri)); } catch {}
  // Se non caricato, caricalo ora (blocking con piccolo feedback)
  if (!state.index?.numeriExtended?.[source]) {
    try {
      await loadExtendedNumeri(source);
    } catch (e) {
      toast(`Errore nel caricamento ${source.toUpperCase()}: ${e.message}`, 'error');
      return;
    }
  }
  navigate('numeri', { filter: source });
}

async function loadExtendedNumeri(source) {
  // source = 'osa' | 'iov'
  if (!state.index) return null;
  if (!state.index.numeriExtended) state.index.numeriExtended = { osa: null, iov: null };
  if (state.index.numeriExtended[source]) return state.index.numeriExtended[source]; // already loaded
  const path = `content/numeri-${source}.yml`;
  try {
    const file = await gh.getFile(path);
    if (!file) return null;
    const parsed = jsyaml.load(file.content) || {};
    const ospedaleId = (parsed.ospedale && parsed.ospedale.id) || source;
    (parsed.gruppi || []).forEach(g => { g._source = ospedaleId; });
    state.index.numeriExtended[source] = parsed;
    rebuildSearchIndex();
    return parsed;
  } catch (e) {
    console.warn(`Errore caricamento numeri-${source}.yml`, e);
    toast(`Impossibile caricare la rubrica ${source.toUpperCase()}`, 'error');
    return null;
  }
}

function getVisibleNumeriGroups() {
  // Returns all groups: AOPD + OSA + IOV (se disponibili)
  // Il filtro per source avviene in renderNumeri quando filter='osa' o 'iov'.
  const groups = [];
  if (state.index?.numeri?.gruppi) groups.push(...state.index.numeri.gruppi);
  const ext = state.index?.numeriExtended || {};
  if (ext.osa?.gruppi) groups.push(...ext.osa.gruppi);
  if (ext.iov?.gruppi) groups.push(...ext.iov.gruppi);
  return groups;
}

async function toggleExtendedNumeri(source, on) {
  if (!state.showExtendedNumeri) state.showExtendedNumeri = { osa: false, iov: false };
  state.showExtendedNumeri[source] = !!on;
  try { sessionStorage.setItem('numeri_show_ext', JSON.stringify(state.showExtendedNumeri)); } catch (e) {}
  if (on && state.numeriExtendedAvailable?.[source] && !state.index.numeriExtended?.[source]) {
    toast(`Caricamento rubrica ${source.toUpperCase()}...`, 'info', 1500);
    await loadExtendedNumeri(source);
  }
  rebuildSearchIndex();
  renderNavTree();
  if (state.currentView === 'numeri') navigate('numeri', state.currentParams || {});
}

// Legacy fallback in case the tree API fails
async function buildIndexFallback() {
  console.warn('Using legacy recursive index walk (slower)');
  const index = { procedure: [], clinica: [], moduli: [], cestino: [], numeri: null, capitoli: [], lastIndexed: nowIso() };
  async function walk(dir, target) {
    try {
      const items = await gh.listDir(dir);
      for (const it of items) {
        if (it.type === 'dir') await walk(it.path, target);
        else if (it.type === 'file' && it.name === 'scheda.md') {
          // Schema cartella per scheda: slug = nome cartella padre, NON nome file
          const file = await gh.getFile(it.path);
          if (!file) continue;
          const { frontmatter, body } = parseMarkdown(file.content);
          const parts = it.path.split('/');
          const slug = parts[parts.length - 2];  // penultimo = cartella scheda
          target.push({ slug, path: it.path, sha: file.sha, ...frontmatter, body, body_preview: body.substring(0,300) });
        }
      }
    } catch (e) {}
  }
  await walk('content/procedure', index.procedure);
  await walk('content/clinica', index.clinica);
  // I moduli compilabili NON sono più .md: leggo content/moduli/index.yml
  try {
    const f = await gh.getFile('content/moduli/index.yml').catch(() => null);
    if (f) {
      const parsed = jsyaml.load(f.content) || {};
      (parsed.moduli || []).forEach(m => {
        if (!m || !m.slug) return;
        index.moduli.push({
          slug: m.slug,
          path: `content/moduli/${m.slug}/`,
          titolo: m.titolo || m.slug,
          descrizione: m.descrizione || '',
          tag: Array.isArray(m.tag) ? m.tag : [],
          termini_equivalenti: Array.isArray(m.termini_equivalenti) ? m.termini_equivalenti : [],
          note: m.note || '',
          pagine: m.pagine || 1,
          autore: m.autore || '',
          categoria: m.categoria || '',
          aggiornato: m.aggiornato || null,
          ultima_modifica: m.aggiornato || null
        });
      });
    }
  } catch (e) { console.warn('walk moduli/index.yml error', e); }
  state.index = index;
  rebuildSearchIndex();
  updateNavCounts();
  return index;
}

function rebuildSearchIndex() {
  const docs = [];
  state.index.procedure.forEach(p => docs.push({
    type: 'procedura', slug: p.slug,
    titolo: p.titolo || p.slug,
    tag: (p.tag || []).join(' '),
    termini: (p.termini_equivalenti || []).join(' '),
    body: ''
  }));
  (state.index.clinica || []).forEach(c => docs.push({
    type: 'clinica', slug: c.slug,
    titolo: c.titolo || c.slug,
    tag: (c.tag || []).join(' '),
    termini: (c.termini_equivalenti || []).join(' '),
    body: ''
  }));
  state.index.moduli.forEach(m => docs.push({
    type: 'modulo', slug: m.slug,
    titolo: m.titolo || m.slug,
    // Fuse (extended search) valuta l'AND multi-token PER CAMPO: perché "modulo consenso" matchi
    // (dove "modulo" è termine di tipo e "consenso" è nel titolo) raccolgo titolo + descrizione +
    // termini-tipo nello STESSO campo (tag), così l'AND per-campo trova entrambi i token.
    tag: ((m.tag || []).join(' ') + ' ' + (m.termini_equivalenti || []).join(' ') + ' ' + (m.titolo || m.slug) + ' ' + (m.descrizione || '') + ' modulo moduli modulistica').trim(),
    termini: ((m.termini_equivalenti || []).join(' ') + ' modulo moduli modulistica').trim(),
    body: ''
  }));
  getVisibleNumeriGroups().filter(g => (g._source || 'aopd') === 'aopd').forEach(g => {
    const groupTags = (g.tag || []).join(' ');
    // Precomputo il bucketing contatto→tipo_sede una volta per gruppo
    let sedeBuckets = [];
    try {
      if (typeof groupContattiBySede === 'function') {
        sedeBuckets = groupContattiBySede(g.contatti || [], g.sezioni);
      }
    } catch {}
    const contactToSedeTipo = new Map();
    sedeBuckets.forEach(b => {
      const tipo = b.sede && b.sede.tipo ? b.sede.tipo : '';
      if (tipo) (b.contatti || []).forEach(c => contactToSedeTipo.set(c.id, tipo));
    });
    // Sinonimi per tipi di sede, così cercare "ucic" matcha anche "unità coronarica"
    const sedeTipoAliases = {
      terapia_intensiva: 'terapia intensiva rianimazione',
      semi_intensiva: 'semi intensiva subintensiva',
      diagnostica: 'diagnostica esami strumentali',
      day_hospital: 'day hospital dh',
      sala_operatoria: 'sala operatoria',
      reparto: 'reparto degenze degenza',
      studi_medici: 'studi medici studio medico',
      ambulatori: 'ambulatori ambulatorio amb',
      laboratorio: 'laboratorio',
      segreteria_direzione: 'segreteria direzione segr portineria'
    };
    (g.contatti || []).forEach(c => {
      const cellFlat = Array.isArray(c.cellulare_personale) ? c.cellulare_personale.join(' ') : (c.cellulare_personale || '');
      const cellPubFlat = Array.isArray(c.cellulare_aziendale) ? c.cellulare_aziendale.join(' ') : (c.cellulare_aziendale || '');
      const numeriStr = [...(c.numeri || []), cellFlat, cellPubFlat, c.breve].filter(Boolean).join(' ');
      const sedi = g.sezioni || [];
      const sedeStr = sedi.map(s => [s.edificio, s.piano].filter(Boolean).join(' ')).join(' ');
      const kind = (typeof classifyContatto === 'function') ? classifyContatto(c).kind : '';
      const kindAliases = {
        guardia: 'guardia mdg reperibile',
        reparto: 'reparto degenza degenze',
        utile: 'utile'
      };
      const sedeTipo = contactToSedeTipo.get(c.id) || '';
      const sedeTipoStr = sedeTipoAliases[sedeTipo] || sedeTipo;
      // Forme "compatte" senza spazi/punti per gestire query concatenate (es. "neuroanestesia"
      // che deve matchare "Neuro Anestesia"). Aggiungo le versioni compatte di gruppo/etichetta/
      // sezione al campo `termini` perché Fuse fuzzy non gestisce bene rimozioni di spazio.
      const stripSep = s => (s || '').replace(/[\s\-_.]+/g, '');
      const compactForms = [
        stripSep(g.nome),
        stripSep(c.etichetta),
        stripSep(c.sezione)
      ].filter(s => s && s.length > 3).join(' ');
      const termini = [
        c.sezione || '',
        kind,
        kindAliases[kind] || '',
        sedeTipoStr,
        compactForms
      ].filter(Boolean).join(' ');
      docs.push({
        type: 'numero', slug: c.id,
        titolo: c.etichetta,
        gruppo: g.nome,
        gruppoId: g.id,
        direttore: g.direttore || '',
        numeri: numeriStr,
        ospedale: g._source || 'aopd',
        sezione: c.sezione || '',
        tag: (c.tag || []).join(' '),
        keywords: [c.nome_breve || '', groupTags].filter(Boolean).join(' '),
        termini: termini,
        _dedupKey: `numero:${c.id || c.etichetta}`
      });
    });
  });
  // Dedup per _dedupKey: tengo il primo (es. contatti con stesso id duplicati in più sezioni della stessa UOC)
  const seenKeys = new Set();
  const dedupedDocs = docs.filter(d => {
    if (!d._dedupKey) return true;
    if (seenKeys.has(d._dedupKey)) return false;
    seenKeys.add(d._dedupKey);
    return true;
  });
  state.fuse = new Fuse(dedupedDocs, {
    keys: [
      { name: 'gruppo', weight: 4 },
      { name: 'titolo', weight: 3 },
      { name: 'keywords', weight: 3 },
      { name: 'termini', weight: 2 },
      { name: 'tag', weight: 2 },
      { name: 'numeri', weight: 1 },
      { name: 'sezione', weight: 1 },
      { name: 'body', weight: 0.5 }
    ],
    threshold: 0.35, includeMatches: true, includeScore: true, minMatchCharLength: 1,
    ignoreLocation: true,
    useExtendedSearch: true
  });
}

function updateNavCounts() {
  // The new dynamic sidebar uses renderNavTree() instead of static counters.
  // Keep this for backward compat (called from many places).
  if (typeof renderNavTree === 'function') renderNavTree();
}

/* ============================ LOCKS ============================ */
const locks = {
  _renewTimer: null,
  async load() {
    const file = await gh.getFile('locks.yml');
    if (!file) return { locks: {}, _sha: null };
    const data = jsyaml.load(file.content) || {};
    return { locks: data.locks || {}, _sha: file.sha };
  },
  async write(locksObj, sha, action) {
    const header = "# Lock advisory per edit simultanei\n# Gestito dall'app, non modificare a mano\n\n";
    const locksYaml = Object.keys(locksObj).length === 0
      ? 'locks: {}\n'
      : 'locks:\n' + jsyaml.dump(locksObj, { indent: 2, lineWidth: 120 }).replace(/^/gm, '  ');
    const content = header + locksYaml;
    // silent: i lock sono plumbing (acquire/release/renew in background), niente overlay.
    return gh.putFile('locks.yml', content, sha, `chore(locks): ${action}`, false, { silent: true });
  },
  isExpired(lock) {
    if (!lock || !lock.scade) return true;
    return new Date(lock.scade) < new Date();
  },
  /* Pulisce i lock scaduti dall'oggetto. Ritorna true se qualcosa è stato rimosso. */
  _pruneExpired(locksObj) {
    let removed = 0;
    const myUser = state.session && state.session.username;
    for (const slug of Object.keys(locksObj)) {
      const lock = locksObj[slug];
      if (this.isExpired(lock)) {
        delete locksObj[slug];
        removed++;
      }
    }
    return removed;
  },
  async acquire(slug) {
    try {
      const { locks: all, _sha } = await this.load();
      // Rimuovi prima tutti i lock scaduti (pulizia opportunistica)
      const pruned = this._pruneExpired(all);
      const existing = all[slug];
      if (existing && !this.isExpired(existing) && existing.utente !== state.session.username) {
        // Se c'era pulizia da fare ma non possiamo acquisire, scriviamo comunque per ripulire
        if (pruned > 0) {
          try { await this.write(all, _sha, `cleanup ${pruned} expired lock(s)`); } catch(e) {}
        }
        return { acquired: false, heldBy: existing.utente, since: existing.iniziato, expires: existing.scade };
      }
      const now = new Date();
      all[slug] = {
        utente: state.session.username,
        iniziato: now.toISOString(),
        scade: new Date(now.getTime() + CONFIG.LOCK_DURATION_MS).toISOString()
      };
      const action = pruned > 0
        ? `acquire ${slug} by ${state.session.username} (+ cleanup ${pruned} expired)`
        : `acquire ${slug} by ${state.session.username}`;
      await this.write(all, _sha, action);
      this._startRenew(slug);
      return { acquired: true };
    } catch (e) {
      console.warn('lock acquire failed', e);
      return { acquired: true, warning: 'Lock non registrato' };
    }
  },
  async release(slug) {
    this._stopRenew();
    try {
      const { locks: all, _sha } = await this.load();
      // Opportunità di pulizia durante il release
      const pruned = this._pruneExpired(all);
      let mineReleased = false;
      if (all[slug] && all[slug].utente === state.session.username) {
        delete all[slug];
        mineReleased = true;
      }
      if (mineReleased || pruned > 0) {
        const parts = [];
        if (mineReleased) parts.push(`release ${slug} by ${state.session.username}`);
        if (pruned > 0) parts.push(`cleanup ${pruned} expired`);
        await this.write(all, _sha, parts.join(' + '));
      }
    } catch (e) { console.warn('lock release failed', e); }
  },
  _startRenew(slug) {
    this._stopRenew();
    this._renewTimer = setTimeout(async () => {
      try {
        const { locks: all, _sha } = await this.load();
        if (all[slug] && all[slug].utente === state.session.username) {
          all[slug].scade = new Date(Date.now() + CONFIG.LOCK_DURATION_MS).toISOString();
          await this.write(all, _sha, `renew ${slug}`);
          this._startRenew(slug);
        }
      } catch (e) { console.warn('lock renew failed', e); }
    }, CONFIG.LOCK_RENEW_MS);
  },
  _stopRenew() { if (this._renewTimer) { clearTimeout(this._renewTimer); this._renewTimer = null; } }
};

/* ============================ LOGIN ============================ */
async function loadTokensFile() {
  try {
    const url = `${CONFIG.API_BASE}/repos/${CONFIG.REPO_OWNER}/${CONFIG.AUTH_REPO_NAME}/contents/data/encrypted-tokens.json?ref=${CONFIG.BRANCH}&t=${Date.now()}`;
    const res = await fetch(url, {
      headers: {
        'Authorization': `token ${BOOTSTRAP_PAT}`,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      },
      cache: 'no-store'
    });
    if (res.status === 404) throw new Error('File data/encrypted-tokens.json non trovato nel repo auth');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const meta = await res.json();
    if (!meta.content) throw new Error('File auth vuoto');
    const json = new TextDecoder().decode(base64ToBuffer(meta.content.replace(/\n/g, '')));
    return JSON.parse(json);
  } catch (e) {
    throw new Error(`Impossibile caricare credenziali dal repo auth. Verifica PAT-1 e nome repo. (${e.message})`);
  }
}

async function attemptLogin(username, passphrase) {
  const loginError = $('login-error');
  const btn = $('login-submit');
  const btnText = $('login-submit-text');
  loginError.classList.remove('visible');
  btn.classList.add('is-loading');
  btn.setAttribute('aria-busy', 'true');
  btn.style.pointerEvents = 'none';
  btnText.innerHTML = '<span class="btn-spinner"></span>';

  try {
    if (!state.tokensFile) state.tokensFile = await loadTokensFile();
    const entry = (state.tokensFile.utenti || {})[username];
    if (!entry) throw new Error('Username non riconosciuto.');
    let payload;
    try { payload = await decryptUserData(entry, passphrase); }
    catch { throw new Error('Passphrase errata.'); }

    // Schema 3.1: token_data è il PAT principale per i contenuti.
    // Compatibilità legacy: accetta 'token' se token_data manca (schema 1.x/2.x).
    const tokenData = payload.token_data || payload.token;
    if (!tokenData) throw new Error('Payload cifrato non valido (manca token_data).');

    // Validazione del token contro il repo data
    const testRes = await fetch(`${CONFIG.API_BASE}/repos/${CONFIG.REPO_OWNER}/${CONFIG.DATA_REPO_NAME}`, {
      headers: { 'Authorization': `token ${tokenData}`, 'Accept': 'application/vnd.github+json' }
    });
    if (!testRes.ok) throw new Error(`Token dati non valido (HTTP ${testRes.status}).`);

    // is_admin è in chiaro nell'entry (fuori dal ciphertext)
    const isAdmin = !!entry.is_admin;
    const tokenAuth = payload.token_auth || null;
    // Check di coerenza: admin deve avere token_auth
    if (isAdmin && !tokenAuth) {
      console.warn('Utente marcato is_admin=true ma senza token_auth nel payload. UI admin disabilitata.');
    }

    state.session = {
      username,
      tokenData: tokenData,
      tokenAuth: tokenAuth,          // null per utenti normali
      isAdmin: isAdmin && !!tokenAuth,  // solo se token_auth presente davvero
      // Permessi risolti al login: override utente > default del ruolo > 'edit'
      permessi: permessiPerSessione(entry, state.tokensFile),
      ruolo: payload.ruolo || entry.ruolo || null,
      nome: payload.nome || null,
      cognome: payload.cognome || null
    };
    saveSession();
    // Login validato: ri-mostro lo splash animato a copertura del caricamento
    // dell'app (buildIndex ecc.), così la pagina non resta sul "Caricamento…".
    showBootSplash();
    await enterApp();
  } catch (e) {
    loginError.textContent = e.message;
    loginError.classList.add('visible');
  } finally {
    btn.classList.remove('is-loading');
    btn.removeAttribute('aria-busy');
    btn.style.pointerEvents = '';
    btnText.textContent = 'Accedi';
    // App pronta (o errore): nascondo lo splash. Idempotente: se non era stato
    // mostrato (es. passphrase errata) qui è già 'splash-done' e non fa nulla.
    hideBootSplash();
  }
}

async function enterApp() {
  // Carica le preferenze utente PRIMA di mostrare l'app: applyTheme/applyFontSize
  // vengono chiamate dentro userPrefs.load(), così quando rivelo app-view il tema
  // è già quello corretto (zero flash, anche al primo login della sessione).
  // Lo spinner sul bottone "Accedi" del login resta visibile fino a qui.
  try {
    await userPrefs.load();
  } catch (e) {
    console.warn('[enterApp] userPrefs.load failed, proseguo con default:', e);
  }
  $('login-view').classList.add('hidden');
  $('app-view').classList.remove('hidden');
  const displayName = (state.session.nome && state.session.cognome)
    ? `${state.session.nome} ${state.session.cognome}`
    : state.session.username;
  $('user-name-display').textContent = displayName;
  const avatarSource = (state.session.nome && state.session.cognome)
    ? state.session.nome[0] + state.session.cognome[0]
    : state.session.username.substring(0, 2);
  $('user-avatar').textContent = avatarSource.toUpperCase();
  const isAdminNow = !!state.session.isAdmin;
  $('nav-utenti').classList.toggle('hidden', !isAdminNow);
  const umSegn = document.getElementById('user-menu-segnalazioni');
  if (umSegn) umSegn.classList.toggle('hidden', !isAdminNow);
  const umUtenti = document.getElementById('user-menu-utenti');
  if (umUtenti) umUtenti.classList.toggle('hidden', !isAdminNow);
  const umRich = document.getElementById('user-menu-richieste');
  if (umRich) umRich.classList.toggle('hidden', !isAdminNow);
  if (isAdminNow) {
    document.getElementById('rate-limit-indicator').classList.remove('hidden');
  }
  // Sessione ripristinata (non appena loggata): riallinea i permessi al file auth,
  // così le modifiche dell'admin valgono dal riavvio dell'app e non dal prossimo login.
  // Non blocca il boot: aggiorna nav e sessione quando la fetch ritorna.
  if (!state.tokensFile) refreshPermessiSessione();
  // Applica body class per personalizzazione UI in base al ruolo
  if (state.session.ruolo) {
    document.body.dataset.ruolo = state.session.ruolo;
  }
  renderLoading('Caricamento…');
  try {
    await buildIndex();
    // Inizializza il router URL (listeners) e leggi lo stato iniziale dall'URL.
    // Se l'URL contiene una rotta valida (es. l'utente è arrivato su #/procedura/rachicentesi
    // tramite bookmark/refresh/link da NotebookLM), atterra direttamente lì.
    urlRouter.init();
    const initial = urlRouter.readUrl();
    if (initial.blockHash) state.pendingBlockHash = initial.blockHash;
    navigate(initial.route, initial.params);
    // Se atterriamo sulla home in PWA standalone, arma la guardia anti-uscita
    // (silenziosa, senza toast). Necessario qui perché updateUrl non riapplica
    // pushState se l'URL è già quello atteso. Riprovo dopo un tick perché il match
    // di display-mode:standalone può non essere ancora pronto subito dopo il launch
    // della PWA (specie su iOS): senza questo retry, all'apertura diretta sulla home
    // la guardia non si armava e un singolo back usciva subito dall'app.
    const _armGuardIfNeeded = () => {
      if (_backGuardArmed) return;
      const ctx = shouldGuardBack();
      if (ctx.active) armBackGuard(ctx.silent);
    };
    _armGuardIfNeeded();
    setTimeout(_armGuardIfNeeded, 300);
  } catch (e) {
    renderError('Errore caricamento indice', e.message);
  }
}

// === DEVICE CATEGORY ===
// 3 categorie per le preferenze tema/font: mobile (<=700px), tablet (701-1024px), desktop (>=1025px).
// La categoria viene "congelata" al primo accesso della sessione per evitare che ridimensionando
// la finestra del browser le preferenze cambino al volo (sarebbe disorientante).
function _detectDeviceCategoryNow() {
  const w = window.innerWidth;
  if (w <= 700) return 'mobile';
  if (w <= 1024) return 'tablet';
  return 'desktop';
}
function getDeviceCategory() {
  // Memorizzato in sessionStorage solo per stabilità nella sessione corrente,
  // non come preferenza persistente. Sparisce a chiusura tab.
  try {
    const cached = sessionStorage.getItem('collinettaai.device-category');
    if (cached === 'mobile' || cached === 'tablet' || cached === 'desktop') return cached;
  } catch {}
  const cat = _detectDeviceCategoryNow();
  try { sessionStorage.setItem('collinettaai.device-category', cat); } catch {}
  return cat;
}

// === TEMA E FONT ===
// Le preferenze sono salvate nel repo dati come parte di userPrefs.yml, separate per categoria
// di dispositivo (mobile/tablet/desktop). Niente più localStorage: l'utente ritrova tema/font
// su qualsiasi dispositivo dello stesso tipo dove fa login con la stessa identità, ma può
// avere preferenze diverse tra mobile e desktop (es. dark sul telefono, light sul Mac).
// Pre-login si usano i default: tema 'auto' e font 'md'.
function setTheme(theme) {
  applyTheme(theme);
  document.querySelectorAll('.theme-opt').forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
  // Salva nelle preferenze utente per la categoria di dispositivo corrente (solo se loggato)
  if (state.userPrefs) {
    const cat = getDeviceCategory();
    if (!state.userPrefs.device_prefs) state.userPrefs.device_prefs = {};
    if (!state.userPrefs.device_prefs[cat]) state.userPrefs.device_prefs[cat] = {};
    state.userPrefs.device_prefs[cat].tema = theme;
    if (typeof userPrefs !== 'undefined' && userPrefs.scheduleSave) userPrefs.scheduleSave();
  }
}
const FONT_SIZES = ['sm', 'md', 'lg', 'xl'];
const FONT_LABELS = { sm: 'Piccolo', md: 'Medio', lg: 'Grande', xl: 'Extra grande' };
function setFontSize(size) {
  if (!FONT_SIZES.includes(size)) size = 'md';
  applyFontSize(size);
  if (state.userPrefs) {
    const cat = getDeviceCategory();
    if (!state.userPrefs.device_prefs) state.userPrefs.device_prefs = {};
    if (!state.userPrefs.device_prefs[cat]) state.userPrefs.device_prefs[cat] = {};
    state.userPrefs.device_prefs[cat].font_size = size;
    if (typeof userPrefs !== 'undefined' && userPrefs.scheduleSave) userPrefs.scheduleSave();
  }
}
function changeFontSize(delta) {
  // Legge il valore corrente dall'attributo DOM (sempre aggiornato)
  const current = document.documentElement.getAttribute('data-font-size') || 'md';
  const idx = FONT_SIZES.indexOf(current);
  const next = Math.max(0, Math.min(FONT_SIZES.length - 1, idx + delta));
  setFontSize(FONT_SIZES[next]);
}

// applyTheme/applyFontSize: applicano solo a livello DOM, senza toccare le preferenze.
// Usate sia in init (default auto/md) sia in load() di userPrefs (con preferenze caricate).
// Scrivono anche in sessionStorage per essere lette dallo script inline al prossimo refresh
// (evita il FOUC: flash of unstyled content tra default scuro/chiaro e preferenza utente).
function applyTheme(theme) {
  let effective = theme;
  if (theme === 'auto' || !theme) {
    effective = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', effective);
  // Memorizzo la scelta utente (auto/light/dark) per il listener prefers-color-scheme
  document.documentElement.setAttribute('data-theme-pref', theme || 'auto');
  // Cache in sessionStorage + localStorage: il prossimo refresh (anche cold start PWA)
  // applica subito il tema giusto, senza aspettare la fetch di userPrefs da GitHub.
  try { sessionStorage.setItem('collinettaai.theme-cache', theme || 'auto'); } catch {}
  try { localStorage.setItem('collinettaai.theme-pref', theme || 'auto'); } catch {}
  // Aggiorno UI dei pulsanti scelta tema
  document.querySelectorAll('.theme-opt').forEach(b => b.classList.toggle('active', b.dataset.theme === (theme || 'auto')));
}
function applyFontSize(size) {
  if (!FONT_SIZES.includes(size)) size = 'md';
  document.documentElement.setAttribute('data-font-size', size);
  // Cache anche il font_size per evitare layout shift al refresh / cold start
  try { sessionStorage.setItem('collinettaai.font-cache', size); } catch {}
  try { localStorage.setItem('collinettaai.font-pref', size); } catch {}
  const label = document.getElementById('font-size-label');
  if (label) label.textContent = FONT_LABELS[size];
  const btns = document.querySelectorAll('.font-step-btn');
  if (btns.length === 2) {
    const idx = FONT_SIZES.indexOf(size);
    btns[0].disabled = idx === 0;
    btns[1].disabled = idx === FONT_SIZES.length - 1;
  }
}
function initTheme() {
  // Cleanup: rimuovi le vecchie chiavi localStorage usate prima del refactor.
  // Le preferenze tema/font ora vivono nel repo dati (userPrefs).
  try { localStorage.removeItem('collinetta-theme'); } catch {}
  try { localStorage.removeItem('collinetta-font-size'); } catch {}
  // Pre-login: applico la preferenza già salvata (localStorage), così su refresh il tema
  // resta quello scelto dall'utente. NON forzo 'auto': forzarlo sovrascriverebbe il tema
  // corretto applicato dallo script anti-FOUC, causando il flash dark→light prima che
  // userPrefs.load() ripristini la preferenza reale.
  let _bootTheme = 'auto', _bootFont = 'md';
  try { _bootTheme = localStorage.getItem('collinettaai.theme-pref') || 'auto'; } catch {}
  try { _bootFont = localStorage.getItem('collinettaai.font-pref') || 'md'; } catch {}
  applyTheme(_bootTheme);
  applyFontSize(_bootFont);
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      // Se la preferenza utente è "auto", aggiorno il tema effettivo quando il sistema cambia
      const pref = document.documentElement.getAttribute('data-theme-pref') || 'auto';
      if (pref === 'auto') applyTheme('auto');
    });
  }
}
// Close dropdown on outside click
document.addEventListener('click', (e) => {
  const dd = document.getElementById('user-menu-dropdown');
  const btn = document.getElementById('user-menu-btn');
  if (!dd || dd.classList.contains('hidden')) return;
  if (btn && btn.contains(e.target)) return;
  if (dd.contains(e.target)) return;
  closeUserMenu();
});

function logout() {
  // Flush any pending pin saves before losing session
  if (state.userPrefs && state.userPrefs._pending) {
    if (state.userPrefs._saveTimer) clearTimeout(state.userPrefs._saveTimer);
    userPrefs.persist().catch(() => {}); // fire-and-forget
  }
  clearSession();
  state.index = { procedure: [], clinica: [], moduli: [], cestino: [], numeri: null, capitoli: [], lastIndexed: null };
  state.editingContext = null;
  state.userPrefs = null;
  state.userPrefsPath = null;
  // Clear ETag cache + rate limit indicator
  etagCache.clear();
  try { sessionStorage.removeItem('collinettaai.etags'); } catch {}
  rateLimit.remaining = null; rateLimit.limit = null; rateLimit.resetAt = null;
  const rl = document.getElementById('rate-limit-indicator');
  if (rl) { rl.classList.add('hidden'); rl.textContent = '— /—'; }
  $('app-view').classList.add('hidden');
  $('login-view').classList.remove('hidden');
  $('login-username').value = '';
  $('login-passphrase').value = '';
  $('login-error').classList.remove('visible');
}


/* ============================ ROUTER ============================ */
/* ============================ URL ROUTER ============================
   Sincronizza stato app ↔ URL hash. Formato path-based stile A:
     #/home
     #/numeri
     #/numeri/lab-neurologia                (con filter contatto)
     #/procedura/rachicentesi
     #/procedura/rachicentesi/bl-5          (deep-link a blocco)
     #/clinica/alzheimer
     #/modulo/consenso-rachicentesi/bl-3
   Permette: bookmark, refresh F5, bottone indietro browser, condivisione link,
   deep-link da NotebookLM. Non aggiunge chiamate di rete.
*/
const urlRouter = (function() {
  let _suppress = false; // evita loop navigate→hashchange→navigate
  // Mappa posizione-scroll per indice di history (pos). Tenuta separata da history.state
  // così non interferisce col tracking pos/guard delle frecce avanti/indietro.
  const _scrollByPos = {};

  // Mappa interna route+params → segmenti URL
  function _routeToSegments(route, params) {
    const p = params || {};
    switch (route) {
      case 'home':            return ['home'];
      case 'reparto':         return ['reparto'];
      case 'procedure':       return ['procedure'];
      case 'procedure-cat':   return ['procedure', p.cat, p.sub].filter(Boolean);
      case 'procedura':       return ['procedura', p.slug];
      case 'procedura-edit':  return ['procedura', p.slug, 'edit'];
      case 'clinica':         return p.sub ? ['clinica', p.sub] : ['clinica'];
      case 'clinica-scheda':  return ['clinica-scheda', p.slug];
      case 'clinica-edit':    return ['clinica-scheda', p.slug, 'edit'];
      case 'numeri':          return p.filter ? ['numeri', p.filter] : ['numeri'];
      case 'moduli':          return ['moduli'];
      case 'modulo':          return ['modulo', p.slug];
      case 'modulo-edit':     return ['modulo', p.slug, 'edit'];
      case 'calendario':      return ['calendario'];
      case 'cestino':         return ['cestino'];
      case 'segnalazioni':    return ['segnalazioni'];
      case 'richieste':       return ['richieste'];
      case 'cestino-utenti':  return ['cestino-utenti'];
      case 'utenti':          return ['utenti'];
      case 'attivita':        return ['attivita'];
      case 'search':          return p.query ? ['search', encodeURIComponent(p.query)] : ['search'];
      case 'tag':             return ['tag', p.tag];
      case 'lettere':                  return ['lettere'];
      case 'lettere-carica':           return ['lettere', 'carica'];
      case 'lettere-anonimizza':       return ['lettere', 'anonimizza'];
      case 'lettere-genera':           return ['lettere', 'genera'];
      case 'lettere-verifica':         return ['lettere', 'verifica'];
      case 'lettere-esporta':          return ['lettere', 'esporta'];
      case 'lettere-libreria':         return ['lettere', 'libreria'];
      case 'lettere-nuovo-caso':       return ['lettere', 'nuovo-caso'];
      case 'lettere-caso':             return ['lettere', 'caso', p.id];
      case 'lettere-impostazioni':     return ['lettere', 'impostazioni'];
      case 'lettere-personalizzazioni':return ['lettere', 'personalizzazioni'];
      case 'lettere-segnalazioni':     return ['lettere', 'segnalazioni'];
      case 'lettere-segnalazioni-admin':return ['lettere', 'segnalazioni-admin'];
      case 'lettere-reparti':          return ['lettere', 'reparti'];
      case 'lettere-config':           return ['lettere', 'config'];
      default:                return ['home'];
    }
  }

  // Mappa inversa: segmenti URL → {route, params}
  // I segmenti arrivano già senza il leading "#/". Ultimo segmento può essere "bl-N" che
  // viene estratto come blockHash separato (per scrollare al blocco dopo il render).
  function _segmentsToRoute(segments) {
    let blockHash = null;
    // Se l'ultimo segmento è "bl-<numero>", lo separo
    if (segments.length > 0 && /^bl-\d+$/i.test(segments[segments.length - 1])) {
      const blNum = segments.pop().toLowerCase();
      // Ricostruisco "bl-<slug>-<n>" usando il segmento precedente come slug
      // (di solito segments[len-1] è lo slug della scheda)
      const slug = segments[segments.length - 1] || '';
      blockHash = `bl-${slug}-${blNum.replace(/^bl-/, '')}`;
    }
    if (segments.length === 0) return { route: 'home', params: {}, blockHash };
    const head = segments[0];
    const second = segments[1];
    const third = segments[2];
    switch (head) {
      case 'home': return { route: 'home', params: {}, blockHash };
      case 'reparto': return { route: 'reparto', params: {}, blockHash };
      case 'procedure':
        if (!second) return { route: 'procedure', params: {}, blockHash };
        return { route: 'procedure-cat', params: { cat: second, sub: third }, blockHash };
      case 'procedura':
        if (third === 'edit') return { route: 'procedura-edit', params: { slug: second }, blockHash };
        return { route: 'procedura', params: { slug: second }, blockHash };
      case 'clinica':
        return { route: 'clinica', params: { sub: second }, blockHash };
      case 'clinica-scheda':
        if (third === 'edit') return { route: 'clinica-edit', params: { slug: second }, blockHash };
        return { route: 'clinica-scheda', params: { slug: second }, blockHash };
      case 'numeri':
        return { route: 'numeri', params: second ? { filter: second } : {}, blockHash };
      case 'moduli': return { route: 'moduli', params: {}, blockHash };
      case 'modulo':
        if (third === 'edit') return { route: 'modulo-edit', params: { slug: second }, blockHash };
        return { route: 'modulo', params: { slug: second }, blockHash };
      case 'calendario': return { route: 'calendario', params: {}, blockHash };
      case 'cestino': return { route: 'cestino', params: {}, blockHash };
      case 'segnalazioni': return { route: 'segnalazioni', params: {}, blockHash };
      case 'richieste': return { route: 'richieste', params: {}, blockHash };
      case 'cestino-utenti': return { route: 'cestino-utenti', params: {}, blockHash };
      case 'utenti': return { route: 'utenti', params: {}, blockHash };
      case 'attivita': return { route: 'attivita', params: {}, blockHash };
      case 'search': return { route: 'search', params: { query: second ? decodeURIComponent(second) : '' }, blockHash };
      case 'tag': return { route: 'tag', params: { tag: second }, blockHash };
      case 'lettere':
        if (second === 'carica')            return { route: 'lettere-carica', params: {}, blockHash };
        if (second === 'anonimizza')        return { route: 'lettere-anonimizza', params: {}, blockHash };
        if (second === 'genera')            return { route: 'lettere-genera', params: {}, blockHash };
        if (second === 'verifica')          return { route: 'lettere-verifica', params: {}, blockHash };
        if (second === 'esporta')           return { route: 'lettere-esporta', params: {}, blockHash };
        if (second === 'libreria')          return { route: 'lettere-libreria', params: {}, blockHash };
        if (second === 'nuovo-caso')        return { route: 'lettere-nuovo-caso', params: {}, blockHash };
        if (second === 'caso')              return { route: 'lettere-caso', params: { id: third }, blockHash };
        if (second === 'impostazioni')      return { route: 'lettere-impostazioni', params: {}, blockHash };
        if (second === 'personalizzazioni') return { route: 'lettere-personalizzazioni', params: {}, blockHash };
        if (second === 'segnalazioni-admin')return { route: 'lettere-segnalazioni-admin', params: {}, blockHash };
        if (second === 'segnalazioni')      return { route: 'lettere-segnalazioni', params: {}, blockHash };
        if (second === 'reparti')           return { route: 'lettere-reparti', params: {}, blockHash };
        if (second === 'config')            return { route: 'lettere-config', params: {}, blockHash };
        return { route: 'lettere', params: {}, blockHash };
      default: return { route: 'home', params: {}, blockHash };
    }
  }

  // Costruisce stringa hash a partire da route+params (senza # iniziale)
  function buildHash(route, params) {
    const segs = _routeToSegments(route, params).filter(s => s != null && s !== '');
    return '#/' + segs.join('/');
  }

  // Aggiorna URL senza scatenare il listener (uso replaceState/hash silente)
  function updateUrl(route, params, replace) {
    const newHash = buildHash(route, params);
    if (newHash === window.location.hash && !replace) return;
    _suppress = true;
    try {
      if (replace) {
        // Sostituisce l'entry corrente senza aggiungerne una nuova (entrata/uscita editor):
        // così la cronologia non accumula entry duplicate della stessa scheda.
        window.history.replaceState({ route, params, pos: (_historyPos || 0) }, '', newHash);
      } else {
        // Salvo la posizione di scroll corrente nella mappa per-pos (NON in history.state,
        // per non interferire con il tracking pos/guard delle frecce avanti/indietro).
        try { _scrollByPos[_historyPos || 0] = window.scrollY || window.pageYOffset || 0; } catch {}
        // Uso pushState così il browser registra l'entry per il bottone indietro.
        // Salvo nello state la posizione (pos) per sapere se siamo andati avanti/indietro
        // a seguito di popstate (necessario per abilitare/disabilitare pulsanti freccia).
        const newPos = (_historyPos || 0) + 1;
        window.history.pushState({ route, params, pos: newPos }, '', newHash);
        _onHistoryPush();
      }
    } catch {
      window.location.hash = newHash;
    }
    setTimeout(() => { _suppress = false; }, 0);
  }

  // Legge hash corrente e ritorna {route, params, blockHash}
  function readUrl() {
    let hash = (window.location.hash || '').replace(/^#\/?/, '');
    if (!hash) return { route: 'home', params: {}, blockHash: null };
    const segments = hash.split('/').filter(Boolean);
    return _segmentsToRoute(segments);
  }

  // Editor raggiunto via cronologia (back/forward): NON riaprirlo né fermarcisi. L'editor si
  // apre solo cliccando "Modifica"; quando la history ci porta su una route di editor saltiamo
  // automaticamente quell'entry (continuando nella stessa direzione, all'indietro).
  const _EDIT_ROUTES = new Set(['clinica-edit', 'procedura-edit', 'modulo-edit']);
  function _skipEditorEntryIfNeeded(route) {
    if (!_EDIT_ROUTES.has(route)) return false;
    _suppress = true;
    window.history.back();
    setTimeout(() => { _suppress = false; }, 0);
    return true;
  }

  // Listener hashchange: viene attivato sia da pushState (in alcuni browser) sia
  // dal bottone indietro/avanti del browser. Se _suppress è true (cambio fatto da noi),
  // ignora. Altrimenti rileggi l'URL e naviga di conseguenza.
  function _onHashChange() {
    if (_suppress) return;
    const { route, params, blockHash } = readUrl();
    if (_skipEditorEntryIfNeeded(route)) return;
    if (blockHash) state.pendingBlockHash = blockHash;
    navigate(route, params);
  }

  // Listener popstate: per pushState/replaceState. Stesso comportamento di hashchange
  // ma necessario perché in alcuni browser pushState non scatena hashchange.
  // Cattura back/forward del browser, gesto swipe iOS/Android, tasto back hardware su PWA.
  function _onPopState(e) {
    if (_suppress) return;
    // Popup/modale aperto: il tasto/gesto indietro chiude il popup invece di navigare nel
    // background. L'entry "fantasma" è appena stata consumata dal back, quindi azzero il flag
    // e chiudo solo il DOM (closeModal salta la rimozione history perché il flag è già false).
    if (typeof isModalOpen === 'function' && isModalOpen()) {
      _modalHasHistoryEntry = false;
      if (typeof closeModal === 'function') closeModal();
      return;
    }
    // Back "tecnico" della chiusura popup via pulsante (history.back in closeModal): non navigare.
    if (_suppressNextPop) { _suppressNextPop = false; return; }
    // Tastiera aperta + gesture "indietro": il primo back deve solo chiudere la tastiera
    // (togliere il focus dall'input, come un tap fuori dal campo), SENZA svuotare il testo
    // digitato né navigare. Vale per input/textarea editabili (es. "Note del giorno", ricerca
    // globale, ricerca rubrica). Reinserisco un'entry nella history così la posizione resta
    // invariata e il prossimo back funziona normalmente.
    const ae = document.activeElement;
    const isEditable = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
    // Se questo popstate è stato scatenato dalle frecce interne, l'utente ha chiesto
    // esplicitamente di navigare: NON consumo il back per chiudere la tastiera.
    const _wasArrow = _navByArrowButton;
    _navByArrowButton = false;
    // Su back con un campo a fuoco: sfoca sempre (chiude la tastiera, come un tap fuori dal campo),
    // ANCHE quando la guardia è armata (es. home PWA), così il campo non resta selezionato.
    if (isEditable) ae.blur();
    if (isEditable && !_backGuardArmed && !_wasArrow) {
      // Nessuna guardia attiva: consumo questo back solo per chiudere la tastiera (resto sulla
      // pagina) re-inserendo l'entry, così il prossimo back naviga normalmente.
      _suppress = true;
      try { window.history.pushState({ route: readUrl().route, params: readUrl().params, pos: _historyPos }, '', window.location.href); } catch {}
      setTimeout(() => { _suppress = false; }, 0);
      return;
    }
    // Se la guardia è armata ho già sfocato qui sopra: lascio che la logica di guardia gestisca
    // questo stesso back, senza aggiungere un passo dovuto al focus.
    // Rete di sicurezza: se atterriamo su un'entry "guardia" residua senza che la logica
    // di guardia sia attiva, la saltiamo automaticamente per non bloccare la navigazione.
    if (e.state && e.state.guard && !_backGuardArmed) {
      _suppress = true;
      window.history.back();
      setTimeout(() => { _suppress = false; }, 0);
      return;
    }
    // Se c'era una guardia armata, popstate l'ha appena consumata.
    // Decido se intercettare (riarmare guardia + toast) o lasciar passare.
    if (_backGuardArmed) {
      const intercepted = _handleGuardConsumed();
      if (intercepted) return; // Guardia riarmata, non navigare
      // Guardia ha lasciato passare (secondo back rapido). Se siamo nell'editor con
      // modifiche dirty, chiedo conferma prima di procedere — altrimenti l'utente perderebbe
      // tutto silenziosamente. Se annulla, riportiamo l'URL all'editor (forward + riarmo).
      if (state.editingContext && state.editingContext.isDirty) {
        if (!confirm("Hai modifiche non salvate. Sicuro di uscire dall'editor?")) {
          // Riporto avanti nella history per restare sull'URL dell'editor
          _suppress = true;
          window.history.forward();
          setTimeout(() => {
            _suppress = false;
            armBackGuard(false); // riarma guardia perché siamo di nuovo nell'editor
          }, 0);
          return;
        }
      }
      // La guardia ha lasciato passare: l'entry tecnica è già stata consumata dal popstate
      // corrente. Procedo col routing normale qui sotto (niente back automatici aggiuntivi,
      // che in passato causavano disallineamenti al terzo back).
    }
    // Aggiorna il tracker di posizione history (per abilitare/disabilitare frecce interne)
    _onHistoryPop(e.state);
    const { route, params, blockHash } = readUrl();
    if (_skipEditorEntryIfNeeded(route)) return;
    if (blockHash) state.pendingBlockHash = blockHash;
    // fromHistory=true: la navigazione è scatenata dal back/forward del browser, quindi
    // l'URL è GIÀ quello corretto. navigate NON deve fare un nuovo pushState (che
    // resetterebbe _historyMax e romperebbe la freccia avanti, specie tornando alla
    // prima pagina con hash vuoto).
    // restoreScrollY: ripristina la posizione di scroll salvata per questa entry quando
    // ci eravamo allontanati, così back/forward riportano al punto esatto della pagina.
    // _onHistoryPop ha già aggiornato _historyPos alla posizione di destinazione.
    const _rsY = _scrollByPos[_historyPos || 0] || 0;
    navigate(route, params, { fromHistory: true, restoreScrollY: _rsY });
    // navigate(fromHistory) non passa per _onHistoryPush, quindi la guardia non si è
    // riarmata. Se siamo atterrati in zona protetta (es. home in PWA), riarmo qui — MA non
    // quando l'utente sta navigando la cronologia con le frecce interne e ha ancora "avanti"
    // disponibile: in quel caso armare la guardia inserirebbe un pushState che tronca lo stack
    // forward del browser, rompendo la freccia avanti (e facendo scattare la guardia al back).
    const _navigatingHistory = _wasArrow && (_historyPos < _historyMax);
    if (!_backGuardArmed && !_navigatingHistory) {
      const ctx = shouldGuardBack();
      if (ctx.active) armBackGuard(ctx.silent);
    }
  }

  function init() {
    // Disattivo il ripristino scroll automatico del browser: lo gestiamo noi (mappa per-pos).
    // Lasciandolo 'auto', su back/forward il browser ripristina la SUA posizione (spesso 0
    // per una hash route) e la dipinge PRIMA del nostro scrollTo → flash visibile per un attimo.
    try { if ('scrollRestoration' in window.history) window.history.scrollRestoration = 'manual'; } catch {}
    // All'avvio (o dopo un reload/riapertura PWA) il browser può aver conservato uno
    // history.state di una sessione precedente con un `pos` alto (es. 5), mentre le
    // variabili JS _historyPos/_historyMax ripartono da 0. Questo disallineamento rompe
    // le frecce avanti/indietro (la "prima pagina" risulta già in cima allo stack → forward
    // disabilitato). Normalizzo: la pagina corrente diventa la base pos 0 dello stack logico.
    try {
      const cur = readUrl();
      window.history.replaceState({ route: cur.route, params: cur.params, pos: 0 }, '', window.location.href);
    } catch {}
    _historyPos = 0;
    _historyMax = 0;
    updateNavHistoryButtons();
    window.addEventListener('hashchange', _onHashChange);
    window.addEventListener('popstate', _onPopState);
    // Persisto in modo continuo (throttled) la posizione di scroll nell'entry corrente
    // della history. Così back E forward riportano sempre al punto esatto della pagina,
    // anche quando la navigazione non passa da updateUrl (es. back nativo del browser).
    let _scrollSaveRaf = 0;
    const _persistScroll = () => {
      _scrollSaveRaf = 0;
      // Salvo nella mappa per-pos, NON in history.state: così le frecce avanti/indietro
      // (che leggono pos da history.state) non vengono mai disturbate.
      try { _scrollByPos[_historyPos || 0] = window.scrollY || window.pageYOffset || 0; } catch {}
    };
    window.addEventListener('scroll', () => {
      if (_scrollSaveRaf) return;
      _scrollSaveRaf = requestAnimationFrame(() => setTimeout(_persistScroll, 120));
    }, { passive: true });
