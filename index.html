})();

// Timer/rAF di ripristino scroll ancora pendenti dal ramo restore (back/forward):
// vengono annullati a ogni nuova navigazione, così non ripristinano la vecchia
// posizione sulla pagina appena aperta.
let _navScrollTimers = [];
let _navScrollRaf = 0;

function navigate(route, params = {}, navOpts = {}) {
  if (state.editingContext && state.editingContext.isDirty) {
    if (!confirm("Hai modifiche non salvate. Sicuro di uscire dall'editor?")) return;
  }
  if (state.editingContext && state.editingContext.hasLock) {
    locks.release(state.editingContext.slug).catch(() => {});
  }
  state.editingContext = null;
  // Se l'overlay di ricerca è aperto e stiamo navigando altrove (non per chiuderlo), chiudilo
  // MA lascia il testo nell'input: l'utente lo cancella solo manualmente (input vuoto o ✕).
  // Importante: usare closeSearchOverlay() che rimuove anche `body.search-overlay-open`
  // (position:fixed) altrimenti lo scroll della pagina sotto resta bloccato.
  const searchOverlay = document.getElementById('search-overlay');
  if (searchOverlay && !searchOverlay.classList.contains('hidden') && route !== 'search') {
    if (typeof closeSearchOverlay === 'function') closeSearchOverlay();
    else searchOverlay.classList.add('hidden');
  }
  state.currentView = route;
  window.removeEventListener('beforeunload', beforeUnloadHandler);

  // Highlight active nav-tree row by route
  $$('.nav-tree-row').forEach(el => {
    el.classList.remove('active');
  });
  $$('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.route === route || (route.startsWith(el.dataset.route + '-') && el.dataset.route));
  });
  // Save current view+params for re-render after edit toggle
  state.currentView = route;
  state.currentParams = params;
  // Sincronizza l'URL del browser per supportare bookmark, refresh, bottone indietro,
  // condivisione link, deep-link da NotebookLM/altre app. Aggiorna anche il contatore
  // di posizione history per i pulsanti freccia interni.
  // Se la navigazione viene dal back/forward del browser (fromHistory), l'URL è già
  // corretto: NON faccio un nuovo pushState (eviterei di resettare _historyMax).
  if (typeof urlRouter !== 'undefined' && !(navOpts && navOpts.fromHistory)) urlRouter.updateUrl(route, params, navOpts && navOpts.replace);
  if (route !== 'search') $('global-search').value = '';

  // Annulla eventuali ripristini di scroll ancora pendenti da una navigazione precedente
  // (i timer [80,200,450]ms e il rAF del ramo restore qui sotto): senza questo, aprendo
  // una nuova sezione entro quella finestra i timer scrollerebbero la pagina appena aperta
  // alla vecchia posizione. Rivelo anche il contenuto, in caso fosse rimasto nascosto.
  _navScrollTimers.forEach(id => clearTimeout(id));
  _navScrollTimers = [];
  if (_navScrollRaf) { cancelAnimationFrame(_navScrollRaf); _navScrollRaf = 0; }
  { const _mcPrev = document.getElementById('main-content'); if (_mcPrev) _mcPrev.style.visibility = ''; }

  // Restore di scroll su back/forward: calcolo il target PRIMA del render e, se serve
  // riposizionare, nascondo il contenuto (visibility:hidden, mantiene il layout/altezza)
  // così l'utente non vede mai il frame intermedio a scroll 0. Lo rivelo dopo lo scrollTo.
  const _restoreY = (navOpts && navOpts.fromHistory && typeof navOpts.restoreScrollY === 'number')
    ? navOpts.restoreScrollY : 0;
  const _mc = document.getElementById('main-content');
  if (_restoreY > 0 && _mc) _mc.style.visibility = 'hidden';
  const _reveal = () => { if (_mc) _mc.style.visibility = ''; };

  // Guardia permessi: sezione nascosta o rotta di modifica senza permesso 'edit'
  const _permNegato = (typeof permessoRouteNegato === 'function') ? permessoRouteNegato(route) : null;
  if (_permNegato) {
    if (typeof renderAccessoNegato === 'function') renderAccessoNegato(_permNegato, route);
    else renderError('Accesso negato', _permNegato);
    _reveal();
    window.scrollTo({ top: 0, behavior: 'instant' });
    return;
  }

  switch (route) {
    case 'home': renderHome(); break;
    case 'reparto': renderReparto(); break;
    case 'procedure': renderProcedureList(); break;
    case 'procedure-cat': renderProcedureByCategoria(params.cat, params.sub); break;
    case 'clinica': renderClinicaList(params.sub); break;
    case 'clinica-scheda': renderSchedaClinica(params.slug); break;
    case 'clinica-edit': renderSchedaClinicaEditor(params.slug); break;
    case 'procedura': renderProcedura(params.slug); break;
    case 'procedura-edit': renderProceduraEditor(params.slug); break;
    case 'numeri': renderNumeri(params.filter); break;
    case 'moduli': renderModuliList(); break;
    case 'modulo': renderModulo(params.slug, params); break;
    case 'calendario': renderCalendario(params); break;
    case 'cestino': renderCestino(); break;
    case 'segnalazioni': renderSegnalazioni(); break;
    case 'richieste': renderRichieste(); break;
    case 'cestino-utenti': renderCestinoUtenti(); break;
    case 'utenti': renderGestioneUtenti(); break;
    case 'attivita': renderAttivita(); break;
    case 'search': renderSearchResults(params.query); break;
    case 'tag': renderTagPage(params.tag); break;
    case 'lettere':                  _openLetterAI('renderHome'); break;
    case 'lettere-carica':           _openLetterAI('renderCarica'); break;
    case 'lettere-anonimizza':       _openLetterAI('renderAnonimizza'); break;
    case 'lettere-genera':           _openLetterAI('renderGenera'); break;
    case 'lettere-verifica':         _openLetterAI('renderVerifica'); break;
    case 'lettere-esporta':          _openLetterAI('renderEsporta'); break;
    case 'lettere-libreria':         _openLetterAI('renderLibreria'); break;
    case 'lettere-nuovo-caso':       _openLetterAI('renderNuovoCaso'); break;
    case 'lettere-caso':             _openLetterAI('renderCaso', params.id); break;
    case 'lettere-impostazioni':     _openLetterAI('renderImpostazioni'); break;
    case 'lettere-personalizzazioni':_openLetterAI('renderPersonalizzazioni'); break;
    case 'lettere-segnalazioni':     _openLetterAI('renderSegnalazioni'); break;
    case 'lettere-segnalazioni-admin':_openLetterAI('renderSegnalazioniAdmin'); break;
    case 'lettere-reparti':          _openLetterAI('renderReparti'); break;
    case 'lettere-config':           _openLetterAI('renderConfig'); break;
    default: renderHome();
  }
  // Scroll: su navigazione nuova vai in cima; su back/forward ripristina il punto salvato.
  if (_restoreY > 0) {
    const tryRestore = () => window.scrollTo({ top: _restoreY, behavior: 'instant' });
    // Ripristino SINCRONO, subito dopo il render (viste sincrone: layout già pronto).
    tryRestore();
    // Rivelo il contenuto al prossimo frame, quando lo scroll è già applicato.
    _navScrollRaf = requestAnimationFrame(() => { _navScrollRaf = 0; tryRestore(); _reveal(); });
    // Rete di sicurezza: rivela comunque entro breve.
    _navScrollTimers.push(setTimeout(_reveal, 120));
    // Fallback per viste async (procedura/modulo/clinica) il cui contenuto/altezza arriva dopo.
    [80, 200, 450].forEach(ms => _navScrollTimers.push(setTimeout(() => {
      const maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      if (Math.abs((window.scrollY || 0) - _restoreY) > 4 && maxY >= _restoreY - 4) tryRestore();
    }, ms)));
  } else {
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
}

/* ============================ VIEW HELPERS ============================ */
function renderLoading(message = 'Caricamento...') {
  $('main-content').innerHTML = `<div class="loading"><span class="spinner"></span> ${escapeHtml(message)}</div>`;
}

function renderError(title, detail) {
  $('main-content').innerHTML = `
    <div class="empty">
      <div class="empty-title">${escapeHtml(title)}</div>
      <p>${escapeHtml(detail || '')}</p>
      <button class="btn ghost" style="margin-top:20px;" onclick="navigate('home')">Torna alla home</button>
    </div>`;
}

function findContattoBySlug(slug) {
  for (const g of getVisibleNumeriGroups()) {
    for (const c of (g.contatti || [])) if (c.id === slug) return { ...c, _gruppo: g.nome, _gruppoId: g.id };
  }
  return null;
}

// Cerca un contatto per etichetta esatta (case-insensitive) tra tutti i gruppi visibili.
// Usato per il deep-link dei commit "numeri" → contatto specifico (l'etichetta è ciò che
// il messaggio di commit registra, l'id no).
function findContattoByEtichetta(etichetta) {
  if (!etichetta) return null;
  const norm = (s) => (s || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const target = norm(etichetta);
  if (!target) return null;
  const groups = getVisibleNumeriGroups();
  // 1) match esatto (normalizzato spazi/maiuscole)
  for (const g of groups) {
    for (const c of (g.contatti || [])) {
      if (norm(c.etichetta) === target) return { ...c, _gruppoId: g.id };
    }
  }
  return null;
}

/* ============================ VIEW — HOME ============================ */
function renderHome() {
  const procs = state.index.procedure;
  const recent = [...procs].sort((a, b) => new Date(b.ultima_modifica || 0) - new Date(a.ultima_modifica || 0)).slice(0, 6);

  const pins = (state.userPrefs && state.userPrefs.pins) || [];
  const pinsByType = {
    schede: [],      // procedura, clinica
    moduli: [],      // modulo (consensi, ecc.)
    cartelle: []     // categoria, sottocategoria, clinica-sub
  };
  pins.forEach(p => {
    if (['procedura','clinica'].includes(p.type)) pinsByType.schede.push(p);
    else if (p.type === 'modulo') pinsByType.moduli.push(p);
    else if (['categoria','sottocategoria','clinica-sub'].includes(p.type)) pinsByType.cartelle.push(p);
    // I contatti (type='contatto') non vanno più nei pins generici: usano home_numeri
  });

  const username = state.session?.username || '';

  $('main-content').innerHTML = `
    ${renderHomeNumeriSection()}

    ${renderNoteGiornoSection()}

    ${pinsByType.schede.length > 0 ? `
      <div class="home-section home-pins-group">
        <div class="home-section-title"><span>Schede fissate</span></div>
        <div class="procedure-grid">${pinsByType.schede.map(p => renderPinnedSchedaCard(p)).filter(Boolean).join('')}</div>
      </div>
    ` : ''}

    ${pinsByType.moduli.length > 0 ? `
      <div class="home-section home-pins-group">
        <div class="home-section-title"><span>Moduli fissati</span></div>
        <div class="procedure-grid">${pinsByType.moduli.map(p => renderPinnedSchedaCard(p)).filter(Boolean).join('')}</div>
      </div>
    ` : ''}

    ${pinsByType.cartelle.length > 0 ? `
      <div class="home-section home-pins-group">
        <div class="home-section-title"><span>Cartelle fissate</span></div>
        ${pinsByType.cartelle.map(p => renderPinnedCartella(p)).filter(Boolean).join('')}
      </div>
    ` : ''}

    ${pins.length === 0 ? `
      <div class="home-section">
        <div class="empty-pins">
          Nessuna risorsa fissata. Apri una scheda, una cartella o un contatto e clicca ☆ per aggiungerli qui.
        </div>
      </div>
    ` : ''}

    <div class="home-section">
      <div class="home-section-title"><span>Modificate di recente</span></div>
      ${recent.map(p => `
        <div class="numero-row" style="cursor:pointer;" onclick="navigate('procedura', {slug:'${escapeHtml(p.slug)}'})">
          <div>
            <div style="font-family:var(--serif);font-size:17px;font-weight:500;color:var(--ink);">${escapeHtml(p.titolo || p.slug)}</div>
            <div style="font-size:12px;color:var(--ink-muted);margin-top:2px;">Modificato ${timeAgo(p.ultima_modifica)} da <span style="font-family:var(--mono);">${escapeHtml(p.modificato_da || '—')}</span></div>
          </div>
          <div style="font-family:var(--mono);font-size:11px;color:var(--ink-faint);">→</div>
        </div>
      `).join('') || '<p style="color:var(--ink-muted);">Nessuna modifica recente.</p>'}
    </div>`;
}

function renderPinnedSchedaCard(pin) {
  // Card "snelle" per la home: solo titolo + stella (+ ⋯ azioni in modalità modifica).
  // Niente tag/descrizione/meta — diversamente dalle card nelle liste complete.
  let titolo = null, route = null, ctxType = null, pinType = pin.type, slug = pin.slug;
  if (pin.type === 'procedura') {
    const p = state.index.procedure.find(x => x.slug === pin.slug);
    if (!p) return null;
    titolo = p.titolo || p.slug; route = 'procedura'; ctxType = 'procedure';
  } else if (pin.type === 'clinica') {
    const c = (state.index.clinica || []).find(x => x.slug === pin.slug);
    if (!c) return null;
    titolo = c.titolo || c.slug; route = 'clinica-scheda'; ctxType = 'clinica';
  } else if (pin.type === 'modulo') {
    const m = state.index.moduli.find(x => x.slug === pin.slug);
    if (!m) return null;
    titolo = m.titolo || m.slug; route = 'modulo'; ctxType = 'modulo';
  } else {
    return null;
  }
  return `<div class="procedure-card procedure-card-slim" onclick="navigate('${route}', {slug:'${escapeJs(slug)}'})">
    <div class="procedure-card-title">${escapeHtml(titolo)}
      <span class="card-actions">
        ${renderPinButton(pinType, slug)}
        <button class="btn-icon-mini edit-only card-edit-btn" onclick="event.stopPropagation();showNavContextMenu(this, '${ctxType}', '${escapeJs(slug)}')" title="Azioni">⋯</button>
      </span>
    </div>
  </div>`;
}

function renderPinnedCartella(pin) {
  if (pin.type === 'categoria') {
    const count = state.index.procedure.filter(p => p.categoria === pin.cat).length;
    return `<div class="pinned-folder" onclick="navigate('procedure-cat', {cat:'${escapeJs(pin.cat)}'})">
      <span class="pinned-folder-icon">›</span>
      <div class="pinned-folder-text">
        <div class="pinned-folder-label">${escapeHtml(CATEGORIA_LABELS[pin.cat] || pin.cat)}</div>
        <div class="pinned-folder-sub">${count} procedur${count === 1 ? 'a' : 'e'}</div>
      </div>
      ${renderPinButton('categoria', pin.cat)}
    </div>`;
  }
  if (pin.type === 'sottocategoria') {
    const count = state.index.procedure.filter(p => p.categoria === pin.cat && p.sottocategoria === pin.sub).length;
    return `<div class="pinned-folder" onclick="navigate('procedure-cat', {cat:'${escapeJs(pin.cat)}', sub:'${escapeJs(pin.sub)}'})">
      <span class="pinned-folder-icon">›</span>
      <div class="pinned-folder-text">
        <div class="pinned-folder-label">${escapeHtml(SOTTO_LABELS[pin.sub] || pin.sub)}</div>
        <div class="pinned-folder-sub">${escapeHtml(CATEGORIA_LABELS[pin.cat] || pin.cat)} · ${count} sched${count === 1 ? 'a' : 'e'}</div>
      </div>
      ${renderPinButton('sottocategoria', pin.cat, pin.sub)}
    </div>`;
  }
  if (pin.type === 'clinica-sub') {
    const count = (state.index.clinica || []).filter(c => c.sottocategoria === pin.sub).length;
    return `<div class="pinned-folder" onclick="navigate('clinica', {sub:'${escapeJs(pin.sub)}'})">
      <span class="pinned-folder-icon">›</span>
      <div class="pinned-folder-text">
        <div class="pinned-folder-label">${escapeHtml(SOTTO_LABELS[pin.sub] || pin.sub)}</div>
        <div class="pinned-folder-sub">Clinica · ${count} sched${count === 1 ? 'a' : 'e'}</div>
      </div>
      ${renderPinButton('clinica-sub', pin.sub)}
    </div>`;
  }
  return null;
}

function renderPinnedContatto(id) {
  // Find the contact across all visible groups (AOPD + extended toggled)
  let foundContact = null, foundGroup = null;
  for (const g of getVisibleNumeriGroups()) {
    const c = (g.contatti || []).find(x => x.id === id);
    if (c) { foundContact = c; foundGroup = g; break; }
  }
  if (!foundContact) return null;
  const nums = (foundContact.numeri || []).map(n =>
    `<button onclick="event.stopPropagation();copyNumber('${escapeJs(String(n))}')" title="Copia" style="font-family:var(--mono);font-size:13px;font-weight:500;padding:4px 9px;background:var(--bg-raised);border:1px solid var(--rule);border-radius:3px;color:var(--ink);cursor:pointer;">${escapeHtml(String(n))}</button>`
  ).join(' ');
  return `<div class="pinned-contact" onclick="navigate('numeri', {filter:'${escapeJs(id)}'})" style="cursor:pointer;">
    <span class="pinned-folder-icon">☎</span>
    <div class="pinned-contact-label">${escapeHtml(foundContact.etichetta)}<div style="font-size:11px;color:var(--ink-muted);font-family:var(--mono);margin-top:2px;">${escapeHtml(foundGroup.nome)}</div></div>
    <div class="pinned-contact-num">${nums || '—'}</div>
  </div>`;
}

// =============================================================================
// SCHEDA_TYPES — config table per unificare procedure ↔ clinica (refactor A1)
// =============================================================================
// Procedure e schede cliniche sono modellate come due sistemi paralleli quasi identici:
// stessa struttura file (.md con frontmatter+body), stesso flusso (lista → dettaglio →
// editor → save), stesse modali (history, rename, delete). Storicamente erano implementati
// con coppie di funzioni gemelle (renderProcedura/renderSchedaClinica, saveProcedura/
// saveSchedaClinica, ecc.) che divergevano col tempo.
//
// Questa tabella centralizza le DIFFERENZE tra i due tipi (route name, path prefix,
// label di UI), così le funzioni di rendering/save/rename diventano singole con un
// parametro `type`. Aggiungere un terzo tipo (es. "linee guida") in futuro = 1 entry qui.
//
// Sotto-PR 1: la tabella + renderSchedaCard unificata (le 2 funzioni più piccole).
// Le altre coppie (renderEditor, save, rename, history, ecc.) saranno migrate in step
// successivi una alla volta, validando ogni step manualmente per evitare regressioni
// (le funzioni rubrica e search hanno cicatrici fresche da debug recente).
const SCHEDA_TYPES = {
  procedura: {
    indexKey: 'procedure',                 // → state.index.procedure
    routeView: 'procedura',                // route per visualizzare singola scheda
    routeEdit: 'procedura-edit',           // route per editor
    routeList: 'procedure',                // route lista
    pathPrefix: 'content/procedure',       // prefisso file su repo
    pinType: 'procedura',                  // categoria pin per renderPinButton
    contextMenuType: 'procedure',          // tipo per showNavContextMenu
    aggiornatoLabel: 'Aggiornato',         // label genere maschile
    label: 'Procedura',
    labelPlural: 'Procedure',
  },
  clinica: {
    indexKey: 'clinica',
    routeView: 'clinica-scheda',
    routeEdit: 'clinica-edit',
    routeList: 'clinica',
    pathPrefix: 'content/clinica',
    pinType: 'clinica',
    contextMenuType: 'clinica',
    aggiornatoLabel: 'Aggiornata',         // label genere femminile (scheda)
    label: 'Scheda clinica',
    labelPlural: 'Schede cliniche',
  }
};

// Card unica per qualunque tipo di scheda (procedura o clinica). Sostituisce le coppie
// gemelle renderProcedureCard / renderClinicaCard. I 2 wrapper sotto restano come
// backward-compat per non toccare i ~9 call site sparsi.
function renderSchedaCard(scheda, type) {
  const cfg = SCHEDA_TYPES[type];
  if (!cfg) { console.error('[renderSchedaCard] tipo sconosciuto:', type); return ''; }
  const tagsHtml = (scheda.tag || []).slice(0, 3).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
  return `
    <div class="procedure-card" onclick="navigate('${cfg.routeView}', {slug:'${escapeHtml(scheda.slug)}'})">
      <div class="procedure-card-title">${escapeHtml(scheda.titolo || scheda.slug)}
        <span class="card-actions">
          ${renderPinButton(cfg.pinType, scheda.slug)}
          <button class="btn-icon-mini edit-only card-edit-btn" onclick="event.stopPropagation();showNavContextMenu(this, '${cfg.contextMenuType}', '${escapeJs(scheda.slug)}')" title="Azioni">⋯</button>
        </span>
      </div>
      <div class="procedure-card-tags">${tagsHtml}</div>
      <div class="procedure-card-meta"><span>${cfg.aggiornatoLabel} ${timeAgo(scheda.ultima_modifica)}</span></div>
    </div>`;
}

function renderProcedureCard(p) {
  return renderSchedaCard(p, 'procedura');
}
</script>
<script src="js/reparto.js?v=4"></script>
<script>

function renderProcedureList() {
  const procs = state.index.procedure;
  const byCat = {};
  procs.forEach(p => {
    const c = p.categoria || 'altre';
    if (!byCat[c]) byCat[c] = [];
    byCat[c].push(p);
  });
  const catOrder = ['bedside','richieste','farmacologiche','emergenze','gestione'];
  const cats = [...catOrder.filter(c => byCat[c]), ...Object.keys(byCat).filter(c => !catOrder.includes(c))];

  // Auto-expand procedure node in sidebar
  navState.expanded.add('procedure');
  renderNavTree();

  $('main-content').innerHTML = `
    <div class="page-head">
      <div class="page-eyebrow">${buildBreadcrumb([{label:'Home', route:'home'}])}</div>
      <h1 class="page-title">Procedure</h1>
      <div class="page-actions">
        ${puoModificare('procedure') ? `<button class="btn edit-only" onclick="nuovaProcedura()">+ Nuova procedura</button>` : ''}
      </div>
    </div>
    ${cats.map(cat => renderCategoriaBlock(cat, byCat[cat], false)).join('')}`;
  attachCategoriaToggle();
}

function renderCategoriaBlock(cat, items, openByDefault) {
  const label = CATEGORIA_LABELS[cat] || cat;
  // Group by sottocategoria
  const bySub = {};
  items.forEach(p => {
    const s = p.sottocategoria || '_senza';
    if (!bySub[s]) bySub[s] = [];
    bySub[s].push(p);
  });
  const subs = Object.keys(bySub).sort();

  return `
    <details class="categoria-block" ${openByDefault ? 'open' : ''} data-cat="${escapeHtml(cat)}">
      <summary class="categoria-summary">
        <span class="categoria-title">${escapeHtml(label)}</span>
        <span class="categoria-count">${items.length}</span>
      </summary>
      <div class="categoria-content">
        ${!HIDE_SUBCATEGORIES && (subs.length > 1 || (subs.length === 1 && subs[0] !== '_senza'))
          ? subs.map(s => `
              <div class="sottocategoria-block">
                <div class="sottocategoria-title" onclick="navigate('procedure-cat', {cat:'${escapeHtml(cat)}', sub:'${escapeHtml(s)}'})">
                  ${escapeHtml(SOTTO_LABELS[s] || (s === '_senza' ? 'Senza sottocategoria' : s))}
                  <span class="sottocategoria-count">${bySub[s].length}</span>
                </div>
                <div class="procedure-grid">
                  ${bySub[s].map(p => renderProcedureCard(p)).join('')}
                </div>
              </div>
            `).join('')
          : `<div class="procedure-grid">${items.map(p => renderProcedureCard(p)).join('')}</div>`
        }
      </div>
    </details>`;
}

function attachCategoriaToggle() {
  // Sync details open state to left sidebar active (optional visual enhancement)
}

function renderProcedureByCategoria(cat, subFilter) {
  const procs = state.index.procedure.filter(p => p.categoria === cat);
  if (procs.length === 0) return renderError('Categoria vuota', cat);

  const bySub = {};
  procs.forEach(p => {
    const s = p.sottocategoria || '_senza';
    if (!bySub[s]) bySub[s] = [];
    bySub[s].push(p);
  });
  const subs = Object.keys(bySub).sort();
  // Con il livello sottocategoria nascosto, ignoro l'eventuale subFilter (es. da pin/link salvati)
  // e mostro tutte le procedure della categoria.
  if (HIDE_SUBCATEGORIES) subFilter = null;
  const filtered = subFilter ? bySub[subFilter] || [] : procs;

  // Auto-expand procedure + macro + (sub) in sidebar
  navState.expanded.add('procedure');
  navState.expanded.add('macro:' + cat);
  if (subFilter) navState.expanded.add('sub:' + cat + ':' + subFilter);
  renderNavTree();

  // Title: use the sottocategoria name if filtered, else the macro name
  const pageTitle = subFilter
    ? (SOTTO_LABELS[subFilter] || subFilter)
    : (CATEGORIA_LABELS[cat] || cat);
  const breadcrumb = subFilter
    ? buildBreadcrumb([
        { label: 'Procedure', route: 'procedure' },
        { label: CATEGORIA_LABELS[cat] || cat, route: 'procedure-cat', params: { cat } }
      ])
    : buildBreadcrumb([{ label: 'Procedure', route: 'procedure' }]);

  $('main-content').innerHTML = `
    <div class="page-head">
      <div class="page-eyebrow">${breadcrumb}</div>
      <h1 class="page-title">${escapeHtml(pageTitle)} ${subFilter ? renderPinButton('sottocategoria', cat, subFilter) : renderPinButton('categoria', cat)}</h1>
      <div style="margin-top:8px;font-size:13px;color:var(--ink-muted);">${filtered.length} procedur${filtered.length === 1 ? 'a' : 'e'}</div>
      <div class="page-actions">
        ${puoModificare('procedure') ? `<button class="btn edit-only" onclick="nuovaProcedura({categoria:'${escapeHtml(cat)}'${subFilter && subFilter !== '_senza' ? `, sottocategoria:'${escapeHtml(subFilter)}'` : ''}})">+ Nuova procedura</button>` : ''}
      </div>
    </div>
    ${HIDE_SUBCATEGORIES || subFilter || (subs.length === 1 && subs[0] === '_senza')
      ? `<div class="procedure-grid">${filtered.map(p => renderProcedureCard(p)).join('')}</div>`
      : subs.map(s => `
          <details class="categoria-block sottocategoria-standalone">
            <summary class="categoria-summary">
              <span class="categoria-title">${escapeHtml(SOTTO_LABELS[s] || (s === '_senza' ? 'Senza sottocategoria' : s))}</span>
              <span class="categoria-count">${bySub[s].length}</span>
            </summary>
            <div class="categoria-content">
              <div class="procedure-grid">
                ${bySub[s].map(p => renderProcedureCard(p)).join('')}
              </div>
            </div>
          </details>
        `).join('')
    }`;
}
</script>
