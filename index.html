// Standardized breadcrumb: ← Level1 › Level2 › Level3
// segments: [{label, route, params?}]
function buildBreadcrumb(segments) {
  if (!segments || segments.length === 0) return '';
  // Rimuovo il segmento "Home" iniziale: il logo in topbar già torna a home,
  // quindi il breadcrumb "Home › X" è ridondante. Mostro solo i segmenti intermedi.
  const filtered = segments.filter((s, i) => !(i === 0 && s.label === 'Home' && s.route === 'home'));
  if (filtered.length === 0) return '';
  const parts = filtered.map((s) => {
    const params = s.params ? JSON.stringify(s.params).replace(/"/g, '&quot;') : '{}';
    return `<span class="bc-segment" onclick="navigate('${escapeJs(s.route)}', ${params})">${escapeHtml(s.label)}</span>`;
  });
  return parts.join(' <span class="bc-sep">›</span> ');
}

/* ============================ CHIPS MULTI-SELECT ============================ */
// Component: type to filter existing values, click to add as chip, type new + Enter to create.
// State stored on the container element via dataset.values (JSON array)

function renderChipsField(opts) {
  // opts: { id, values:[], suggestions:[{id,label}], placeholder, allowNew:true }
  const valuesAttr = JSON.stringify(opts.values || []).replace(/"/g, '&quot;');
  const initialChips = (opts.values || []).map(v => {
    const sugg = (opts.suggestions || []).find(s => s.id === v);
    const label = sugg ? sugg.label : v;
    return `<span class="chip" data-value="${escapeHtml(v)}">
      <span class="chip-label">${escapeHtml(label)}</span>
      <button type="button" class="chip-remove" onclick="event.stopPropagation();chipsRemove('${escapeJs(opts.id)}','${escapeJs(v)}')" aria-label="Rimuovi">×</button>
    </span>`;
  }).join('');

  return `
    <div class="chips-wrap" id="${opts.id}" data-values="${valuesAttr}" data-allow-new="${opts.allowNew !== false ? '1' : '0'}">
      <div class="chips-list">${initialChips}<input type="text" class="chips-input" id="${opts.id}-input" placeholder="${escapeHtml(opts.placeholder || 'aggiungi…')}" autocomplete="off"></div>
      <div class="chips-suggest" id="${opts.id}-suggest"></div>
    </div>`;
}

function chipsInit(id, suggestions) {
  const container = document.getElementById(id);
  if (!container) return;
  const input = document.getElementById(id + '-input');
  const suggestBox = document.getElementById(id + '-suggest');
  // Store suggestions on the container for later
  container._suggestions = suggestions || [];

  function getValues() { return JSON.parse(container.dataset.values || '[]'); }
  function setValues(arr) {
    container.dataset.values = JSON.stringify(arr);
    if (state.editingContext) state.editingContext.isDirty = true;
  }

  function showSuggestions() {
    const q = input.value.trim().toLowerCase();
    const taken = new Set(getValues());
    const allowNew = container.dataset.allowNew === '1';
    const matches = container._suggestions
      .filter(s => !taken.has(s.id))
      .filter(s => !q || s.label.toLowerCase().includes(q) || s.id.toLowerCase().includes(q))
      .slice(0, 8);
    if (matches.length === 0 && (!q || !allowNew)) {
      suggestBox.innerHTML = q && !allowNew ? '<div class="chip-suggest-empty">Nessuna corrispondenza</div>' : '';
      suggestBox.classList.remove('open');
      return;
    }
    let html = matches.map(m => `<div class="chip-suggest-item" onmousedown="event.preventDefault();chipsAdd('${escapeJs(id)}','${escapeJs(m.id)}','${escapeJs(m.label)}')">
      <span>${escapeHtml(m.label)}</span>
      <span class="chip-suggest-id">${escapeHtml(m.id)}</span>
    </div>`).join('');
    if (q && allowNew && !container._suggestions.find(s => s.id === q || s.label.toLowerCase() === q.toLowerCase())) {
      // Allow creating a new value (sanitized to slug)
      const newId = q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'');
      if (newId) {
        html += `<div class="chip-suggest-item chip-suggest-new" onmousedown="event.preventDefault();chipsAdd('${escapeJs(id)}','${escapeJs(newId)}','${escapeJs(q)}')">
          <span>+ Crea "${escapeHtml(q)}"</span>
          <span class="chip-suggest-id">${escapeHtml(newId)}</span>
        </div>`;
      }
    }
    suggestBox.innerHTML = html;
    suggestBox.classList.add('open');
  }

  function hideSuggestions() {
    setTimeout(() => suggestBox.classList.remove('open'), 150);
  }

  input.addEventListener('focus', showSuggestions);
  input.addEventListener('input', showSuggestions);
  input.addEventListener('blur', hideSuggestions);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      // Try exact match first, otherwise create new (if allowed)
      const exact = container._suggestions.find(s => s.label.toLowerCase() === q.toLowerCase() || s.id.toLowerCase() === q.toLowerCase());
      if (exact) chipsAdd(id, exact.id, exact.label);
      else if (container.dataset.allowNew === '1') {
        const newId = q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'');
        if (newId) chipsAdd(id, newId, q);
      }
    } else if (e.key === 'Backspace' && input.value === '') {
      // Remove last chip
      const values = getValues();
      if (values.length > 0) chipsRemove(id, values[values.length - 1]);
    } else if (e.key === 'Escape') {
      input.value = '';
      hideSuggestions();
    }
  });
}

function chipsAdd(id, value, label) {
  const container = document.getElementById(id);
  if (!container) return;
  const values = JSON.parse(container.dataset.values || '[]');
  if (values.includes(value)) return;
  values.push(value);
  container.dataset.values = JSON.stringify(values);
  // Re-render chips
  const list = container.querySelector('.chips-list');
  const input = document.getElementById(id + '-input');
  const chip = document.createElement('span');
  chip.className = 'chip';
  chip.dataset.value = value;
  chip.innerHTML = `<span class="chip-label">${escapeHtml(label || value)}</span>
    <button type="button" class="chip-remove" onclick="event.stopPropagation();chipsRemove('${escapeJs(id)}','${escapeJs(value)}')" aria-label="Rimuovi">×</button>`;
  list.insertBefore(chip, input);
  input.value = '';
  input.focus();
  document.getElementById(id + '-suggest').innerHTML = '';
  document.getElementById(id + '-suggest').classList.remove('open');
  if (state.editingContext) state.editingContext.isDirty = true;
}

function chipsRemove(id, value) {
  const container = document.getElementById(id);
  if (!container) return;
  const values = JSON.parse(container.dataset.values || '[]').filter(v => v !== value);
  container.dataset.values = JSON.stringify(values);
  const chip = container.querySelector(`.chip[data-value="${CSS.escape(value)}"]`);
  if (chip) chip.remove();
  if (state.editingContext) state.editingContext.isDirty = true;
}

function chipsGet(id) {
  const container = document.getElementById(id);
  if (!container) return [];
  return JSON.parse(container.dataset.values || '[]');
}

// Helper: build suggestions for an existing free-form sub-categoria input
function buildSottocategorieForCategoria(cat) {
  const subs = new Set();
  state.index.procedure.forEach(p => {
    if (p.categoria === cat && p.sottocategoria) subs.add(p.sottocategoria);
  });
  return [...subs].sort().map(s => ({ id: s, label: SOTTO_LABELS[s] || s }));
}

// Helper: collect all unique tags across procedure + clinica
function collectAllTags() {
  const tags = new Set();
  state.index.procedure.forEach(p => (p.tag || []).forEach(t => tags.add(t)));
  (state.index.clinica || []).forEach(c => (c.tag || []).forEach(t => tags.add(t)));
  return [...tags].sort().map(t => ({ id: t, label: t }));
}

function collectAllTermini() {
  const terms = new Set();
  state.index.procedure.forEach(p => (p.termini_equivalenti || []).forEach(t => terms.add(t)));
  (state.index.clinica || []).forEach(c => (c.termini_equivalenti || []).forEach(t => terms.add(t)));
  return [...terms].sort().map(t => ({ id: t, label: t }));
}

function collectAllContattiSuggestions() {
  const out = [];
  getVisibleNumeriGroups().forEach(g => {
    (g.contatti || []).forEach(c => {
      if (c.id) out.push({ id: c.id, label: `${c.etichetta} · ${g.nome}` });
    });
  });
  return out.sort((a, b) => a.label.localeCompare(b.label));
}

// === PICKER "NUMERI CORRELATI" (procedura editor) ===
// Sostituisce il campo chips generico con una ricerca contatti in stile overlay globale:
// stessa logica di match (_contattoMatchesQuery) e stesse card (renderContattoCard), ma
// limitata ai soli contatti. I contatti scelti sono mostrati come card "preferiti" con
// numeri e info. Gli id selezionati restano in dataset.values di #meta-numeri-chips, così
// il salvataggio (chipsGet) funziona senza modifiche.

// Trova {c, g} dato l'id contatto.
function _findContattoById(cid) {
  for (const g of getVisibleNumeriGroups()) {
    const c = (g.contatti || []).find(x => x.id === cid);
    if (c) return { c, g };
  }
  return null;
}

function renderNumeriCorrelatiPicker(selectedIds) {
  const valuesAttr = JSON.stringify(selectedIds || []).replace(/"/g, '&quot;');
  return `
    <div class="numcorr-picker" id="meta-numeri-chips" data-values="${valuesAttr}">
      <input type="text" class="numcorr-input" id="meta-numeri-search" placeholder="cerca contatto per nome, UOC, reparto…" autocomplete="off">
      <div class="numcorr-results" id="meta-numeri-results"></div>
      <div class="numcorr-selected" id="meta-numeri-selected"></div>
    </div>`;
}

function initNumeriCorrelatiPicker() {
  const container = document.getElementById('meta-numeri-chips');
  const input = document.getElementById('meta-numeri-search');
  const results = document.getElementById('meta-numeri-results');
  const selectedBox = document.getElementById('meta-numeri-selected');
  if (!container || !input || !results || !selectedBox) return;

  const getValues = () => { try { return JSON.parse(container.dataset.values || '[]'); } catch { return []; } };
  const setValues = (arr) => {
    container.dataset.values = JSON.stringify(arr);
    if (state.editingContext) state.editingContext.isDirty = true;
  };

  // Card dei contatti scelti: stile "preferiti" (etichetta + numeri + info), con pulsante rimuovi.
  const renderSelected = () => {
    const ids = getValues();
    if (!ids.length) { selectedBox.innerHTML = ''; return; }
    const html = ids.map(cid => {
      const found = _findContattoById(cid);
      if (!found) {
        return `<div class="sr-sede-bucket" style="margin-bottom:8px;"><div class="sr-sede-bucket-contatti">
          <div class="sr-contact"><div class="sr-contact-left"><div class="sr-contact-label" style="color:var(--ink-muted);font-style:italic;">${escapeHtml(cid)} (non trovato)</div></div>
          <button type="button" class="numcorr-remove" onclick="numcorrRemove('${escapeJs(cid)}')" title="Rimuovi">×</button></div>
        </div></div>`;
      }
      const { c, g } = found;
      const removeBtn = `<button type="button" class="numcorr-remove" onclick="event.stopPropagation();numcorrRemove('${escapeJs(cid)}')" title="Rimuovi">×</button>`;
      // Stessa resa dei preferiti: occhiello UOC · Sezione, numeri come chip, nessuna stella.
      const eyebrow = [stripPrefixNome(g.nome), (c.sezione || '').trim()].filter(Boolean).join(' · ');
      return renderContattoCard(c, { eyebrow: eyebrow || null, removeBtn, noNavigate: true });
    }).join('');
    selectedBox.innerHTML = `<div class="numcorr-selected-label">Selezionati</div><div class="sr-sede-bucket"><div class="sr-sede-bucket-contatti">${html}</div></div>`;
  };

  // Risultati ricerca: stesse card dell'overlay globale, solo contatti, escludendo i già scelti.
  const renderResults = () => {
    const q = input.value.trim();
    if (q.length < 2) { results.innerHTML = ''; results.classList.remove('open'); return; }
    const taken = new Set(getValues());
    const matches = [];
    for (const g of getVisibleNumeriGroups()) {
      if ((g._source || 'aopd') !== 'aopd') continue;
      for (const c of (g.contatti || [])) {
        if (!c.id || taken.has(c.id)) continue;
        if (_contattoMatchesQuery(q, c, g)) matches.push({ c, g });
        if (matches.length >= 30) break;
      }
      if (matches.length >= 30) break;
    }
    if (!matches.length) {
      results.innerHTML = `<div class="numcorr-empty">Nessun contatto per "${escapeHtml(q)}"</div>`;
      results.classList.add('open');
      return;
    }
    // Raggruppo per UOC come nell'overlay; ogni contatto è una card cliccabile che lo aggiunge.
    const byG = new Map();
    matches.forEach(({ c, g }) => {
      if (!byG.has(g.id)) byG.set(g.id, { g, items: [] });
      byG.get(g.id).items.push(c);
    });
    const html = Array.from(byG.values()).map(({ g, items }) => {
      const rows = items.map(c => {
        const eyebrow = (c.sezione || '').trim() || null;
        // Card non navigabile: il click è gestito dal wrapper (numcorrAdd), non da goToContatto.
        const card = renderContattoCard(c, { eyebrow, noNavigate: true });
        return `<div class="numcorr-result-row" onclick="numcorrAdd('${escapeJs(c.id)}')">${card}</div>`;
      }).join('');
      return `<div class="sr-sede-bucket" style="margin-bottom:8px;">
        <div class="sr-sede-bucket-header sr-sede-bucket-static"><span class="sede-bucket-tipo">${escapeHtml(stripPrefixNome(g.nome))}</span></div>
        <div class="sr-sede-bucket-contatti">${rows}</div>
      </div>`;
    }).join('');
    results.innerHTML = html;
    results.classList.add('open');
  };

  // Esposti come globali per gli onclick inline
  window.numcorrAdd = (cid) => {
    const ids = getValues();
    if (!ids.includes(cid)) { ids.push(cid); setValues(ids); }
    input.value = '';
    results.innerHTML = ''; results.classList.remove('open');
    renderSelected();
    input.focus();
  };
  window.numcorrRemove = (cid) => {
    setValues(getValues().filter(x => x !== cid));
    renderSelected();
    renderResults();
  };

  input.addEventListener('input', renderResults);
  input.addEventListener('focus', renderResults);
  // Chiusura risultati cliccando fuori. Listener registrato una sola volta a livello documento
  // (rilegge gli elementi correnti dal DOM), per non accumularsi a ogni apertura editor.
  if (!document._numcorrOutsideClickBound) {
    document._numcorrOutsideClickBound = true;
    document.addEventListener('click', (e) => {
      const cont = document.getElementById('meta-numeri-chips');
      const res = document.getElementById('meta-numeri-results');
      if (cont && res && !cont.contains(e.target)) res.classList.remove('open');
    });
  }

  renderSelected();
}

/* ============================ USER PREFERENCES ============================ */
// Per-user home pins stored in content/user-prefs/{username}.yml
// pins: array of {type, ...keys}
//   {type:'procedura', slug}
//   {type:'clinica', slug}
//   {type:'modulo', slug}
//   {type:'sottocategoria', cat, sub}     // procedure subcategory
//   {type:'clinica-sub', sub}             // clinica subcategory
//   {type:'categoria', cat}               // procedure macro category
//   {type:'contatto', id}

// Set predefinito di sezioni preferite ("sezioni personalizzate") caricato dal REPO DATI
// (content/preferiti-default.yml), NON hardcoded: così è modificabile senza deploy del codice.
// Formato atteso:  sezioni: [ { nome: "GUARDIA", contatti: [id, ...] }, ... ]
// I contatti sono ID (campo `id` dei contatti in numeri.yml, risolti da findContattoBySlug):
// un id che non esiste in rubrica viene semplicemente ignorato in fase di render.
// Usato per il seeding dei NUOVI account e per l'azione admin sui VECCHI.
let _preferitiDefaultCache = null;
async function getPreferitiDefault(force) {
  if (_preferitiDefaultCache && !force) return _preferitiDefaultCache;
  let arr = [];
  try {
    const file = await gh.getFile('content/preferiti-default.yml');
    if (file && file.content) {
      const parsed = jsyaml.load(file.content) || {};
      const raw = Array.isArray(parsed.sezioni) ? parsed.sezioni
                : (Array.isArray(parsed) ? parsed : []);
      arr = raw
        .filter(s => s && s.nome)
        .map(s => ({ nome: String(s.nome), contatti: Array.isArray(s.contatti) ? s.contatti.map(String) : [] }));
    }
  } catch (e) {
    console.warn('[preferiti-default] caricamento fallito:', e);
  }
  _preferitiDefaultCache = arr;
  return arr;
}

// Costruisce il set predefinito con id di sezione univoci (seeding di un nuovo account).
async function _buildDefaultCustomSezioni() {
  const tpl = await getPreferitiDefault();
  const base = Date.now().toString(36);
  return tpl.map((s, i) => ({
    id: 'cs-def-' + base + '-' + i,
    nome: s.nome,
    contatti: (s.contatti || []).slice()
  }));
}

const userPrefs = {
  async load() {
    if (!state.session || !state.session.username) return;
    const path = `content/user-prefs/${state.session.username}.yml`;
    state.userPrefsPath = path;
    try {
      const file = await gh.getFile(path);
      if (!file) {
        // Nuovo account (nessun file preferenze): parte con il set di sezioni preferite predefinito
        // caricato dal repo dati. Se il file manca, custom_sezioni resta vuoto.
        state.userPrefs = { pins: [], home_numeri: [], pin_order: {}, device_prefs: {}, calendar_filters: {}, custom_sezioni: [], pref_uoc: [], pazienti_salvati: [], note_giorno: [], _sha: null };
        try { state.userPrefs.custom_sezioni = await _buildDefaultCustomSezioni(); } catch (e) { console.warn('[seed sezioni predefinite]', e); }
        // Persisto subito così il file viene creato col set predefinito anche senza altre modifiche.
        userPrefs.scheduleSave();
        return;
      }
      const parsed = jsyaml.load(file.content) || {};
      // Migrazione one-shot: vecchio schema aveva tema/font_size al top level.
      // Se trovo i vecchi campi e device_prefs è assente, sposto i valori nella categoria corrente.
      const cat = getDeviceCategory();
      const devicePrefs = (parsed.device_prefs && typeof parsed.device_prefs === 'object') ? parsed.device_prefs : {};
      if ((parsed.tema || parsed.font_size) && !parsed.device_prefs) {
        devicePrefs[cat] = {
          tema: parsed.tema || null,
          font_size: parsed.font_size || null
        };
      }
      state.userPrefs = {
        pins: Array.isArray(parsed.pins) ? parsed.pins : [],
        home_numeri: Array.isArray(parsed.home_numeri) ? parsed.home_numeri : [],
        pin_order: (parsed.pin_order && typeof parsed.pin_order === 'object') ? parsed.pin_order : {},
        device_prefs: devicePrefs,
        calendar_filters: (parsed.calendar_filters && typeof parsed.calendar_filters === 'object') ? parsed.calendar_filters : {},
        custom_sezioni: Array.isArray(parsed.custom_sezioni) ? parsed.custom_sezioni : [],
        pref_uoc: Array.isArray(parsed.pref_uoc) ? parsed.pref_uoc : [],
        pazienti_salvati: Array.isArray(parsed.pazienti_salvati) ? parsed.pazienti_salvati : [],
        note_giorno: Array.isArray(parsed.note_giorno) ? parsed.note_giorno : [],
        _sha: file.sha
      };
      // Migrazione: i contatti pinnati nel vecchio sistema `pins` (type='contatto')
      // vanno spostati a home_numeri (sistema dedicato con drag&drop in home).
      // Solo migrazione in-memory: il salvataggio remoto avverrà alla prossima modifica.
      try {
        const pins = Array.isArray(state.userPrefs.pins) ? state.userPrefs.pins : [];
        const homeN = Array.isArray(state.userPrefs.home_numeri) ? state.userPrefs.home_numeri : [];
        const oldContactPins = pins.filter(p => p && p.type === 'contatto');
        if (oldContactPins.length) {
          const existing = new Set(homeN);
          for (const p of oldContactPins) {
            if (p && p.id && !existing.has(p.id)) homeN.push(p.id);
          }
          state.userPrefs.home_numeri = homeN;
          state.userPrefs.pins = pins.filter(p => !p || p.type !== 'contatto');
        }
      } catch (e) { console.warn('[userPrefs] migration skipped:', e); }
      // Applica subito tema e font dalla categoria di dispositivo corrente
      const myPrefs = state.userPrefs.device_prefs[cat] || {};
      if (myPrefs.tema) applyTheme(myPrefs.tema);
      if (myPrefs.font_size) applyFontSize(myPrefs.font_size);
    } catch (e) {
      console.warn('[userPrefs] load failed:', e);
      state.userPrefs = { pins: [], home_numeri: [], pin_order: {}, device_prefs: {}, calendar_filters: {}, custom_sezioni: [], pref_uoc: [], pazienti_salvati: [], note_giorno: [], _sha: null };
    }
  },

  // Debounced save: collects multiple toggles in 2 seconds
  scheduleSave() {
    if (!state.userPrefs) return;
    if (state.userPrefs._saveTimer) clearTimeout(state.userPrefs._saveTimer);
    state.userPrefs._pending = true;
    state.userPrefs._saveTimer = setTimeout(() => {
      userPrefs.persist().catch(e => console.error('[userPrefs] save failed', e));
    }, 2000);
  },

  async persist() {
    if (!state.userPrefs || !state.session) return;
    state.userPrefs._pending = false;
    const path = state.userPrefsPath;
    const data = {
      pins: state.userPrefs.pins,
      home_numeri: state.userPrefs.home_numeri || [],
      pin_order: state.userPrefs.pin_order || {},
      device_prefs: state.userPrefs.device_prefs || {},
      calendar_filters: state.userPrefs.calendar_filters || {},
      custom_sezioni: state.userPrefs.custom_sezioni || [],
      pref_uoc: state.userPrefs.pref_uoc || [],
      pazienti_salvati: state.userPrefs.pazienti_salvati || [],
      note_giorno: state.userPrefs.note_giorno || [],
      ultima_modifica: nowIso(),
      modificato_da: state.session.username
    };
    const content = `# Preferenze home personali per ${state.session.username}\n# Gestite dall'app, non modificare a mano\n\n` +
      jsyaml.dump(data, { lineWidth: 120, noRefs: true, sortKeys: false });
    try {
      // silent: preferenze (preferiti/fissati) salvate in background con debounce, niente overlay.
      const res = await gh.putFile(path, content, state.userPrefs._sha, `chore: preferenze home di ${state.session.username}`, false, { silent: true });
      state.userPrefs._sha = res.content.sha;
    } catch (e) {
      if (e.code === 'CONFLICT') {
        // Reload and retry once
        await userPrefs.load();
        const res2 = await gh.putFile(path, content, state.userPrefs._sha, `chore: preferenze home di ${state.session.username} (retry)`, false, { silent: true });
        state.userPrefs._sha = res2.content.sha;
      } else {
        throw e;
      }
    }
  },

  // Check if a pin exists
  has(pin) {
    if (!state.userPrefs) return false;
    return state.userPrefs.pins.some(p => userPrefs.pinEquals(p, pin));
  },

  pinEquals(a, b) {
    if (!a || !b || a.type !== b.type) return false;
    switch (a.type) {
      case 'procedura':
      case 'clinica':
      case 'modulo':
        return a.slug === b.slug;
      case 'contatto':
        return a.id === b.id;
      case 'sottocategoria':
        return a.cat === b.cat && a.sub === b.sub;
      case 'clinica-sub':
        return a.sub === b.sub;
      case 'categoria':
        return a.cat === b.cat;
    }
    return false;
  },

  // Toggle: add if not present, remove if present. Returns new state (true=pinned).
  toggle(pin) {
    if (!state.userPrefs) return false;
    const idx = state.userPrefs.pins.findIndex(p => userPrefs.pinEquals(p, pin));
    let nowPinned;
    if (idx >= 0) {
      state.userPrefs.pins.splice(idx, 1);
      nowPinned = false;
    } else {
      state.userPrefs.pins.push(pin);
      nowPinned = true;
    }
    userPrefs.scheduleSave();
    // Visual feedback
    if (nowPinned) {
      if (typeof toast === 'function') toast('Aggiunto in home', 'info', 1500);
    } else if (typeof toastUndo === 'function') {
      // Rimozione reversibile: offro "Annulla" per ripristinare il preferito.
      toastUndo('Rimosso dalla home', () => {
        if (!state.userPrefs) return;
        if (!state.userPrefs.pins.some(p => userPrefs.pinEquals(p, pin))) {
          state.userPrefs.pins.push(pin);
          userPrefs.scheduleSave();
          if (state.currentView === 'home') renderHome();
          else if (typeof renderNumeri === 'function' && state.currentView === 'numeri') renderNumeri(state.currentParams && state.currentParams.filter);
        }
      });
    }
    return nowPinned;
  },

  // --- Home numeri (lista indipendente di contatti pinnati per la home) ---
  hasHomeNumero(cid) {
    if (!state.userPrefs) return false;
    return (state.userPrefs.home_numeri || []).includes(cid);
  },
  toggleHomeNumero(cid) {
    if (!state.userPrefs) return false;
    if (!state.userPrefs.home_numeri) state.userPrefs.home_numeri = [];
    const idx = state.userPrefs.home_numeri.indexOf(cid);
    let added;
    if (idx >= 0) { state.userPrefs.home_numeri.splice(idx, 1); added = false; }
    else { state.userPrefs.home_numeri.unshift(cid); added = true; }
    userPrefs.scheduleSave();
    return added;
  },
  reorderHomeNumeri(newOrder) {
    if (!state.userPrefs) return;
    state.userPrefs.home_numeri = newOrder;
    userPrefs.scheduleSave();
  },

  // --- Note del giorno (todos personali mostrati in home) ---
  // Ogni nota = { id, testo, fatto:bool }. Persistite come le altre prefs.
  getNoteGiorno() {
    if (!state.userPrefs) return [];
    return state.userPrefs.note_giorno || [];
  },
  addNotaGiorno(testo) {
    if (!state.userPrefs) return;
    if (!state.userPrefs.note_giorno) state.userPrefs.note_giorno = [];
    const t = (testo || '').trim();
    if (!t) return;
    state.userPrefs.note_giorno.unshift({ id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), testo: t, fatto: false });
    userPrefs.scheduleSave();
  },
  toggleNotaGiorno(id) {
    if (!state.userPrefs || !state.userPrefs.note_giorno) return;
    const n = state.userPrefs.note_giorno.find(x => x.id === id);
    if (n) { n.fatto = !n.fatto; userPrefs.scheduleSave(); }
  },
  updateNotaGiorno(id, testo) {
    if (!state.userPrefs || !state.userPrefs.note_giorno) return;
    const t = (testo || '').trim();
    if (!t) return;
    const n = state.userPrefs.note_giorno.find(x => x.id === id);
    if (n) { n.testo = t; userPrefs.scheduleSave(); }
  },
  removeNotaGiorno(id) {
    if (!state.userPrefs || !state.userPrefs.note_giorno) return;
    state.userPrefs.note_giorno = state.userPrefs.note_giorno.filter(x => x.id !== id);
    userPrefs.scheduleSave();
  },
  restoreNotaGiorno(nota, pos) {
    if (!state.userPrefs || !nota) return;
    if (!state.userPrefs.note_giorno) state.userPrefs.note_giorno = [];
    // Evito duplicati se già presente (es. doppio Annulla).
    if (state.userPrefs.note_giorno.some(x => x.id === nota.id)) return;
    const i = (typeof pos === 'number' && pos >= 0 && pos <= state.userPrefs.note_giorno.length) ? pos : state.userPrefs.note_giorno.length;
    state.userPrefs.note_giorno.splice(i, 0, nota);
    userPrefs.scheduleSave();
  },
  clearNoteGiornoFatte() {
    if (!state.userPrefs || !state.userPrefs.note_giorno) return;
    state.userPrefs.note_giorno = state.userPrefs.note_giorno.filter(x => !x.fatto);
    userPrefs.scheduleSave();
  },
  reorderNoteGiorno(newOrderIds) {
    if (!state.userPrefs || !Array.isArray(state.userPrefs.note_giorno)) return;
    const byId = new Map(state.userPrefs.note_giorno.map(n => [n.id, n]));
    const reordered = newOrderIds.map(id => byId.get(id)).filter(Boolean);
    // accodo eventuali note non presenti nell'ordine passato (safety)
    state.userPrefs.note_giorno.forEach(n => { if (!newOrderIds.includes(n.id)) reordered.push(n); });
    state.userPrefs.note_giorno = reordered;
    userPrefs.scheduleSave();
  },

  // --- Preferiti rubrica: sezione UOC standard (separata dai fissati in home) ---
  hasPrefUoc(cid) {
    if (!state.userPrefs) return false;
    return (state.userPrefs.pref_uoc || []).includes(cid);
  },
  togglePrefUoc(cid) {
    if (!state.userPrefs) return false;
    if (!state.userPrefs.pref_uoc) state.userPrefs.pref_uoc = [];
    const idx = state.userPrefs.pref_uoc.indexOf(cid);
    let added;
    if (idx >= 0) { state.userPrefs.pref_uoc.splice(idx, 1); added = false; }
    else { state.userPrefs.pref_uoc.push(cid); added = true; }
    userPrefs.scheduleSave();
    return added;
  },
  // Sposta un contatto preferito UOC su (-1) o giù (+1) nell'ordine di pref_uoc.
  // Ritorna true se l'ordine è cambiato.
  reorderPrefUoc(cid, dir) {
    if (!state.userPrefs || !Array.isArray(state.userPrefs.pref_uoc)) return false;
    const arr = state.userPrefs.pref_uoc;
    const i = arr.indexOf(cid);
    if (i < 0) return false;
    const j = i + dir;
    if (j < 0 || j >= arr.length) return false;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    userPrefs.scheduleSave();
    return true;
  },

  // Sposta un box-UOC dei preferiti su/giù nell'ordine pin_order._uoc.
  // displayedOrder = lista degli id UOC attualmente mostrati (per inizializzare l'ordine
  // se mancante o incompleto). Ritorna true se l'ordine è cambiato.
  reorderUocBox(gid, dir, displayedOrder) {
    if (!state.userPrefs) return false;
    if (!state.userPrefs.pin_order) state.userPrefs.pin_order = {};
    // Parto dall'ordine salvato, completato con eventuali UOC mostrate ma non ancora ordinate.
    let order = Array.isArray(state.userPrefs.pin_order._uoc) ? state.userPrefs.pin_order._uoc.slice() : [];
    (displayedOrder || []).forEach(id => { if (!order.includes(id)) order.push(id); });
    // Tengo solo le UOC effettivamente mostrate, preservando l'ordine.
    if (Array.isArray(displayedOrder) && displayedOrder.length) {
      order = order.filter(id => displayedOrder.includes(id));
    }
    const i = order.indexOf(gid);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= order.length) return false;
    [order[i], order[j]] = [order[j], order[i]];
    state.userPrefs.pin_order._uoc = order;
    userPrefs.scheduleSave();
    return true;
  },

  getUocOrder() {
    return (state.userPrefs && state.userPrefs.pin_order && state.userPrefs.pin_order._uoc) || [];
  },
  getContactOrder(gid) {
    return (state.userPrefs && state.userPrefs.pin_order && state.userPrefs.pin_order[gid]) || [];
  },
  setUocOrder(order) {
    if (!state.userPrefs) return;
    if (!state.userPrefs.pin_order) state.userPrefs.pin_order = {};
    state.userPrefs.pin_order._uoc = order;
    userPrefs.scheduleSave();
  },
  setContactOrder(gid, order) {
    if (!state.userPrefs) return;
    if (!state.userPrefs.pin_order) state.userPrefs.pin_order = {};
    state.userPrefs.pin_order[gid] = order;
    userPrefs.scheduleSave();
  },

  // --- Sezioni personalizzate dell'utente (es. "PS") ---
  // Struttura: custom_sezioni = [{ id, nome, contatti: [contactId, ...] }]
  getCustomSezioni() {
    return (state.userPrefs && Array.isArray(state.userPrefs.custom_sezioni)) ? state.userPrefs.custom_sezioni : [];
  },
  addCustomSezione(nome) {
    if (!state.userPrefs) return null;
    if (!Array.isArray(state.userPrefs.custom_sezioni)) state.userPrefs.custom_sezioni = [];
    const id = 'cs-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    const sez = { id, nome: nome.trim(), contatti: [] };
    state.userPrefs.custom_sezioni.push(sez);
    userPrefs.scheduleSave();
    return sez;
  },
  renameCustomSezione(id, nome) {
    if (!state.userPrefs || !Array.isArray(state.userPrefs.custom_sezioni)) return;
    const sez = state.userPrefs.custom_sezioni.find(s => s.id === id);
    if (sez) { sez.nome = nome.trim(); userPrefs.scheduleSave(); }
  },
  deleteCustomSezione(id) {
    if (!state.userPrefs || !Array.isArray(state.userPrefs.custom_sezioni)) return;
    state.userPrefs.custom_sezioni = state.userPrefs.custom_sezioni.filter(s => s.id !== id);
    userPrefs.scheduleSave();
  },
  addContactToCustomSezione(sezId, contactId) {
    if (!state.userPrefs || !Array.isArray(state.userPrefs.custom_sezioni)) return;
    const sez = state.userPrefs.custom_sezioni.find(s => s.id === sezId);
    if (sez && !sez.contatti.includes(contactId)) { sez.contatti.push(contactId); userPrefs.scheduleSave(); }
  },
  removeContactFromCustomSezione(sezId, contactId) {
    if (!state.userPrefs || !Array.isArray(state.userPrefs.custom_sezioni)) return;
    const sez = state.userPrefs.custom_sezioni.find(s => s.id === sezId);
    if (sez) { sez.contatti = sez.contatti.filter(c => c !== contactId); userPrefs.scheduleSave(); }
  },
  // Riordino sezioni preferiti (dir = -1 su, +1 giù).
  moveCustomSezione(id, dir) {
    if (!state.userPrefs || !Array.isArray(state.userPrefs.custom_sezioni)) return;
    const arr = state.userPrefs.custom_sezioni;
    const i = arr.findIndex(s => s.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    userPrefs.scheduleSave();
  },
  // Riordino di un contatto dentro una sezione preferiti (dir = -1 su, +1 giù).
  moveContactInCustomSezione(sezId, contactId, dir) {
    if (!state.userPrefs || !Array.isArray(state.userPrefs.custom_sezioni)) return;
    const sez = state.userPrefs.custom_sezioni.find(s => s.id === sezId);
    if (!sez || !Array.isArray(sez.contatti)) return;
    const i = sez.contatti.indexOf(contactId);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= sez.contatti.length) return;
    [sez.contatti[i], sez.contatti[j]] = [sez.contatti[j], sez.contatti[i]];
    userPrefs.scheduleSave();
  },
  // --- Pazienti salvati (persistenti, per-utente) ---
  _pazienteKey(p) {
    return (((p && p.cognome) || '') + '|' + ((p && p.nome) || '') + '|' + ((p && p.dataNascita) || '')).trim().toLowerCase();
  },
  getPazientiSalvati() {
    return (state.userPrefs && Array.isArray(state.userPrefs.pazienti_salvati)) ? state.userPrefs.pazienti_salvati : [];
  },
  savePazienteSalvato(p) {
    if (!state.userPrefs) return false;
    const cognome = (p.cognome || '').trim(), nome = (p.nome || '').trim(), dataNascita = (p.dataNascita || '').trim();
    if (!cognome || !nome || !dataNascita) return false;
    if (!Array.isArray(state.userPrefs.pazienti_salvati)) state.userPrefs.pazienti_salvati = [];
    const key = userPrefs._pazienteKey({ cognome, nome, dataNascita });
    if (state.userPrefs.pazienti_salvati.some(x => userPrefs._pazienteKey(x) === key)) return false; // già salvato
    state.userPrefs.pazienti_salvati.unshift({ cognome, nome, dataNascita });
    userPrefs.scheduleSave();
    return true;
  },
  deletePazienteSalvato(key) {
    if (!state.userPrefs || !Array.isArray(state.userPrefs.pazienti_salvati)) return;
    state.userPrefs.pazienti_salvati = state.userPrefs.pazienti_salvati.filter(x => userPrefs._pazienteKey(x) !== key);
    userPrefs.scheduleSave();
  },

  // --- Modello unificato preferiti ---
  // Un contatto è "preferito" se sta nella sezione UOC standard (home_numeri)
  // OPPURE in almeno una sezione personalizzata. La sezione UOC standard usa
  // la pseudo-id '_uoc' nel popup di gestione.
  isContattoPreferito(cid) {
    if (userPrefs.hasPrefUoc(cid)) return true;
    return userPrefs.getCustomSezioni().some(s => (s.contatti || []).includes(cid));
  },
  // Stato visivo della stella: piena se il contatto è in QUALSIASI lista preferiti
  // oppure nei "Contatti fissati" della home. Distinto da isContattoPreferito (solo liste).
  isContattoStarred(cid) {
    return userPrefs.isContattoPreferito(cid) || userPrefs.hasHomeNumero(cid);
  },
  // Ritorna gli id delle sezioni dei preferiti in cui si trova il contatto
  // ('_uoc' per la sezione UOC standard, oppure l'id della sezione custom).
  getSezioniDiContatto(cid) {
    const ids = [];
    if (userPrefs.hasPrefUoc(cid)) ids.push('_uoc');
    userPrefs.getCustomSezioni().forEach(s => { if ((s.contatti || []).includes(cid)) ids.push(s.id); });
    return ids;
  },
  // Toggle dell'appartenenza di un contatto a una sezione dei preferiti.
  // sezId '_uoc' = sezione UOC standard (pref_uoc); altrimenti sezione custom.
  // NB: i "Contatti fissati" della home (home_numeri) sono una cosa SEPARATA dai preferiti
  // della rubrica: si gestiscono solo dalla ricerca dedicata in home. Qui non vengono toccati.
  toggleContattoInSezione(cid, sezId) {
    if (sezId === '_uoc') {
      return userPrefs.togglePrefUoc(cid); // ritorna true se aggiunto
    }
    const sez = userPrefs.getCustomSezioni().find(s => s.id === sezId);
    if (!sez) return false;
    if ((sez.contatti || []).includes(cid)) {
      userPrefs.removeContactFromCustomSezione(sezId, cid);
      return false;
    } else {
      userPrefs.addContactToCustomSezione(sezId, cid);
      return true;
    }
  }
};

// Convenience global for HTML onclick handlers
function togglePin(type, ...args) {
  // I contatti usano il sistema home_numeri dedicato (lista ordinabile in home),
  // non il sistema pins generico. La stella ☆ sui contatti aggiunge/rimuove
  // dalla sezione "Contatti fissati" della home.
  if (type === 'contatto') {
    const cid = args[0];
    userPrefs.toggleHomeNumero(cid);
    if (state.currentView === 'home') renderHome();
    else {
      const isPinned = userPrefs.hasHomeNumero(cid);
      document.querySelectorAll(`[data-pin-key="contatto:${cid}"]`).forEach(btn => {
        btn.classList.toggle('pinned', isPinned);
        btn.innerHTML = isPinned ? '★' : '☆';
        btn.setAttribute('title', isPinned ? 'Rimuovi dalla home' : 'Aggiungi alla home');
      });
    }
    return;
  }
  let pin;
  switch (type) {
    case 'procedura':
    case 'clinica':
    case 'modulo':
      pin = { type, slug: args[0] }; break;
    case 'sottocategoria':
      pin = { type, cat: args[0], sub: args[1] }; break;
    case 'clinica-sub':
      pin = { type, sub: args[0] }; break;
    case 'categoria':
      pin = { type, cat: args[0] }; break;
    default: return;
  }
  userPrefs.toggle(pin);
  // Re-render current view for updated star state, and home-tree if on home
  if (state.currentView === 'home') renderHome();
  else {
    // Re-render just the star buttons on the current view
    document.querySelectorAll(`[data-pin-key]`).forEach(btn => {
      const key = btn.dataset.pinKey;
      if (key === pinKey(pin)) {
        const isPinned = userPrefs.has(pin);
        btn.classList.toggle('pinned', isPinned);
        btn.innerHTML = isPinned ? '★' : '☆';
        btn.setAttribute('title', isPinned ? 'Rimuovi dalla home' : 'Aggiungi alla home');
      }
    });
  }
}

// Rimuove prefisso tipo "U.O.C." / "U.O.S.D." / "U.O.S." dal nome UOC
function stripPrefixNome(name) {
  return String(name || '').replace(/^(U\.?O\.?C\.?|U\.?O\.?S\.?D\.?|U\.?O\.?S\.?|S\.?S\.?D\.?|S\.?S\.?|U\.?O\.?)\s+/i, '').trim();
}

/** Ritorna la stringa luogo del contatto come 'Edificio Piano' (es. "Centro Gallucci 2° piano").
 *  Costruita dai due campi separati c.edificio + c.piano. Fallback a c.luogo per retrocompat
 *  con eventuali contatti non ancora migrati allo schema separato. */
function getLuogoContatto(c) {
  if (!c) return '';
  const e = (c.edificio || '').toString().trim();
  const p = (c.piano || '').toString().trim();
  if (e || p) return [e, p].filter(Boolean).join(' ');
  return (c.luogo || '').toString().trim();
}

/** Ritorna il nome breve della UOC, da usare nelle barre contesto compatte su mobile.
 *  Il valore è salvato nello YAML come campo `nome_breve` di ogni gruppo (coerente coi contatti).
 *  Per UOC nuove o non ancora processate, fallback al nome senza prefisso (U.O.C., ecc.). */
function shortenUocName(group) {
  if (!group) return '';
  const custom = group.nome_breve && String(group.nome_breve).trim();
  if (custom) return custom;
  // Fallback minimale per UOC senza nome_breve: rimuovi solo il prefisso
  return stripPrefixNome(group.nome || '');
}

// Mappa tipi sezione → etichette leggibili. Condivisa tra renderSedeBucketHeader e i layout collassati.
const SEZIONE_TIPO_LABELS = {
  reparto:'Reparto', sala_operatoria:'Sala operatoria',
  diagnostica:'Diagnostica',
  ambulatori:'Ambulatori', day_hospital:'Day Hospital',
  segreteria_direzione:'Segreteria e Direzione',
  laboratorio:'Laboratorio',
  terapia_intensiva:'Terapia Intensiva', semi_intensiva:'Semi Intensiva',
  studi_medici:'Studi Medici',
  altro:'Altro'
};

/** Etichetta leggibile di una sezione (bucket) — utilizzata nei layout collassati di ricerca. */
function bucketSezioneLabel(b) {
  if (!b) return '—';
  if (b.sede) {
    return b.sede.nome || SEZIONE_TIPO_LABELS[b.sede.tipo] || (b.sede.tipo || '—').replace(/_/g, ' ');
  }
  return b.customLabel || 'Altro';
}

function isPinned(type, id) {
  if (!userPrefs) return false;
  // I contatti usano il sistema home_numeri dedicato
  if (type === 'contatto') return userPrefs.isContattoStarred(id);
  return userPrefs.has({ type, slug: id });
}

function pinKey(pin) {
  switch (pin.type) {
    case 'procedura': case 'clinica': case 'modulo':
      return `${pin.type}:${pin.slug}`;
    case 'contatto':
      return `${pin.type}:${pin.id}`;
    case 'sottocategoria': return `sottocategoria:${pin.cat}:${pin.sub}`;
    case 'clinica-sub': return `clinica-sub:${pin.sub}`;
    case 'categoria': return `categoria:${pin.cat}`;
  }
  return pin.type;
}

function renderPinButton(type, ...args) {
  // I contatti: la stella apre un popup per scegliere in quali sezioni dei
  // preferiti includere il numero. Piena se il contatto è in almeno una sezione.
  if (type === 'contatto') {
    const cid = args[0];
    const pinned = userPrefs.isContattoStarred(cid);
    return `<button class="pin-star ${pinned ? 'pinned' : ''}" data-pin-key="contatto:${escapeHtml(cid)}" onclick="event.stopPropagation();openPinSezioniPopup('${escapeJs(cid)}')" title="${pinned ? 'Gestisci fissati e preferiti' : 'Fissa in home o aggiungi ai preferiti'}" aria-label="Fissati e preferiti">${pinned ? '★' : '☆'}</button>`;
  }
  let pin;
  switch (type) {
    case 'procedura': case 'clinica': case 'modulo':
      pin = { type, slug: args[0] }; break;
    case 'sottocategoria':
      pin = { type, cat: args[0], sub: args[1] }; break;
    case 'clinica-sub':
      pin = { type, sub: args[0] }; break;
    case 'categoria':
      pin = { type, cat: args[0] }; break;
    default: return '';
  }
  const pinned = userPrefs.has(pin);
  const argStrs = args.map(a => `'${escapeJs(a)}'`).join(',');
  return `<button class="pin-star ${pinned ? 'pinned' : ''}" data-pin-key="${escapeHtml(pinKey(pin))}" onclick="event.stopPropagation();togglePin('${type}',${argStrs})" title="${pinned ? 'Rimuovi dalla home' : 'Aggiungi alla home'}" aria-label="Fissa in home">${pinned ? '★' : '☆'}</button>`;
}

/* ============================ IMAGE HELPERS ============================ */

// Transform relative img/* paths in Markdown to absolute raw GitHub URLs
function transformMarkdownImages(md, filePath) {
  if (!md || !filePath) return md;
  // filePath like "content/procedure/bedside/rachicentesi.md"
  // Get parent dir: "content/procedure/bedside"
  const parentDir = filePath.replace(/\/[^/]+$/, '');
  const baseUrl = `https://raw.githubusercontent.com/${CONFIG.REPO_OWNER}/${CONFIG.DATA_REPO_NAME}/${CONFIG.BRANCH}/${parentDir}/`;
  // Match Markdown images: ![alt](path) where path doesn't start with http, /, or data:
  return md.replace(/(!\[[^\]]*\]\()(?!https?:|\/|data:)([^)]+)(\))/g, (match, prefix, path, suffix) => {
    return prefix + baseUrl + path + suffix;
  });
}

// Render Markdown with image path transformation, sanitize, and add lightbox-ready data attributes
function renderMarkdownWithImages(md, filePath) {
  if (!md) return '';
  const transformed = transformMarkdownImages(md, filePath);
  const html = DOMPurify.sanitize(marked.parse(transformed), { ADD_ATTR: ['onclick', 'data-src', 'data-alt'] });
  // Wrap each <img> tag with click handler attribute (post-sanitize for security)
  // Use a temporary container to manipulate HTML
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('img').forEach(img => {
    const src = img.getAttribute('src');
    const alt = img.getAttribute('alt') || '';
    img.setAttribute('data-src', src);
    img.setAttribute('data-alt', alt);
    img.setAttribute('loading', 'lazy');
    img.setAttribute('onclick', `openLightbox('${escapeJs(src)}', '${escapeJs(alt)}')`);
  });
  return tmp.innerHTML;
}

// Lightbox
function openLightbox(src, alt) {
  closeLightbox(); // ensure no duplicates
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.id = 'lightbox-overlay';
  lb.innerHTML = `
    <button class="lightbox-close" aria-label="Chiudi" onclick="event.stopPropagation();closeLightbox()">✕</button>
    <img class="lightbox-img" src="${escapeHtml(src)}" alt="${escapeHtml(alt || '')}">
    ${alt ? `<div class="lightbox-caption">${escapeHtml(alt)}</div>` : ''}
  `;
  lb.addEventListener('click', closeLightbox);
  lb.querySelector('img').addEventListener('click', e => e.stopPropagation());
  document.body.appendChild(lb);
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', lightboxKeyHandler);
}

function closeLightbox() {
  const lb = document.getElementById('lightbox-overlay');
  if (lb) lb.remove();
  document.body.style.overflow = '';
  document.removeEventListener('keydown', lightboxKeyHandler);
}

function lightboxKeyHandler(e) {
  if (e.key === 'Escape') closeLightbox();
}

// Compress and upload an image to GitHub, return relative path for Markdown insert
async function compressAndUploadImage(file, currentFilePath) {
  if (!file.type.startsWith('image/')) throw new Error('Non è un\'immagine');

  const options = {
    maxSizeMB: 1.5,
    maxWidthOrHeight: 1920,
    useWebWorker: true,
    fileType: 'image/webp',
    initialQuality: 0.80
  };

  // browser-image-compression caricata lazy: necessario await prima dell'uso
  await _ensureLib('imageCompression');
  const compressed = await imageCompression(file, options);

  // Sanitize filename: lowercase, no spaces, no accents
  const baseName = file.name.replace(/\.[^.]+$/, '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9-]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .substring(0, 60);

  // Build target path: same dir as the current .md, in img/ subfolder
  const parentDir = currentFilePath.replace(/\/[^/]+$/, '');
  const fileName = `${baseName || 'image'}-${Date.now().toString(36)}.webp`;
  const targetPath = `${parentDir}/img/${fileName}`;

  // Read as base64
  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      const b64 = result.split(',')[1]; // strip "data:image/webp;base64,"
      resolve(b64);
    };
    reader.onerror = () => reject(new Error('Lettura file fallita'));
    reader.readAsDataURL(compressed);
  });

  // Upload via PUT to GitHub contents API (repo dati)
  const url = `${CONFIG.API_BASE}/repos/${CONFIG.REPO_OWNER}/${CONFIG.DATA_REPO_NAME}/contents/${encodeURIComponent(targetPath).replace(/%2F/g, '/')}`;
  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${state.session.tokenData}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
      'X-GitHub-Api-Version': '2022-11-28'
    },
    body: JSON.stringify({
      message: `Carica immagine ${fileName} (by ${state.session.username})`,
      content: base64,
      branch: CONFIG.BRANCH
    })
  });

  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Upload fallito (HTTP ${res.status}): ${errText.substring(0, 200)}`);
  }

  return {
    fileName,
    relativePath: `img/${fileName}`,
    sizeBefore: file.size,
    sizeAfter: compressed.size
  };
}

function toast(message, level = 'info', duration = 3500) {
  const stack = $('toast-stack');
  const el = document.createElement('div');
  el.className = `toast ${level}`;
  el.textContent = message;
  stack.appendChild(el);
  setTimeout(() => { el.classList.add('leaving'); setTimeout(() => el.remove(), 220); }, duration);
}

// Toast con pulsante "Annulla": mostra un messaggio breve e, se l'utente preme Annulla entro
// la durata, esegue onUndo() (ripristino dell'azione). Usato per rimozioni reversibili
// (preferito dalla home, nota del giorno eliminata).
function toastUndo(message, onUndo, duration = 5000) {
  const stack = $('toast-stack');
  const el = document.createElement('div');
  el.className = 'toast info toast-undo';
  const txt = document.createElement('span');
  txt.className = 'toast-undo-text';
  txt.textContent = message;
  const btn = document.createElement('button');
  btn.className = 'toast-undo-btn';
  btn.textContent = 'Annulla';
  el.appendChild(txt);
  el.appendChild(btn);
  stack.appendChild(el);
  let done = false;
  const close = () => { if (done) return; done = true; el.classList.add('leaving'); setTimeout(() => el.remove(), 220); };
  const timer = setTimeout(close, duration);
  btn.addEventListener('click', () => {
    clearTimeout(timer);
    close();
    try { if (typeof onUndo === 'function') onUndo(); } catch (e) { console.warn('[toastUndo] onUndo error', e); }
  });
}

/* ============================ CONDIVISIONE LINK ============================
   shareLink usa Web Share API quando disponibile (tipicamente su mobile),
   altrimenti copia il link in clipboard con feedback toast. Esperienza nativa
   su iOS/Android, comportamento standard "copy link" su desktop. */
async function shareLink(url, title) {
  // Copia in clipboard con feedback. Tentata per prima su desktop (dove il foglio di
  // condivisione nativo è assente o inaffidabile) e come fallback ovunque.
  const copyToClipboard = async () => {
    try {
      await navigator.clipboard.writeText(url);
      toast('Link copiato', 'success', 1800);
      return true;
    } catch {
      // Fallback legacy: textarea temporanea + execCommand (per contesti senza clipboard API).
      try {
        const ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { toast('Link copiato', 'success', 1800); return true; }
      } catch {}
      // Fallback estremo: prompt visibile per copia manuale.
      try { prompt('Copia il link:', url); return true; } catch {}
      return false;
    }
  };

  // Considero "mobile" la presenza di touch + viewport stretto: lì il foglio di condivisione
  // nativo è la via migliore. Su desktop vado dritto al clipboard (più affidabile e immediato).
  const isMobileLike = (('ontouchstart' in window) || (navigator.maxTouchPoints > 0)) && window.innerWidth <= 900;

  if (navigator.share && isMobileLike) {
    try {
      await navigator.share({ title: title || 'CollinettaAI', url });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;  // utente ha chiuso il foglio: non è un errore
      // Qualsiasi altro errore → ricado sul clipboard.
    }
  }
  await copyToClipboard();
}

/* Gestisce il click su una riga contatto in vista rubrica.
   Comportamento contesto-sensibile:
   - Se siamo già nella UOC di quel contatto E nella sezione corrispondente è già visibile,
     mostra un mini-menu con azione "Condividi" (per evitare scroll inutile).
   - Altrimenti, naviga alla UOC con scroll al contatto (comportamento standard). */
// Naviga a un contatto (dalla ricerca, home, preferiti, ecc.) assicurando che la sua
// sezione si riapra anche se era stata collassata in una visita precedente.
function goToContatto(cid) {
  state._lastFilterContattoInit = null;
  if (typeof _navigateOutOfRubricaSearch === 'function') _navigateOutOfRubricaSearch('numeri', { filter: cid });
  else navigate('numeri', { filter: cid });
}

function handleContattoRowClick(contattoId, evt) {
  if (evt && (evt.target.closest('button,a,input,.kind-selector,.kind-chip'))) return;
  // Determina lo stato corrente: siamo dentro la stessa UOC del contatto?
  const params = state.currentParams || {};
  const currentFilter = params.filter;
  // Trova il gruppo proprietario del contatto
  let ownerGroup = null;
  for (const sourceId of ['aopd','osa','iov']) {
    const data = (typeof getNumeriDataForSource === 'function') ? getNumeriDataForSource(sourceId) : null;
    if (!data) continue;
    for (const g of (data.gruppi || [])) {
      if ((g.contatti || []).some(x => x.id === contattoId)) { ownerGroup = g; break; }
    }
    if (ownerGroup) break;
  }
  if (!ownerGroup) {
    // Fallback: comportamento standard
    state._lastFilterContattoInit = null;
    _navigateOutOfRubricaSearch('numeri', { filter: contattoId });
    return;
  }
  // Sono già dentro questa UOC? currentFilter può essere l'id della UOC stessa OPPURE
  // l'id di un contatto (se sono arrivato qui cliccando un contatto: in quel caso la vista
  // mostra comunque l'INTERA UOC di quel contatto). Risolvo currentFilter al suo gruppo
  // proprietario e confronto i gruppi: così cliccare un altro contatto della stessa UOC
  // (o di nuovo lo stesso) NON ri-naviga né ri-scrolla con animazione/illuminazione inutile.
  let currentGroup = null;
  if (currentFilter) {
    for (const sourceId of ['aopd','osa','iov']) {
      const data = (typeof getNumeriDataForSource === 'function') ? getNumeriDataForSource(sourceId) : null;
      if (!data) continue;
      for (const g of (data.gruppi || [])) {
        if (g.id === currentFilter || (g.contatti || []).some(x => x.id === currentFilter)) { currentGroup = g; break; }
      }
      if (currentGroup) break;
    }
  }
  const alreadyInsideUoc = !!currentGroup && currentGroup.id === ownerGroup.id;
  if (alreadyInsideUoc && state.currentView === 'numeri') {
    // Mostro mini-menu di azioni invece di re-renderare
    showContattoActionMenu(contattoId, evt);
    return;
  }
  // Comportamento standard: naviga alla UOC con scroll/expand sezione.
  // Reset del marcatore: questa è un'apertura intenzionale del contatto (dalla ricerca o
  // da un'altra vista), quindi la sua sezione va riaperta anche se in passato era stata
  // collassata manualmente.
  state._lastFilterContattoInit = null;
  // Reset rubricaSearch prima di navigare: vogliamo aprire la UOC overview pulita
  // (non la vista UOC con la query di ricerca ancora attiva) e scrollare al contatto.
  _navigateOutOfRubricaSearch('numeri', { filter: contattoId });
}

// Helper: naviga fuori dalla ricerca rubrica resettando state.rubricaSearch.
// Da usare ogni volta che un click in lista-risultati-rubrica deve aprire una nuova vista
// (UOC overview, contatto centrato, ecc.) invece di continuare a filtrare la rubrica.
function _navigateOutOfRubricaSearch(route, params) {
  // Cancella eventuale debounce pendente: senza questo, una callback differita potrebbe
  // ri-settare state.rubricaSearch al valore digitato dopo che abbiamo navigato via.
  if (rubricaSearchDebounce) {
    clearTimeout(rubricaSearchDebounce);
    rubricaSearchDebounce = null;
  }
  if (state.rubricaSearch) {
    state.rubricaSearch = '';
    _lastRenderedRubricaQuery = null;
  }
  navigate(route, params);
}

/* Mini menu di azioni che appare al click su un contatto già nella sua UOC.
   Posizione: sopra la riga cliccata, allineato alla destra del nome.
   Azioni: Condividi link al contatto, Pinna alla home. */
function showContattoActionMenu(contattoId, evt) {
  // Rimuovi un menu già aperto
  document.querySelectorAll('.contatto-action-menu').forEach(m => m.remove());
  // Trova la riga del contatto (target dello stesso click o ricerca DOM)
  let row = evt && evt.currentTarget && evt.currentTarget.closest ? evt.currentTarget.closest('.numero-row') : null;
  if (!row) {
    row = document.querySelector(`.numero-row[data-contatto-id="${CSS.escape(contattoId)}"]`);
  }
  if (!row) return;
  // Costruisco il menu (passo solo l'id, il testo viene ricostruito al click per evitare quoting issues)
  const menu = document.createElement('div');
  menu.className = 'contatto-action-menu';
  menu.innerHTML = `
    <button class="contatto-action-btn" onclick="event.stopPropagation();shareContattoById('${escapeJs(contattoId)}');document.querySelectorAll('.contatto-action-menu').forEach(m=>m.remove());">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      Condividi
    </button>`;
  // Posiziono il menu come overlay vicino alla riga
  row.style.position = 'relative';
  row.appendChild(menu);
  // Close on click outside
  setTimeout(() => {
    const closeFn = (e) => {
      if (!menu.contains(e.target)) {
        menu.remove();
        document.removeEventListener('click', closeFn, true);
      }
    };
    document.addEventListener('click', closeFn, true);
  }, 0);
}

/* Condivide un contatto via Web Share API (mobile) o copia negli appunti (desktop fallback).
   Costruisce il testo come "Etichetta\nint. <numero>\npers. <cell>...". */
async function shareContattoById(contattoId) {
  // Trova il contatto in tutte le fonti dati, salvando anche il gruppo (UOC)
  let contatto = null, gruppo = null;
  for (const sourceId of ['aopd','osa','iov']) {
    const data = (typeof getNumeriDataForSource === 'function') ? getNumeriDataForSource(sourceId) : null;
    if (!data) continue;
    for (const g of (data.gruppi || [])) {
      const c = (g.contatti || []).find(x => x.id === contattoId);
      if (c) { contatto = c; gruppo = g; break; }
    }
    if (contatto) break;
  }
  if (!contatto) {
    if (typeof toast === 'function') toast('Contatto non trovato', 'error');
    return;
  }
  // Costruisci testo: 1) UOC abbreviata, 2) sezione, 3) etichetta, 4) numeri.
  const lines = [];
  if (gruppo) {
    const uocShort = (typeof shortenUocName === 'function') ? shortenUocName(gruppo) : (gruppo.nome || '');
    if (uocShort) lines.push(uocShort);
  }
  if (contatto.sezione) lines.push(contatto.sezione);
  if (contatto.etichetta) lines.push(contatto.etichetta);
  // Numeri (uno per riga)
  (contatto.numeri || []).forEach(n => lines.push(`int. ${n}`));
  if (contatto.breve) {
    const brevi = Array.isArray(contatto.breve) ? contatto.breve : [contatto.breve];
    brevi.forEach(b => lines.push(`breve ${b}`));
  }
  if (contatto.cellulare_aziendale) {
    const cells = Array.isArray(contatto.cellulare_aziendale) ? contatto.cellulare_aziendale : [contatto.cellulare_aziendale];
    cells.forEach(c => lines.push(c));
  }
  if (contatto.cellulare_personale) {
    const cells = Array.isArray(contatto.cellulare_personale) ? contatto.cellulare_personale : [contatto.cellulare_personale];
    cells.forEach(c => lines.push(`pers. ${c}`));
  }
  const text = lines.join('\n');
  // Web Share API solo su mobile; su desktop vado dritto al clipboard (più affidabile).
  const isMobileLike = (('ontouchstart' in window) || (navigator.maxTouchPoints > 0)) && window.innerWidth <= 900;
  if (navigator.share && isMobileLike) {
    try {
      await navigator.share({ text });
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(text);
    if (typeof toast === 'function') toast('Copiato negli appunti', 'success');
  } catch (e) {
    // Fallback legacy per contesti senza clipboard API.
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) { if (typeof toast === 'function') toast('Copiato negli appunti', 'success'); return; }
    } catch {}
    try { prompt('Copia il contatto:', text); } catch {}
  }
}

/* Costruisce un URL completo a partire da route+params (per condivisione esterna).
   A differenza di urlRouter.buildHash, restituisce URL assoluto includendo origin+pathname. */
function buildShareUrl(route, params, blockId) {
  if (typeof urlRouter === 'undefined') return window.location.href;
  let hash = urlRouter.buildHash(route, params);
  if (blockId) {
    // blockId è del tipo "bl-rachicentesi-5" → estraggo il numero per il formato URL
    const m = blockId.match(/^bl-[a-z0-9-]+-(\d+)$/i);
    if (m) hash += '/bl-' + m[1];
  }
  // location.origin + location.pathname taglia eventuali ?query e #hash residui
  return window.location.origin + window.location.pathname + hash;
}

/* ============================ EXPORT INDICE (NotebookLM) ============================
   Genera un file Markdown con TUTTO il contenuto indicizzato (schede + ogni blocco,
   contatti rubrica, moduli, pagine) e, accanto a ciascuna voce, il link diretto.
   Pensato per essere caricato in un'AI esterna (NotebookLM, ecc.): l'accostamento
   contenuto+URL nella stessa porzione permette all'AI di restituire il link corretto.
   Admin-only. Riusa buildShareUrl per URL assoluti coerenti col routing dell'app. */
function exportContentIndex() {
  if (typeof isAdmin === 'function' && !isAdmin()) { if (typeof toast === 'function') toast('Solo admin', 'error'); return; }
  if (typeof buildShareUrl !== 'function' || !state || !state.index) { if (typeof toast === 'function') toast('Indice non ancora caricato', 'error'); return; }
  const idx = state.index;
  const lines = [];
  const now = new Date().toISOString().slice(0, 10);

  const blkLabel = (b) => {
    if (!b) return '?';
    if (b.titolo) return b.titolo;
    if (b.caption) return b.caption;
    const map = { text: 'Testo', list: 'Elenco', checklist: 'Checklist', callout: 'Avviso', table: 'Tabella', image: 'Immagine', system_code: 'Codici sistema', link: 'Link', form_ref: 'Modulo', internal_ref: 'Riferimento', clinical_note: 'Nota clinica' };
    return map[b.tipo] || b.tipo || '?';
  };
  const blkText = (b) => {
    if (!b || !b.tipo) return '';
    const p = [];
    if (b.titolo) p.push(b.titolo);
    switch (b.tipo) {
      case 'text': case 'clinical_note': if (b.testo) p.push(b.testo); break;
      case 'list': case 'checklist': if (Array.isArray(b.items)) p.push(b.items.join(' · ')); break;
      case 'callout': p.push('[' + (b.variante || 'info') + ']'); if (b.testo) p.push(b.testo); break;
      case 'table':
        if (Array.isArray(b.headers)) p.push(b.headers.join(' | '));
        if (Array.isArray(b.rows)) b.rows.forEach((r) => p.push((Array.isArray(r) ? r : [r]).join(' | ')));
        break;
      case 'system_code':
        if (b.sistema) p.push(b.sistema);
        if (b.percorso) p.push(b.percorso);
        if (Array.isArray(b.codici)) p.push(b.codici.map((c) => ((c.codice || '') + ' ' + (c.descrizione || '')).trim()).filter(Boolean).join(', '));
        if (b.note) p.push(b.note);
        break;
      case 'link': if (b.url) p.push(b.url); if (b.fonte) p.push(b.fonte); break;
      case 'image': if (b.caption) p.push(b.caption); if (b.descrizione) p.push(b.descrizione); break;
      default: break;
    }
    return p.filter(Boolean).join(' — ');
  };
  const emitScheda = (s, route) => {
    if (!s || !s.slug) return;
    const cat = [s.categoria, s.sottocategoria].filter(Boolean).join(' · ');
    lines.push('## ' + (s.titolo || s.slug) + (cat ? '  (' + cat + ')' : ''));
    const meta = [];
    if (Array.isArray(s.tag) && s.tag.length) meta.push('tag: ' + s.tag.join(', '));
    if (Array.isArray(s.termini_equivalenti) && s.termini_equivalenti.length) meta.push('anche detto: ' + s.termini_equivalenti.join(', '));
    if (meta.length) lines.push(meta.join(' — '));
    lines.push(buildShareUrl(route, { slug: s.slug }));
    lines.push('');
    (Array.isArray(s.contenuti) ? s.contenuti : []).forEach((b, i) => {
      lines.push('### ' + (s.titolo || s.slug) + ' › ' + blkLabel(b) + ' (' + ((b && b.tipo) || '?') + ')');
      const txt = blkText(b);
      if (txt) lines.push(txt);
      lines.push(buildShareUrl(route, { slug: s.slug }, 'bl-' + s.slug + '-' + i));
      lines.push('');
    });
  };

  lines.push('# Contenuto completo CollinettaAI');
  lines.push('Generato il ' + now + '. Ogni voce riporta il contenuto integrale e, sotto, il link diretto da aprire nell\u2019app.');
  lines.push('');
  lines.push('---', '# Procedure', '');
  (idx.procedure || []).forEach((s) => emitScheda(s, 'procedura'));
  lines.push('---', '# Schede cliniche', '');
  (idx.clinica || []).forEach((s) => emitScheda(s, 'clinica-scheda'));

  lines.push('---', '# Rubrica (contatti)', '');
  const groups = [];
  if (idx.numeri && idx.numeri.gruppi) groups.push(...idx.numeri.gruppi);
  const ext = idx.numeriExtended || {};
  if (ext.osa && ext.osa.gruppi) groups.push(...ext.osa.gruppi);
  if (ext.iov && ext.iov.gruppi) groups.push(...ext.iov.gruppi);
  groups.forEach((g) => {
    (g.contatti || []).forEach((c) => {
      if (!c || !c.id) return;
      const sez = c.sezione ? ' · ' + c.sezione : '';
      lines.push('## ' + (c.etichetta || c.id) + ' — ' + (g.nome || '') + sez);
      const arr = (v) => Array.isArray(v) ? v : (v ? [v] : []);
      const interni = (c.numeri || []).map(String).filter(Boolean);
      const cellP = arr(c.cellulare_personale).map(String).filter(Boolean);
      const cellA = arr(c.cellulare_aziendale).map(String).filter(Boolean);
      if (interni.length) lines.push('interni: ' + interni.join(' · '));
      if (cellP.length) lines.push('cell. personale: ' + cellP.join(' · '));
      if (cellA.length) lines.push('cell. aziendale: ' + cellA.join(' · '));
      if (c.breve) lines.push('breve: ' + (Array.isArray(c.breve) ? c.breve.join(' · ') : c.breve));
      if (Array.isArray(c.tag) && c.tag.length) lines.push('tag: ' + c.tag.join(', '));
      lines.push(buildShareUrl('numeri', { filter: c.id }));
      lines.push('');
    });
  });

  lines.push('---', '# Moduli compilabili', '');
  (idx.moduli || []).forEach((m) => {
    if (!m || !m.slug) return;
    lines.push('## ' + (m.titolo || m.slug));
    if (m.descrizione) lines.push(m.descrizione);
    lines.push(buildShareUrl('modulo', { slug: m.slug }));
    lines.push('');
  });

  lines.push('---', '# Pagine', '');
  [['Home', 'home'], ['Reparto', 'reparto'], ['Rubrica', 'numeri'], ['Moduli', 'moduli'], ['Calendario', 'calendario'], ['Lettere di dimissione', 'lettere']].forEach((pg) => {
    lines.push('## ' + pg[0]);
    lines.push(buildShareUrl(pg[1], {}));
    lines.push('');
  });

  const md = lines.join('\n');
  try {
    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'collinetta-contenuto-' + now + '.md';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    const nContatti = groups.reduce((n, g) => n + ((g.contatti || []).length), 0);
    if (typeof toast === 'function') toast('Indice esportato: ' + (idx.procedure || []).length + ' procedure, ' + (idx.clinica || []).length + ' cliniche, ' + nContatti + ' contatti, ' + (idx.moduli || []).length + ' moduli', 'success', 5000);
  } catch (e) {
    if (typeof toast === 'function') toast('Export fallito: ' + e.message, 'error');
  }
}

// Esporta un "file tree": mostra come sono organizzate le cartelle (categoria →
// sottocategoria → scheda) per procedure, schede cliniche e moduli. Pensato per essere
// dato in pasto a un AI: niente icone, indentazione semplice, ogni scheda riporta slug
// e titolo. Niente contenuto dei blocchi, niente rubrica.
function exportFileTree() {
  if (typeof isAdmin === 'function' && !isAdmin()) { if (typeof toast === 'function') toast('Solo admin', 'error'); return; }
  if (!state || !state.index) { if (typeof toast === 'function') toast('Indice non ancora caricato', 'error'); return; }
  const idx = state.index;
  const now = new Date().toISOString().slice(0, 10);
  const lines = [];

  const catLabel = (c) => (typeof CATEGORIA_LABELS !== 'undefined' && CATEGORIA_LABELS[c]) || c || 'senza-categoria';
  const subLabel = (s) => (typeof SOTTO_LABELS !== 'undefined' && SOTTO_LABELS[s]) || (s === '_senza' ? 'senza-sottocategoria' : (s || 'senza-sottocategoria'));
  const schedaLine = (s) => (s.slug || '?') + ' — ' + (s.titolo || s.slug || '?');

  // Raggruppa una lista di schede per categoria → sottocategoria e la stampa come albero
  // con indentazione a 2 spazi per livello.
  const emitTree = (schede, opts) => {
    opts = opts || {};
    const useSub = opts.useSub !== false;
    const byCat = {};
    (schede || []).forEach((s) => {
      const cat = s.categoria || '_senza';
      const sub = useSub ? (s.sottocategoria || '_senza') : '__flat';
      (byCat[cat] = byCat[cat] || {});
      (byCat[cat][sub] = byCat[cat][sub] || []).push(s);
    });
    const cats = Object.keys(byCat).sort((a, b) => catLabel(a).localeCompare(catLabel(b), 'it'));
    cats.forEach((cat) => {
      const subsObj = byCat[cat];
      const nCat = Object.values(subsObj).reduce((n, arr) => n + arr.length, 0);
      lines.push('  ' + catLabel(cat) + '/  (' + nCat + ')');
      const subs = Object.keys(subsObj).sort((a, b) => subLabel(a).localeCompare(subLabel(b), 'it'));
      subs.forEach((sub) => {
        const arr = subsObj[sub].slice().sort((a, b) => (a.titolo || a.slug || '').localeCompare(b.titolo || b.slug || '', 'it'));
        if (sub === '__flat') {
          arr.forEach((s) => lines.push('    ' + schedaLine(s)));
        } else {
          lines.push('    ' + subLabel(sub) + '/  (' + arr.length + ')');
          arr.forEach((s) => lines.push('      ' + schedaLine(s)));
        }
      });
    });
  };

  lines.push('# Struttura cartelle CollinettaAI');
  lines.push('Generato il ' + now + '. Mostra solo l\\u2019organizzazione delle cartelle (categoria/sottocategoria), senza contenuto. Ogni scheda: slug — titolo.');
  lines.push('');

  lines.push('Procedure/  (' + (idx.procedure || []).length + ')');
  emitTree(idx.procedure || [], { useSub: true });
  lines.push('');

  lines.push('Schede cliniche/  (' + (idx.clinica || []).length + ')');
  emitTree(idx.clinica || [], { useSub: true });
  lines.push('');

  lines.push('Moduli compilabili/  (' + (idx.moduli || []).length + ')');
  (idx.moduli || []).slice().sort((a, b) => (a.titolo || a.slug || '').localeCompare(b.titolo || b.slug || '', 'it'))
    .forEach((m) => lines.push('  ' + ((m.slug || '?') + ' — ' + (m.titolo || m.slug || '?'))));

  const txt = lines.join('\\n');
  try {
    const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'collinetta-struttura-' + now + '.txt';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    if (typeof toast === 'function') toast('Struttura esportata', 'success', 3000);
  } catch (e) {
    if (typeof toast === 'function') toast('Export fallito: ' + e.message, 'error');
  }
}
window.exportFileTree = exportFileTree;

/* ============================ CRYPTO ============================ */
function base64ToBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

async function deriveKey(passphrase, saltBuf, iterations) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBuf, iterations, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

async function decryptUserData(entry, passphrase) {
  const salt = base64ToBuffer(entry.salt);
  const iv = base64ToBuffer(entry.iv);
  const ciphertext = base64ToBuffer(entry.ciphertext);
  const key = await deriveKey(passphrase, salt, entry.iterations || 250000);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
  const plainText = new TextDecoder().decode(plainBuf);
  // Payload is always a JSON object: {token, nome?, cognome?}
  return JSON.parse(plainText);
}
