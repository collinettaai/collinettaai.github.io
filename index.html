<!DOCTYPE html>

<script>
// === ANTI-FOUC ===
// Script blocking inline: applica subito tema/font da sessionStorage cache prima
// che il browser renderizzi anything. Evita il flash dark→light durante refresh
// o login (perché userPrefs.load() fa una fetch GitHub e impiega centinaia di ms).
// La cache viene popolata da applyTheme/applyFontSize ed è solo per-sessione.
(function() {
  try {
    // localStorage sopravvive tra avvii (incluso cold start PWA): se l'utente ha già
    // scelto un tema, lo applichiamo SUBITO senza aspettare la fetch di userPrefs da
    // GitHub. Senza questo, al primo avvio si ripiega su 'auto' (= schema del sistema)
    // e si vede un flash del tema sbagliato (es. dark) prima del cambio a light.
    var theme = localStorage.getItem('collinettaai.theme-pref')
             || sessionStorage.getItem('collinettaai.theme-cache') || 'auto';
    var effective = theme;
    if (theme === 'auto') {
      effective = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', effective);
    document.documentElement.setAttribute('data-theme-pref', theme);
    var font = localStorage.getItem('collinettaai.font-pref')
            || sessionStorage.getItem('collinettaai.font-cache') || 'md';
    document.documentElement.setAttribute('data-font-size', font);
  } catch (e) { /* storage non disponibile, fallback ai default CSS */ }
})();
</script>

<style>
:root {
  --bg:#F6F2EA; --bg-paper:#FBF8F2; --bg-raised:#FEFDF9; --bg-sink:#EFE9DC;
  --ink:#1A1A1A; --ink-soft:#44433F; --ink-muted:#7A7772; --ink-faint:#A29E96;
  --rule:#D9D2C3; --rule-soft:#E8E3D6; --rule-strong:#BEB5A1;
  --accent:#2B4A6F; --accent-soft:#E6EBF2; --accent-dark:#1F3654; --accent-muted:#6b88a8;
  --warning:#8A5A1F; --warning-soft:#F4EBD9;
  --danger:#8F2E2A; --danger-soft:#F4E3E2;
  --success:#2F5F3D; --success-soft:#E6F0E9;
  --serif:'Fraunces','Iowan Old Style','Times New Roman',serif;
  --sans:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  --shadow-subtle:0 1px 0 rgba(255,255,255,0.7) inset, 0 0 0 1px rgba(0,0,0,0.02);
  --shadow-raised:0 4px 16px rgba(43,42,40,0.06), 0 1px 3px rgba(43,42,40,0.04);
  --shadow-modal:0 20px 60px rgba(43,42,40,0.18), 0 2px 8px rgba(43,42,40,0.08);
  --topbar-height:68px;   /* altezza effettiva topbar sticky, usata per scroll-margin-top */
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;overflow-x:clip;max-width:100%;-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--topbar-height) + var(--edit-banner-height, 0px) + 12px)}
/* Font size scale: zoom applicato solo al contenuto principale, non a topbar/sidebar */
html[data-font-size="sm"] main.content{zoom:0.88}
html[data-font-size="md"] main.content{zoom:1}
html[data-font-size="lg"] main.content{zoom:1.12}
html[data-font-size="xl"] main.content{zoom:1.25}
body{font-family:var(--sans);font-size:1rem;line-height:1.55;color:var(--ink);background:var(--bg);min-height:100vh;overflow-x:clip;max-width:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior-y:none;overflow-anchor:none}
html{overscroll-behavior-y:none;overflow-anchor:none;color-scheme:light}
html[data-theme="dark"] option,html[data-theme="dark"] select,html[data-theme="dark"] input{background:var(--bg-raised);color:var(--ink)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse 80% 60% at 20% 0%,rgba(43,74,111,0.035),transparent 70%),radial-gradient(ellipse 70% 50% at 100% 100%,rgba(138,90,31,0.03),transparent 70%)}
.hidden{display:none!important}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s}
a:hover{border-color:var(--accent)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
code{font-family:var(--mono);font-size:.92em;background:var(--bg-sink);padding:2px 5px;border-radius:2px}

/* === BOOT SPLASH ===
   Coperta visibile dal primo render fino a quando JS dichiara l'app pronta.
   Usa le CSS variables, quindi rispetta tema chiaro/scuro applicato dallo script anti-FOUC.
   Si nasconde con html.splash-done con un fade morbido. */
#boot-splash{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  opacity:1;
  transition:opacity .25s ease-out;
  pointer-events:auto;
}
.boot-splash-inner{
  display:flex;flex-direction:column;align-items:center;gap:24px;
}
.boot-splash-logo{
  width:80px;height:80px;object-fit:contain;
  opacity:.92;
}
.boot-splash-logo-dark{display:none}
[data-theme="dark"] .boot-splash-logo-light{display:none}
[data-theme="dark"] .boot-splash-logo-dark{display:block}
.boot-splash-spinner{
  width:24px;height:24px;
  border:2px solid var(--rule);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:boot-splash-spin .8s linear infinite;
}
@keyframes boot-splash-spin{
  to{transform:rotate(360deg)}
}
html.splash-done #boot-splash{
  opacity:0;
  pointer-events:none;
}
/* Dopo il fade, rimuoviamo proprio l'elemento dal flusso (con un piccolo delay
   gestito da JS via setTimeout per coprire la durata della transizione) */
html.splash-removed #boot-splash{
  display:none;
}

/* LOGIN */
#login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.login-card{max-width:440px;width:100%;background:var(--bg-paper);border:1px solid var(--ink);border-radius:2px;padding:48px 40px;box-shadow:6px 6px 0 var(--rule-strong);position:relative}
.login-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:14px}
.login-title{font-family:var(--serif);font-weight:500;font-style:italic;font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:0}
.login-title em{font-style:italic;font-weight:500}
.login-brand{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:36px}
.login-logo{height:46px;width:auto;object-fit:contain;flex-shrink:0}
.login-logo-dark{display:none}
.login-subtitle{font-family:var(--serif);font-style:italic;font-weight:300;font-size:16px;color:var(--ink-muted);margin-bottom:36px}
.field{margin-bottom:20px}
label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);font-weight:500;margin-bottom:6px}
.login-card .field label{font-size:12px}
input[type="text"],input[type="password"],textarea,select{width:100%;font-family:var(--sans);font-size:15px;padding:12px 14px;background:var(--bg-raised);border:1px solid var(--rule);border-radius:2px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.mono-input{font-family:var(--mono);font-size:14px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-size:14px;font-weight:500;padding:12px 22px;border:1px solid var(--ink);background:var(--ink);color:var(--bg-paper);border-radius:2px;cursor:pointer;transition:background .15s,transform .08s;letter-spacing:.01em;white-space:nowrap}
.btn:hover{background:var(--ink-soft)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.secondary{background:transparent;color:var(--ink)}
.btn.secondary:hover{background:var(--rule-soft)}
.btn.ghost{background:transparent;border-color:var(--rule);color:var(--ink-soft)}
.btn.ghost:hover{border-color:var(--ink);color:var(--ink);background:var(--bg-raised)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{background:#7a2723;color:#fff}
.btn.ghost.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.ghost.danger:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.small{font-size:12px;padding:6px 12px}

/* Gestione utenti — toolbar ricerca + filtri ruolo */
.ut-toolbar{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.ut-search-wrap{position:relative;max-width:420px}
.ut-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-muted);pointer-events:none}
.ut-search-input{width:100%;padding:10px 40px 10px 38px;font-size:15px;font-family:var(--sans);border:1px solid var(--rule);border-radius:2px;background:var(--bg-paper);color:var(--ink);transition:border-color .15s,background .15s}
.ut-search-input:focus{outline:none;border-color:var(--ink);background:var(--bg)}
.ut-search-input::-webkit-search-cancel-button{display:none}
.ut-search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:none;background:transparent;color:var(--ink-muted);font-size:20px;line-height:1;cursor:pointer;border-radius:2px;display:flex;align-items:center;justify-content:center;padding:0}
.ut-search-clear:hover{background:var(--rule-soft);color:var(--ink)}
.ut-chips{display:flex;flex-wrap:wrap;gap:6px}
.ut-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg-paper);border:1px solid var(--rule);border-radius:14px;font-family:var(--sans);font-size:12px;color:var(--ink-soft);cursor:pointer;transition:all .12s;letter-spacing:.01em}
.ut-chip:hover{border-color:var(--ink-soft);background:var(--bg-sink)}
.ut-chip.active{background:var(--ink);color:var(--bg-paper);border-color:var(--ink)}
.ut-chip.active:hover{background:var(--ink-soft);border-color:var(--ink-soft)}
.ut-chip-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;padding:1px 5px;font-family:var(--mono);font-size:10px;font-weight:600;background:var(--bg-sink);color:var(--ink-muted);border-radius:10px}
.ut-chip.active .ut-chip-count{background:rgba(255,255,255,.2);color:var(--bg-paper)}

/* ============================ PERMESSI (modali gestione utenti) ============================ */
.perm-grid{border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.perm-grid-off{opacity:.5}
.perm-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule-soft)}
.perm-row:last-child{border-bottom:none}
.perm-row:nth-child(odd){background:var(--bg-sink)}
.perm-sez{flex:1;min-width:0;font-size:14px;color:var(--ink)}
.perm-hint{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-muted);margin-top:2px}
/* reset del text-transform:uppercase globale su label */
.perm-cell{display:flex;align-items:center;gap:6px;margin:0;font-family:var(--sans);font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.perm-cell input{width:16px;height:16px;margin:0;flex:none}
.perm-inherit{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:10px 12px;background:var(--bg-sink);border:1px solid var(--rule);border-radius:2px;font-family:var(--sans);font-size:13px;letter-spacing:0;text-transform:none;color:var(--ink);cursor:pointer}
.perm-inherit input{width:16px;height:16px;margin:0;flex:none}
@media (max-width:520px){
  .perm-row{flex-wrap:wrap}
  .perm-sez{flex:1 1 100%}
}

/* ============================ ATTIVITA RECENTE (admin) ============================ */
.at-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:16px 0 24px}
.at-metric{padding:12px 16px;background:var(--bg-paper);border:1px solid var(--rule);border-radius:3px}
.at-metric-label{font-size:11px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:4px;font-weight:500}
.at-metric-value{font-size:22px;font-weight:500;color:var(--ink);font-family:var(--serif)}
.at-metric-api{font-family:var(--mono);font-size:16px;font-weight:600}
.at-metric-api.warning{color:var(--warning)}
.at-metric-api.danger{color:var(--danger)}

.at-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.at-chips{display:flex;gap:6px;flex-wrap:wrap}
.at-toolbar-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.at-error{padding:10px 14px;background:var(--danger-soft);color:var(--danger);border-left:3px solid var(--danger);border-radius:2px;margin-bottom:14px;font-size:13px}

.at-events{border:1px solid var(--rule);border-radius:3px;background:var(--bg-paper);overflow:hidden}
.at-event{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--rule-soft);transition:background .12s}
.at-event:last-child{border-bottom:none}
.at-event:hover{background:var(--bg-sink)}
.at-avatar{width:32px;height:32px;border-radius:50%;background:var(--bg-sink);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-family:var(--mono);flex-shrink:0}
.at-avatar-admin{background:var(--accent-soft);color:var(--accent)}
.at-event-main{flex:1;min-width:0}
.at-event-line{font-size:14px;line-height:1.4;color:var(--ink-soft)}
.at-event-line strong{color:var(--ink);font-weight:600}
.at-event-verb{color:var(--ink-muted);margin:0 4px}
.at-event-target{color:var(--accent);font-weight:500}
.at-event-nota{font-size:12px;color:var(--ink-muted);margin-top:2px;line-height:1.4}
.at-event-tipo{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);background:var(--bg-sink);padding:3px 8px;border-radius:2px;flex-shrink:0;font-weight:500}

.btn.full{width:100%}
.btn.sm{font-size:12px;padding:8px 14px}

.login-help{margin-top:32px;padding-top:24px;border-top:1px solid var(--rule-soft);font-size:13px;color:var(--ink-muted);line-height:1.6}
.login-error{display:none;margin-bottom:16px;padding:10px 14px;background:var(--danger-soft);border-left:3px solid var(--danger);border-radius:2px;font-size:13px;color:var(--danger)}
.login-error.visible{display:block}

/* APP SHELL */
#app-view{display:grid;grid-template-rows:auto auto 1fr;min-height:100vh}
header.topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;padding:14px 24px;background:var(--bg);border-bottom:1px solid var(--rule);box-sizing:border-box}
/* La topbar è fixed (fuori dal flusso): compenso lo spazio con padding-top sull'app-body,
   pari all'altezza della topbar (misurata in --topbar-height via JS). Questo evita che il
   browser scrolli il documento per "rivelare il caret" dell'input quando era sticky. */
.app-body{padding-top:var(--topbar-height,64px)}
@media (max-width:900px){
  header.topbar{
    grid-template-columns:auto 1fr auto;
    grid-template-areas:"hamb brand actions" "search search search";
    gap:10px 12px;padding:10px 14px;
  }
  header.topbar > .btn-hamburger{grid-area:hamb}
  header.topbar > .brand{grid-area:brand;justify-self:start;min-width:0;overflow:hidden}
  header.topbar > .search-wrap-outer{grid-area:search;max-width:100%;margin:0;min-width:0;width:100%}
  .search-wrap input{font-size:16px;padding:8px 12px 8px 34px;max-width:100%;box-sizing:border-box}
  header.topbar > .topbar-actions{grid-area:actions;justify-self:end;min-width:0;flex-shrink:0}
  .brand-divider,.brand-sub{display:none}
  .brand-mark{font-weight:600;font-optical-sizing:none;font-variation-settings:"opsz" 40,"wght" 600}
  /* Su mobile, riduci lo spazio tra logo e titolo */
  .brand-home-link{gap:4px}
  .search-kbd{display:none}
  /* Compact icon-btn on mobile */
  .topbar-actions .user-name{display:none}
  .topbar-actions{gap:4px}
  .icon-btn{width:32px;height:32px}
  .user-chip{padding:4px 6px 4px 4px}
}
@media (max-width:420px){
  :root{--topbar-height:60px}
  header.topbar{padding:10px 10px;gap:8px 8px}
  #rate-limit-indicator{display:none!important}
}
/* PWA standalone (iOS "Aggiungi a Home") — gestisce notch/dynamic island con safe-area.
   Senza questo, la topbar sticky finirebbe sotto il notch e il contenuto sarebbe nascosto
   anche dopo lo scroll a un blocco condiviso. Il padding-top extra spinge giù la topbar
   di una quantità pari al safe-area-inset-top (44px su iPhone con notch). */
@media (display-mode: standalone){
  header.topbar{padding-top:calc(14px + env(safe-area-inset-top, 0px))}
}
@media (display-mode: standalone) and (max-width:420px){
  header.topbar{padding-top:calc(10px + env(safe-area-inset-top, 0px))}
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-home-link{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.brand-logo{width:auto;height:clamp(18px,5.2vw,32px);object-fit:contain;flex-shrink:0}
.brand-logo-dark{display:none}
[data-theme="dark"] .brand-logo-light{display:none}
[data-theme="dark"] .brand-logo-dark{display:block}
[data-theme="dark"] .login-logo-light{display:none!important}
[data-theme="dark"] .login-logo-dark{display:block!important}
/* Titolo CollinettaAI: scaling automatico tra 13px (schermi minuscoli) e 22px (desktop).
   Il valore preferito 4.5vw fa scalare in modo proporzionale alla larghezza viewport. */
.brand-mark{font-family:var(--serif);font-weight:500;font-style:italic;font-size:clamp(15px,4.5vw,22px);letter-spacing:-.02em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:.15em}
.brand-divider{width:1px;height:16px;background:var(--rule-strong)}
.brand-sub{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.search-wrap{position:relative;flex:1;min-width:0}
.search-wrap input{padding:10px 14px 10px 38px;font-size:14px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-muted);pointer-events:none}
.search-wrap-outer{display:flex;align-items:center;gap:8px;width:100%;min-width:0;max-width:620px;margin:0 auto}
.nav-history-btns{display:flex;gap:2px;flex-shrink:0}
.nav-history-btn{width:32px;height:32px;border:1px solid var(--rule);background:var(--bg-raised);color:var(--ink-soft);border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background .12s,color .12s,border-color .12s}
.nav-history-btn:hover:not(:disabled){background:var(--bg-sink);color:var(--ink);border-color:var(--rule-strong)}
.nav-history-btn:disabled{opacity:.3;cursor:default}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:none;background:var(--bg-raised);color:var(--ink-muted);border-radius:50%;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.search-clear:hover{background:var(--rule);color:var(--ink)}
@media (max-width:900px){.search-clear{right:10px}}
.search-wrap input{padding-right:96px}
.search-kbd{position:absolute;right:40px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:2px 6px;border:1px solid var(--rule);border-radius:2px;background:var(--bg-raised)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:2px;color:var(--ink-soft);transition:background .15s,color .15s;position:relative}
.icon-btn:hover{background:var(--rule-soft);color:var(--ink)}
.user-chip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:2px;border:1px solid var(--rule);cursor:pointer;transition:background .15s;user-select:none;position:relative}
.user-chip:hover{background:var(--bg-raised)}
.user-menu-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--bg-paper);border:1px solid var(--rule);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:8px;min-width:240px;z-index:1000}
.user-menu-dropdown.hidden{display:none}
.user-menu-section{padding:6px 4px}
.user-menu-label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:6px;padding:0 8px}
.theme-options{display:flex;gap:4px;padding:0 4px}
.theme-opt{flex:1;padding:6px 8px;background:transparent;border:1px solid var(--rule);border-radius:4px;font-size:12px;color:var(--ink);cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:0}
.font-stepper{display:flex;align-items:center;gap:4px;padding:0 4px}
.font-step-btn{width:32px;height:32px;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:4px;font-size:18px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;font-family:inherit}
.font-step-btn:hover:not(:disabled){background:var(--bg-sink)}
.font-step-btn:disabled{opacity:.3;cursor:default}
.font-step-label{flex:1;text-align:center;font-size:12px;color:var(--ink-muted);font-family:var(--mono)}

/* Font size scale: definita sopra come html[data-font-size="..."] */
.theme-opt:hover{background:var(--bg-sink)}
.theme-opt.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.user-menu-divider{height:1px;background:var(--rule);margin:6px 0}
.user-menu-item{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;background:transparent;border:none;border-radius:4px;font-size:13px;color:var(--ink);cursor:pointer;text-align:left;font-family:inherit}
.user-menu-item:hover{background:var(--bg-sink)}

/* Dark theme */
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121212;
  --bg-paper:#1a1a1a;
  --bg-sink:#252525;
  --bg-raised:#2a2a2a;
  --ink:#e8e8e8;
  --ink-soft:#b8b8b8;
  --ink-muted:#888;
  --ink-faint:#555;
  --rule:#333;
  --rule-soft:#2a2a2a;
  --rule-strong:#444;
  --accent:#6ba4f5;
  --accent-soft:#1e3a5f;
  --accent-muted:#5a7a9a;
  --danger:#f07070;
  --danger-soft:#4a1f1f;
  --warning:#f5a35f;
}
[data-theme="dark"] body{background:#121212;color:var(--ink)}
[data-theme="dark"] header.topbar{background:var(--bg)}

/* Palette D in dark mode: bg neutro + bordo colorato + numero pillola + pallino davanti al nome */
[data-theme="dark"] .numero-row-guardia,
[data-theme="dark"] .numero-row-reparto,
[data-theme="dark"] .numero-row-utile,
[data-theme="dark"] .sr-contact-guardia,
[data-theme="dark"] .sr-contact-reparto,
[data-theme="dark"] .sr-contact-utile{
  background:var(--bg-paper);
}
[data-theme="dark"] .numero-row-guardia:hover,
[data-theme="dark"] .sr-contact-guardia:hover{background:#241010}
[data-theme="dark"] .numero-row-reparto:hover,
[data-theme="dark"] .sr-contact-reparto:hover{background:#101a26}
[data-theme="dark"] .numero-row-utile:hover,
[data-theme="dark"] .sr-contact-utile:hover{background:#101a10}

/* Label colorate restano colorate in dark, ma più chiare e leggibili */
[data-theme="dark"] .numero-row-guardia .numero-label,
[data-theme="dark"] .sr-contact-guardia .sr-contact-label{color:#f0a0a0}
[data-theme="dark"] .numero-row-reparto .numero-label,
[data-theme="dark"] .sr-contact-reparto .sr-contact-label{color:#9ec0ee}
[data-theme="dark"] .numero-row-utile .numero-label,
[data-theme="dark"] .sr-contact-utile .sr-contact-label{color:#a8d480}

/* Numero principale come pillola colorata piena (palette dark) */
[data-theme="dark"] .numero-row-guardia .numero-num-primary,
[data-theme="dark"] .sr-contact-num-guardia{
  background:#3a1f1f!important;color:#e07b7b!important;border-color:#e07b7b!important;font-weight:600
}
[data-theme="dark"] .numero-row-reparto .numero-num-primary,
[data-theme="dark"] .sr-contact-num-reparto{
  background:#1f2d3f!important;color:#7ba3d4!important;border-color:#7ba3d4!important;font-weight:600
}
[data-theme="dark"] .numero-row-utile .numero-num-primary,
[data-theme="dark"] .sr-contact-num-utile{
  background:#1f3320!important;color:#7bc97e!important;border-color:#7bc97e!important;font-weight:600
}
[data-theme="dark"] .numero-row-guardia .numero-num-primary:hover{background:#e07b7b!important;color:#1a0808!important}
[data-theme="dark"] .numero-row-reparto .numero-num-primary:hover{background:#7ba3d4!important;color:#081830!important}
[data-theme="dark"] .numero-row-utile .numero-num-primary:hover{background:#7bc97e!important;color:#0a1804!important}
.user-avatar{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--bg-paper);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em}
.rate-limit-pill{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:4px 8px;border-radius:2px;background:var(--bg-sink);color:var(--ink-muted);border:1px solid var(--rule-soft);white-space:nowrap}
.rate-limit-pill.warning{background:var(--warning-soft);color:var(--warning);border-color:var(--warning)}
.rate-limit-pill.danger{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}

/* Edit mode */
.edit-banner{position:fixed;top:calc(var(--topbar-height) - 1px);left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:10px 24px;background:var(--accent-soft);border-bottom:1px solid var(--accent);color:var(--accent);font-size:13px;gap:12px;flex-wrap:wrap;max-height:80px;box-sizing:border-box;overflow:hidden}
.edit-banner-text{display:inline-flex;align-items:center;gap:8px;font-weight:500;min-width:0;flex:1}
/* Label swap: full visibile su desktop, short su mobile */
.banner-label-full{display:inline}
.banner-label-short{display:none}
@media (max-width:700px){
  .edit-banner{padding:5px 10px;font-size:12px;gap:6px;flex-wrap:nowrap;max-height:38px;min-height:32px}
  .edit-banner-text{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:var(--accent);font-weight:600}
  .edit-banner .btn.sm{font-size:11px;padding:4px 8px;white-space:nowrap}
  .banner-label-full{display:none}
  .banner-label-short{display:inline}
}
.icon-btn.active{background:var(--accent);color:var(--bg-paper)}
body.edit-mode .app-body{outline:2px solid var(--accent);outline-offset:-1px;padding-top:calc(var(--topbar-height,64px) + var(--edit-banner-height,44px))}
.edit-only{display:none !important}
body.edit-mode .edit-only{display:revert !important}
body.edit-mode .edit-only.btn{display:inline-flex !important}

/* Nav tree (sidebar nuova) — usa il font serif coerente con le page-title */
.nav-tree-node{user-select:none}
.nav-tree-row{display:flex;align-items:center;gap:6px;padding:5px 10px;cursor:pointer;font-family:var(--serif);font-size:15px;border-radius:2px;color:var(--ink-soft);position:relative;transition:background .1s}
.nav-tree-row:hover{background:var(--rule-soft);color:var(--ink)}
.nav-tree-row.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav-tree-row.expanded{font-weight:500;color:var(--ink)}
.nav-tree-caret{display:inline-block;width:12px;font-size:10px;color:var(--ink-faint);text-align:center;flex-shrink:0;transition:transform .12s}
.nav-tree-caret-clickable{cursor:pointer;padding:6px 8px;margin:-6px -8px -6px -4px;border-radius:3px}
.nav-tree-caret-clickable:hover{background:var(--rule-soft);color:var(--ink)}
.nav-tree-caret-clickable:active{background:var(--rule)}
@media (max-width:900px){
  .nav-tree-caret-clickable{padding:8px 10px;margin:-8px 2px -8px -6px;min-width:28px}
}
.nav-tree-row.expanded > .nav-tree-caret{transform:rotate(0)}
.nav-tree-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Bollino blu numerato del flusso LetteraAI in sidebar (stile coerente con .lt-home-n della home) */
.nav-tree-num{flex:0 0 20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--mono,monospace);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.nav-tree-row.active .nav-tree-num,.nav-tree-row.expanded .nav-tree-num{background:var(--accent);color:#fff}
.nav-tree-count{display:none}
.nav-tree-children{padding-left:14px;border-left:1px dashed var(--rule-soft);margin-left:10px;display:none}
.nav-tree-node.open > .nav-tree-children{display:block}
.nav-tree-children .nav-tree-row{font-size:14px;padding:4px 10px}

/* Sidebar drill-down mode */
.nav-drill-back{display:flex;align-items:center;gap:6px;padding:10px 12px;margin-bottom:6px;font-size:13px;color:var(--accent);cursor:pointer;border-radius:2px;background:var(--rule-soft);border:1px solid var(--rule);font-family:var(--mono);letter-spacing:.02em;transition:background .12s}
.nav-drill-back:hover{background:var(--rule);color:var(--ink)}
.nav-drill-back svg{flex-shrink:0}
.nav-drill-header{padding:10px 12px 8px;border-bottom:1px solid var(--rule);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.nav-drill-header-clickable{cursor:pointer;border-radius:3px;transition:background .1s}
.nav-drill-header-clickable:hover{background:var(--rule-soft)}
.nav-drill-header-clickable:hover .nav-drill-title{color:var(--accent)}
.nav-drill-title{font-family:var(--serif);font-size:17px;font-weight:500;color:var(--ink);flex:1}
.nav-drill-header .nav-tree-count{display:inline-flex;font-family:var(--mono);font-size:11px;color:var(--ink-muted);background:var(--rule-soft);padding:2px 6px;border-radius:2px}
.nav-drill-overview{border-bottom:1px dashed var(--rule-soft);margin-bottom:6px;padding-bottom:8px;font-style:italic;color:var(--ink-soft)}

/* Root-level sidebar rows (nuova UX drill-down) */
.nav-tree-root-row{padding:16px 14px;font-family:var(--serif);font-size:16px;font-weight:500;color:var(--ink);border-radius:4px;justify-content:space-between;position:relative}
.nav-tree-root-row:hover{background:var(--rule-soft)}
/* Durante l'hover la linea divisoria sparisce così l'evidenziazione non mostra lo stacco.
   Nascondo sia la linea SOTTO la sezione in hover, sia quella del nodo PRECEDENTE
   (che appare sopra la sezione in hover), così non resta nessuno stacco visibile. */
.nav-tree-node:has(> .nav-tree-root-row:hover) > .nav-tree-root-row::after{opacity:0}
.nav-tree-node:has(+ .nav-tree-node > .nav-tree-root-row:hover) > .nav-tree-root-row::after{opacity:0}
.nav-tree-root-row .nav-tree-label{font-weight:500;font-family:var(--serif)}
.nav-tree-root-row .nav-tree-count{display:none}
/* Linea sottile tra le categorie root: bordo inferiore con margin laterale.
   Si "comporta bene" con l'hover (è dentro l'elemento, non una pseudo separata). */
.nav-tree-node:has(> .nav-tree-root-row):not(:last-child) > .nav-tree-root-row::after{
  content:'';
  position:absolute;
  left:14px;
  right:14px;
  bottom:-1px;
  height:1px;
  background:var(--rule-soft);
  pointer-events:none;
}
.nav-tree-node:has(> .nav-tree-root-row){padding-bottom:1px}
.nav-tree-chevron{font-size:18px;color:var(--ink-faint);flex-shrink:0;margin-left:4px;transition:color .12s}
.nav-tree-root-row:hover .nav-tree-chevron{color:var(--ink)}
.nav-tree-drill-row{padding:8px 12px;font-family:var(--serif);font-size:15px;color:var(--ink);justify-content:space-between}
.nav-tree-drill-row:hover{background:var(--rule-soft)}
.nav-tree-drill-row .nav-tree-count{display:inline-flex;font-family:var(--mono);font-size:11px;color:var(--ink-muted);background:var(--rule-soft);padding:1px 5px;border-radius:2px}
.nav-tree-drill-row:hover .nav-tree-chevron{color:var(--ink)}

/* Focus mode in sidebar */
.nav-focus-header{padding:8px 10px 12px;border-bottom:1px solid var(--rule-soft);margin-bottom:8px}
.nav-focus-back{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-family:var(--mono);color:var(--accent);cursor:pointer;letter-spacing:.04em}
.nav-focus-back:hover{text-decoration:underline}
.nav-focus-title{font-family:var(--serif);font-size:17px;font-weight:500;margin-top:6px;color:var(--ink)}
.nav-focus-sub{font-size:11px;color:var(--ink-muted);margin-top:2px}

/* Edit menu (⋯) */
.nav-edit-actions{margin-left:auto;display:none;gap:2px;align-items:center}
body.edit-mode .nav-tree-row:hover .nav-edit-actions,
body.edit-mode .nav-edit-actions.menu-open{display:inline-flex}
.btn-icon-mini{background:transparent;border:none;cursor:pointer;padding:2px 4px;color:var(--ink-muted);border-radius:2px;font-size:13px;line-height:1;display:inline-flex;align-items:center}
.btn-spinner{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:btn-spin .6s linear infinite;vertical-align:middle}
@keyframes btn-spin{to{transform:rotate(360deg)}}
.btn-loading{opacity:.9;cursor:progress;pointer-events:none}
.btn-icon-mini:hover{background:var(--rule-soft);color:var(--ink)}

/* Context menu (popover) */
.context-menu{position:fixed;background:var(--bg-paper);border:1px solid var(--rule-strong);border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.06);min-width:160px;z-index:200;padding:4px 0;font-size:13px}
.context-menu-item{padding:7px 14px;cursor:pointer;color:var(--ink);transition:background .1s}
.context-menu-item:hover{background:var(--accent-soft);color:var(--accent)}
.context-menu-item.danger{color:var(--danger)}
.context-menu-item.danger:hover{background:var(--danger-soft)}
.context-menu-divider{height:1px;background:var(--rule-soft);margin:4px 0}

/* Inline images in scheda content */
.procedura-body img,.scheda-content img{max-width:100%;height:auto;display:block;margin:16px auto;border-radius:2px;cursor:zoom-in;border:1px solid var(--rule-soft);transition:opacity .15s}
.procedura-body img:hover,.scheda-content img:hover{opacity:.85}
.procedura-body figure,.scheda-content figure{margin:16px auto;text-align:center}
.procedura-body figcaption,.scheda-content figcaption{font-family:var(--serif);font-size:13px;font-style:italic;color:var(--ink-muted);margin-top:6px}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(20,18,14,.92);z-index:9999;display:flex;align-items:center;justify-content:center;padding:32px;cursor:zoom-out;animation:lbFadeIn .18s ease-out}
@keyframes lbFadeIn{from{opacity:0}to{opacity:1}}
.lightbox-img{max-width:100%;max-height:calc(100vh - 100px);object-fit:contain;border-radius:2px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.lightbox-caption{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:rgba(251,248,242,.85);font-family:var(--serif);font-size:14px;font-style:italic;padding:0 32px;pointer-events:none}
.lightbox-close{position:absolute;top:20px;right:24px;background:rgba(20,18,14,.6);border:1px solid rgba(251,248,242,.3);color:rgba(251,248,242,.95);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;line-height:1;transition:background .12s}
.lightbox-close:hover{background:rgba(20,18,14,.85);border-color:rgba(251,248,242,.6)}

.user-name{font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.02em}

.app-body{display:grid;grid-template-columns:240px 1fr;min-height:0}
@media (max-width:900px){
  .app-body{grid-template-columns:1fr}
  /* Sidebar diventa drawer mobile */
  aside.sidebar{
    position:fixed;top:0;left:0;bottom:0;width:280px;max-width:85vw;
    height:100vh;z-index:200;
    background:var(--bg-paper);border-right:1px solid var(--rule);
    transform:translateX(-100%);transition:transform .25s ease;
    box-shadow:2px 0 16px rgba(0,0,0,.08);
    padding:20px 16px;display:block;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  aside.sidebar.mobile-open{transform:translateX(0)}
  aside.sidebar{overscroll-behavior:contain}
  .sidebar-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .sidebar-overlay.show{opacity:1;pointer-events:auto}
  .sidebar-mobile-close{
    display:block;width:100%;text-align:left;
    background:transparent;border:none;color:var(--ink-soft);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;padding:4px 12px 16px;cursor:pointer;
  }
}
@media (min-width:901px){
  .sidebar-overlay,.sidebar-mobile-close,.btn-hamburger{display:none}
  aside.sidebar{border-right:1px solid var(--rule);padding:24px 16px;position:sticky;top:calc(var(--topbar-height) + var(--edit-banner-height, 0px));align-self:start;height:calc(100vh - var(--topbar-height) - var(--edit-banner-height, 0px));overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
  aside.sidebar::-webkit-scrollbar{width:4px}
  aside.sidebar::-webkit-scrollbar-track{background:transparent}
  aside.sidebar::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}
  aside.sidebar::-webkit-scrollbar-thumb:hover{background:var(--rule-strong)}
}
.sidebar-mobile-close{display:none}

/* Hamburger button */
.btn-hamburger{
  display:none;background:transparent;border:1px solid var(--rule);
  width:36px;height:36px;border-radius:2px;cursor:pointer;
  padding:0;align-items:center;justify-content:center;
  color:var(--ink-soft);transition:background .12s,border-color .12s;
}
.btn-hamburger:hover,.btn-hamburger.active{background:var(--rule-soft);border-color:var(--rule-strong);color:var(--ink)}
@media (max-width:900px){.btn-hamburger{display:inline-flex}}

.nav-group{margin-bottom:24px}
.nav-group-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);padding:0 12px 8px;font-weight:500}
.nav-tree-group-label{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);padding:12px 12px 5px;font-weight:600}
.nav-tree-group-label:first-child{padding-top:2px}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:2px;font-size:14px;color:var(--ink-soft);cursor:pointer;transition:background .12s,color .12s}
.nav-item:hover{background:var(--rule-soft);color:var(--ink)}
.nav-item.active{background:var(--ink);color:var(--bg-paper)}
.nav-item-count{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.nav-item.active .nav-item-count{color:rgba(251,248,242,.6)}
main.content{padding:40px 48px 80px;width:100%;min-width:0;position:relative;z-index:0}
@media (max-width:700px){
  main.content{padding:14px 16px 60px}
  body .home-hero{margin-bottom:20px}
  body .home-title{font-size:clamp(26px,7vw,36px);margin-bottom:6px;line-height:1.05}
  body .home-lead{font-size:14px;line-height:1.4}
  body .page-head{margin-bottom:18px;padding-bottom:14px}
  body .page-eyebrow{margin-bottom:6px}
}

/* PAGE HEADERS */
.page-head{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--rule)}
.page-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* Quando il breadcrumb è vuoto (es. Home rimosso da buildBreadcrumb), evita
   margin/spazio fantasma sotto la topbar */
.page-eyebrow:empty{display:none}
.bc-back{background:transparent;border:1px solid var(--rule);color:var(--ink-soft);width:24px;height:24px;border-radius:2px;cursor:pointer;font-size:13px;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s,color .12s}
.bc-back:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.bc-segment{cursor:pointer;color:var(--ink-muted);transition:color .12s}
.bc-segment:hover{color:var(--accent);text-decoration:underline}
.bc-sep{color:var(--ink-faint);margin:0 2px}

/* CHIPS MULTI-SELECT */
.chips-wrap{position:relative}
.chips-list{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--bg-raised);border:1px solid var(--rule);border-radius:2px;min-height:40px;cursor:text}
.chips-list:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-size:12px;padding:3px 4px 3px 8px;border-radius:2px;border:1px solid transparent}
.chip-label{line-height:1.4}
.chip-remove{background:transparent;border:none;cursor:pointer;color:var(--accent);font-size:14px;line-height:1;padding:0 4px;border-radius:2px;transition:background .12s}
.chip-remove:hover{background:rgba(43,74,111,.15)}
.chips-input{flex:1;min-width:80px;border:none;outline:none;background:transparent;font-family:var(--sans);font-size:13px;color:var(--ink);padding:2px 0}
.chips-suggest{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--bg-paper);border:1px solid var(--rule-strong);border-radius:2px;max-height:240px;overflow-y:auto;display:none;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.chips-suggest.open{display:block}
.chip-suggest-item{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;transition:background .1s}
.chip-suggest-item:hover{background:var(--accent-soft)}
.chip-suggest-id{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.04em}
.chip-suggest-new{border-top:1px dashed var(--rule);color:var(--accent);font-style:italic}
.chip-suggest-empty{padding:12px;font-size:13px;color:var(--ink-muted);font-style:italic}

/* Picker "Numeri correlati": ricerca contatti stile overlay, risultati IN-FLOW (non
   absolute) così non vengono tagliati dall'overflow:hidden della editor-section. */
.numcorr-picker{position:relative}
.numcorr-input{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:2px;background:var(--bg-raised);color:var(--ink);font-family:var(--sans);font-size:13px;outline:none;transition:border-color .12s,box-shadow .12s}
.numcorr-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.numcorr-results{display:none;margin-top:8px;max-height:340px;overflow-y:auto;border:1px solid var(--rule);border-radius:2px;background:var(--bg-paper);padding:8px}
.numcorr-results.open{display:block}
.numcorr-result-row{cursor:pointer;border-radius:2px}
.numcorr-result-row:hover{background:var(--accent-soft)}
.numcorr-result-row .sr-contact{cursor:pointer}
.numcorr-empty{padding:12px;font-size:13px;color:var(--ink-muted);font-style:italic}
.numcorr-selected{margin-top:10px}
.numcorr-selected-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:6px;font-weight:500}
.numcorr-remove{background:transparent;border:none;cursor:pointer;color:var(--ink-muted);font-size:18px;line-height:1;padding:0 6px;border-radius:2px;flex-shrink:0;transition:color .12s,background .12s}
.numcorr-remove:hover{color:var(--danger);background:var(--danger-soft)}

/* Tag clickability in scheda */
.tag.clickable{cursor:pointer;transition:background .12s}
.tag.clickable:hover{background:var(--accent-soft);color:var(--accent)}

/* HOME quick access cards (emergency / guardia) */
.home-quickaccess{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:8px}
@media (max-width:640px){.home-quickaccess{grid-template-columns:1fr}}
.quickaccess-card{display:flex;align-items:center;gap:16px;padding:20px 24px;border-radius:4px;cursor:pointer;border:1px solid var(--rule);background:var(--bg-paper);transition:background .15s,border-color .15s,transform .15s}
.quickaccess-card:hover{border-color:var(--rule-strong);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.quickaccess-card:active{transform:translateY(0)}
.quickaccess-icon{flex-shrink:0;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-sink)}
.quickaccess-text{flex:1;min-width:0}
.quickaccess-title{font-family:var(--serif);font-size:19px;font-weight:500;color:var(--ink);line-height:1.2}
.quickaccess-sub{font-size:12px;color:var(--ink-muted);margin-top:4px;font-family:var(--mono);letter-spacing:.02em}
.quickaccess-emergency .quickaccess-icon{background:rgba(180,50,50,.08);color:#b43232}
.quickaccess-emergency:hover{border-color:rgba(180,50,50,.5);background:rgba(180,50,50,.02)}
.quickaccess-guardia .quickaccess-icon{background:var(--accent-soft);color:var(--accent)}
.quickaccess-guardia:hover{border-color:var(--accent);background:rgba(43,74,111,.02)}

/* Pin star button */
.pin-star{background:transparent;border:none;cursor:pointer;font-size:20px;line-height:1;padding:2px 6px;color:var(--ink-faint);transition:color .12s,transform .12s}
.pin-star:hover{color:#d4a017;transform:scale(1.1)}
.pin-star.pinned{color:#d4a017}
.pin-star.pinned:hover{color:var(--ink-muted)}
.pin-star.inline{font-size:16px;padding:0 4px;vertical-align:middle}
.page-title .pin-star{font-size:22px;vertical-align:middle;margin-left:6px}
.reorder-btn{background:transparent;border:1px solid var(--rule);border-radius:4px;cursor:pointer;font-size:13px;line-height:1;padding:2px 5px;color:var(--ink-muted);min-width:24px}
.reorder-btn:hover{color:var(--ink);border-color:var(--accent)}
.reorder-btn:active{transform:scale(.94)}
.numeri-group-title .pin-star{font-size:15px;vertical-align:middle}
.numero-label .pin-star{font-size:15px;padding:0 2px;line-height:1.3;flex-shrink:0}

/* Note del giorno (todos in home) */
.ndg-list{display:flex;flex-direction:column;gap:4px}
.ndg-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--bg-paper);transition:background .12s}
.ndg-row:hover{background:var(--bg-sink)}
.ndg-check{background:transparent;border:none;cursor:pointer;font-size:18px;line-height:1;padding:0;color:var(--ink-muted);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ndg-check:hover{color:var(--accent)}
.ndg-text{flex:1;min-width:0;font-family:var(--serif);font-size:14px;color:var(--ink);line-height:1.4;word-break:break-word}
.ndg-edit-input{flex:1;min-width:0;font-family:var(--serif);font-size:14px;color:var(--ink);line-height:1.4;padding:2px 6px;border:1px solid var(--accent);border-radius:3px;background:var(--bg-paper);resize:none;overflow:hidden;word-break:break-word;white-space:pre-wrap}
.ndg-edit-input:focus{outline:none}
.ndg-row-editing .ndg-del,.ndg-row-editing .ndg-drag{display:none}
.ndg-done .ndg-text{text-decoration:line-through;color:var(--ink-faint)}
.ndg-done .ndg-check{color:var(--accent)}
.ndg-drag{cursor:grab;color:var(--ink-muted);font-size:16px;line-height:1;padding:4px 4px;flex-shrink:0;user-select:none;-webkit-user-select:none;touch-action:none;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
.ndg-drag:hover{color:var(--ink)}
.ndg-drag:active{cursor:grabbing}
.ndg-row.sortable-ghost{opacity:.4}
.ndg-row.sortable-chosen{background:var(--bg-sink)}
.ndg-del{flex-shrink:0;color:var(--ink-faint);opacity:.6}
.ndg-del:hover{color:var(--danger);opacity:1}
.ndg-edit{flex-shrink:0;color:var(--ink-faint);opacity:.6}
.ndg-edit:hover{color:var(--accent);opacity:1}


/* Home sections for personal pins */
.home-pins-group{margin-bottom:20px}
.home-pins-group:empty{display:none}
.pinned-folder{display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--rule);border-radius:2px;background:var(--bg-paper);cursor:pointer;transition:background .12s,border-color .12s;margin-bottom:6px}
.pinned-folder:hover{border-color:var(--accent);background:var(--accent-soft)}
.pinned-folder-icon{font-family:var(--mono);font-size:14px;color:var(--ink-faint);flex-shrink:0}
.pinned-folder-text{flex:1;min-width:0}
.pinned-folder-label{font-family:var(--serif);font-size:16px;font-weight:500;color:var(--ink)}
.pinned-folder-sub{font-size:11px;color:var(--ink-muted);margin-top:2px;font-family:var(--mono)}
.pinned-contact{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--rule-soft);border-radius:2px;background:var(--bg-paper);margin-bottom:4px}
.pinned-contact-num{font-family:var(--mono);font-size:14px;color:var(--accent);cursor:pointer;flex:1;text-align:right}
.pinned-contact-label{font-family:var(--serif);font-size:15px;color:var(--ink);flex:1}
.empty-pins{padding:24px;text-align:center;color:var(--ink-muted);font-size:13px;font-style:italic;border:1px dashed var(--rule);border-radius:2px}
.page-title{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.05;letter-spacing:-.02em;color:var(--ink)}
.page-title em{font-style:italic;font-weight:300}
.page-meta{margin-top:16px;font-size:13px;color:var(--ink-muted);display:flex;gap:20px;flex-wrap:wrap}
.page-meta-item{display:flex;align-items:center;gap:6px}
.page-actions{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}

.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;background:var(--bg-sink);color:var(--ink-soft);border-radius:2px;margin-right:6px}
.tag.tag-urgenza{background:var(--danger-soft);color:var(--danger)}
.tag.tag-procedura{background:var(--accent-soft);color:var(--accent)}
.tag.tag-modulo{background:var(--info-soft);color:var(--info)}

.procedura-body{font-size:16px;line-height:1.7;color:var(--ink-soft)}
.procedura-body h2{font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.2;letter-spacing:-.01em;color:var(--ink);margin:48px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--rule-soft)}
.procedura-body h2:first-child{margin-top:0}
.procedura-body h3{font-family:var(--serif);font-weight:500;font-size:18px;color:var(--ink);margin:28px 0 12px}
.procedura-body p{margin-bottom:16px}
.procedura-body ul,.procedura-body ol{margin:0 0 16px 24px}
.procedura-body li{margin-bottom:6px}
.procedura-body strong{color:var(--ink);font-weight:600}
.procedura-body em{color:var(--ink)}
.procedura-body blockquote{margin:20px 0;padding:16px 20px;background:var(--bg-sink);border-left:3px solid var(--ink-faint);font-family:var(--serif);font-style:italic;color:var(--ink-soft);font-size:15px;line-height:1.6;border-radius:0 2px 2px 0}
.procedura-body blockquote strong{font-style:normal}
.procedura-body code{font-size:13px}
.procedura-body table{width:100%;border-collapse:collapse;margin:24px 0;font-size:14px}
.procedura-body table th,.procedura-body table td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.procedura-body table th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);font-weight:500;border-bottom:1px solid var(--rule);background:var(--bg-sink)}
.procedura-body table tr:last-child td{border-bottom:1px solid var(--rule)}

.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:32px;padding-top:32px;border-top:1px solid var(--rule)}
.related-card{padding:14px 16px;background:var(--bg-paper);border:1px solid var(--rule);border-radius:2px;cursor:pointer;transition:border-color .15s,background .15s}
.related-card:hover{border-color:var(--ink);background:var(--bg-raised)}
.related-card-label{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:4px}
.related-card-title{font-family:var(--serif);font-size:15px;font-weight:500;color:var(--ink);line-height:1.3}

/* HOME */
.home-hero{margin-bottom:48px}
.home-title{font-family:var(--serif);font-weight:300;font-size:clamp(36px,6vw,56px);line-height:1.0;letter-spacing:-.03em;margin-bottom:10px}
.home-title em{font-style:italic}
.home-lead{font-family:var(--serif);font-style:italic;font-weight:300;font-size:18px;color:var(--ink-muted);max-width:62ch;line-height:1.5}
.home-section{margin-bottom:28px}
.home-section-title{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);font-weight:500;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.home-section-title::after{content:'';flex:1;height:1px;background:var(--rule)}
.procedure-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.procedure-card{display:block;padding:20px 22px;background:var(--bg-paper);border:1px solid var(--rule);border-radius:2px;cursor:pointer;transition:border-color .15s,transform .1s,box-shadow .15s;position:relative;overflow:hidden}
.procedure-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--accent);transform:scaleY(0);transform-origin:top;transition:transform .2s}
.procedure-card:hover{border-color:var(--ink);box-shadow:var(--shadow-raised)}
.procedure-card:hover::before{transform:scaleY(1)}
.procedure-card-title{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.2;margin-bottom:8px;color:var(--ink);display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-edit-btn{flex-shrink:0;margin-top:2px;opacity:.6;transition:opacity .15s}
.card-edit-btn:hover{opacity:1}
.card-actions{display:inline-flex;align-items:center;gap:2px;flex-shrink:0}
.card-actions .pin-star{font-size:16px;padding:2px 4px}
.procedure-card-meta{font-size:12px;color:var(--ink-muted);display:flex;align-items:center;gap:10px;margin-top:12px}
.procedure-card-tags{margin-top:10px}
/* Card "snelle" nella home (solo titolo + stella): meno padding, nessun margine sotto il titolo. */
.procedure-card-slim{padding:14px 18px}
.procedure-card-slim .procedure-card-title{margin-bottom:0;font-size:17px}

/* NUMERI */
.numeri-filters{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.filter-chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:6px 12px;border:1px solid var(--rule);border-radius:2px;color:var(--ink-soft);cursor:pointer;background:transparent;transition:all .15s}
.filter-chip:hover{border-color:var(--ink);color:var(--ink)}
.filter-chip.active{background:var(--ink);color:var(--bg-paper);border-color:var(--ink)}
.numeri-group{margin-bottom:32px;scroll-margin-top:calc(var(--topbar-height) + 12px)}
.numeri-group-title{font-family:var(--serif);font-weight:500;font-size:20px;margin-bottom:12px;color:var(--ink);letter-spacing:-.01em}

/* ============================ MODULI COMPILABILI ============================ */
.mod-layout{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media (max-width:900px){
  .mod-layout{grid-template-columns:1fr;gap:12px}
}
.mod-form{position:sticky;top:calc(var(--topbar-height) + 12px);background:var(--bg-paper);border:1px solid var(--rule);border-radius:2px;padding:16px;align-self:start;max-height:calc(100vh - var(--topbar-height) - 32px);overflow-y:auto;box-sizing:border-box;min-width:0;max-width:100%}
@media (max-width:900px){
  .mod-form{position:static;max-height:none;padding:12px}
}
.mod-form-head h3{font-family:var(--serif);font-weight:500}
.mod-form-fields{display:grid;gap:14px}
.mod-field-group{display:block}
.mod-field-label{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-bottom:4px;letter-spacing:.02em;text-transform:uppercase}
.mod-input{width:100%;padding:8px 10px;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--bg-base);border:1px solid var(--rule);border-radius:2px;box-sizing:border-box;transition:border-color .15s}
.mod-input:focus{outline:none;border-color:var(--accent)}
.mod-input:disabled{background:var(--bg-sink);color:var(--ink-muted);cursor:not-allowed}
.mod-input[type=text],.mod-input textarea{font-family:var(--sans)}
.mod-field-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mod-segmented{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;width:fit-content;max-width:100%;flex-wrap:wrap}
.mod-seg{flex:1;padding:6px 12px;background:var(--bg-paper);color:var(--ink-muted);font-family:var(--sans);font-size:12px;font-weight:500;border:none;cursor:pointer;transition:all .15s;border-right:1px solid var(--rule);white-space:nowrap}
.mod-seg:last-child{border-right:none}
.mod-seg.active{background:var(--ink);color:var(--bg-paper)}
.mod-seg:hover:not(.active){background:var(--bg-sink);color:var(--ink)}
.mod-preview{background:var(--bg-paper);border:1px solid var(--rule);border-radius:2px;padding:16px;box-sizing:border-box;min-width:0;max-width:100%;overflow:hidden}
@media (max-width:900px){
  .mod-preview{padding:8px}
}
.mod-page-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--rule-soft);flex-wrap:wrap}
.mod-page-nav .btn{padding:6px 10px;font-size:12px;flex:0 1 auto;min-width:0}
@media (max-width:600px){
  /* Su mobile mostro solo le frecce, niente testo "Precedente/Successiva" — risparmia spazio */
  .mod-page-text{display:none}
  .mod-page-arrow{font-size:14px}
}
.mod-page-indicator{font-family:var(--mono);font-size:12px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em;flex:1 1 auto;text-align:center;min-width:0}
.mod-page-stage{position:relative;display:block;background:#fff;border:1px solid var(--rule-soft);box-shadow:0 1px 3px rgba(0,0,0,.04)}

/* Container scrollabile: con zoom > 100% lo stage eccede in larghezza e questo container scrolla. */
.mod-page-scroll{overflow:auto;max-width:100%;max-height:70vh;-webkit-overflow-scrolling:touch;background:var(--bg-sink);border:1px solid var(--rule-soft);position:relative}
@media (max-width:600px){
  /* Su mobile riservo più spazio alla pagina ma lascio comunque visibili topbar e toolbar zoom */
  .mod-page-scroll{max-height:60vh}
}

/* Durante drag/resize box: blocco scroll del body senza fare reflow viewport.
   `touch-action:none` sul body impedisce al browser di interpretare il gesto come scroll
   della pagina, MA NON cancella i pointer events (a differenza di `<html>`). Inoltre,
   essendo su body non causa il reflow della topbar mobile. */
body.is-dragging-modulo-box{touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}

/* Toolbar zoom: bottoni +/-/reset compatti */
.mod-zoom-toolbar{display:flex;align-items:center;gap:6px;margin-bottom:8px;justify-content:flex-end}
.mod-zoom-btn{padding:4px 10px;font-size:14px;min-width:32px;line-height:1}
.mod-zoom-indicator{font-family:var(--mono);font-size:12px;color:var(--ink-muted);min-width:48px;text-align:center}
@media (max-width:600px){
  .mod-zoom-toolbar{justify-content:center}
  .mod-zoom-btn{padding:6px 12px;font-size:16px;min-width:38px}
  .mod-zoom-indicator{font-size:13px;min-width:54px}
}
.mod-page-img{display:block;max-width:100%;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.mod-overlay-layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
/* Griglia di allineamento (toggle in editMode): linee ogni 5% nello stesso sistema di
   coordinate % dei box, così facilita l'allineamento e abilita lo snap-to-grid. */
.mod-overlay-layer.grid-on{background-image:linear-gradient(to right,rgba(24,95,165,.12) 1px,transparent 1px),linear-gradient(to bottom,rgba(24,95,165,.12) 1px,transparent 1px),linear-gradient(to right,rgba(24,95,165,.28) 1px,transparent 1px),linear-gradient(to bottom,rgba(24,95,165,.28) 1px,transparent 1px);background-size:2% 2%,2% 2%,10% 10%,10% 10%;background-position:0 0}
.mod-box{position:absolute;font-family:var(--sans);color:#000;background:rgba(255,255,200,.4);outline:1px solid rgba(180,140,0,.3);box-sizing:border-box;padding:0 2px;display:flex;align-items:center;white-space:nowrap;line-height:1;border-radius:1px;min-height:0;min-width:0}
/* Span dedicato al testo del box: l'overflow:hidden è qui, NON sul .mod-box, così la maniglia
   esterna (top:-26px, right:-26px) non viene clippata dal box. Il testo che eccede viene
   clipped dallo span. */
.mod-box-text{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:clip;white-space:nowrap;display:flex;align-items:center;width:100%;height:100%}
/* Allineamento testo del box: pilotato da CLASSE (.align-center/.align-right), NON dalla
   stringa inline `style`. Motivo: durante il drag impostiamo box.style.transform, e il browser
   ri-serializza l'intero attributo style (es. "text-align: center" con spazio), facendo fallire
   il vecchio selettore [style*="text-align:center"] → il testo scivolava a sinistra mentre/dopo
   lo spostamento anche per box centrati. La classe è immune alla ri-serializzazione. */
.mod-box.align-center .mod-box-text{justify-content:center}
.mod-box.align-right .mod-box-text{justify-content:flex-end}
/* Box multi-riga: il testo va a capo (white-space:pre con a-capo calcolati dall'auto-fit) e il
   blocco di righe resta centrato verticalmente dal flex del .mod-box (height:auto sul testo). */
.mod-box.multiline{white-space:pre}
.mod-box.multiline .mod-box-text{display:block;white-space:pre;width:100%;height:auto;max-height:100%;overflow:hidden;text-align:left}
.mod-box.multiline.align-center .mod-box-text{text-align:center}
.mod-box.multiline.align-right .mod-box-text{text-align:right}
/* NB: le classi si chiamano "mod-vuoto"/"mod-segnaposto" e NON "empty"/"placeholder" di
   proposito. La generica `.empty{padding:60px 20px;...}` (stato vuoto delle pagine, più sotto)
   ha la stessa specificità di `.mod-box` ma viene dopo nel foglio: il suo padding verticale
   120px vinceva su `padding:0 2px` e, con box-sizing:border-box, faceva da pavimento
   all'altezza dei box vuoti (120px fissi, height % ignorata). Non rinominare indietro. */
.mod-box.mod-vuoto{background:rgba(0,0,0,.04);outline:1px dashed rgba(0,0,0,.25);color:rgba(0,0,0,.3);font-style:italic}
/* Box con placeholder esemplificativo (in editMode quando non ha ancora valore reale).
   Stile: testo nero come il testo reale (massima leggibilità) ma background giallo chiaro
   come empty per distinguere visivamente "spazio riservato per dati". Identica struttura del
   box firma → niente scivolamento durante resize. */
.mod-box.mod-segnaposto{background:rgba(255,255,200,.4);outline:1px dashed rgba(180,140,0,.5);color:#000}
.mod-box.firma{background:rgba(180,180,255,.15);outline:1px dashed rgba(80,80,160,.4);color:rgba(60,60,120,.6);font-style:italic;justify-content:center}
.mod-form-actions .btn{padding:6px 12px;font-size:13px}

/* Dropdown menu per il bottone "Scarica" (PDF/PNG). Il wrap è position:relative così
   il menu absolute si posiziona sotto il bottone. */
.mod-dropdown-wrap{position:relative;display:inline-block}
.mod-dropdown-menu{display:none;position:absolute;top:100%;left:0;margin-top:4px;background:var(--bg-paper);border:1px solid var(--rule);border-radius:2px;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:50;min-width:140px;overflow:hidden}
.mod-dropdown-menu.open{display:block}
.mod-dropdown-menu button{display:block;width:100%;padding:10px 14px;background:transparent;border:none;text-align:left;font-family:var(--sans);font-size:14px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--rule-soft)}
.mod-dropdown-menu button:last-child{border-bottom:none}
.mod-dropdown-menu button:hover{background:var(--bg-sink)}

/* Stepper +/- per la dimensione del font del box selezionato */
.mod-fontsize-stepper{display:flex;align-items:stretch;gap:0;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.mod-fontsize-stepper .mod-fs-btn{padding:6px 14px;font-size:18px;line-height:1;border:none;border-radius:0;flex:0 0 auto;background:var(--bg-paper);color:var(--ink);font-weight:500}
.mod-fontsize-stepper .mod-fs-btn:hover{background:var(--bg-sink)}
.mod-fontsize-stepper .mod-fs-input{flex:1;border:none;border-left:1px solid var(--rule);border-right:1px solid var(--rule);border-radius:0;text-align:center;font-family:var(--mono);background:var(--bg-base)}

/* Toolbar editor box */
.mod-toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding:8px 12px;background:var(--bg-paper);border:1px solid var(--rule);border-radius:2px;box-sizing:border-box;max-width:100%}
.mod-toolbar .btn{padding:6px 12px;font-size:13px;flex:0 1 auto}
@media (max-width:600px){
  .mod-toolbar{padding:8px;gap:4px}
  .mod-toolbar .btn{padding:6px 8px;font-size:12px}
}
.mod-toolbar .btn.primary,
.mod-form-actions .btn.primary{background:var(--ink);color:var(--bg-paper);border-color:var(--ink)}
.mod-toolbar .btn.primary:hover,
.mod-form-actions .btn.primary:hover{background:#000;border-color:#000}
.mod-toolbar-hint{font-size:11px;color:var(--ink-muted);font-style:italic;margin-left:auto;flex:0 1 auto;min-width:0}
@media (max-width:600px){
  .mod-toolbar-hint{display:none}
}

/* Modalità modifica: layer overlay riceve eventi (pointer-events:auto è settato da JS) */
.mod-box.editable{cursor:move;user-select:none;touch-action:none;-webkit-user-select:none}
.mod-box.editable:hover{outline:1px solid rgba(20,80,180,.5);outline-offset:1px}
.mod-box.editable.selected{outline:2px solid #185FA5;outline-offset:1px;background:rgba(180,200,255,.4);z-index:10;will-change:transform,left,top,width,height}
.mod-box.editable.selected.firma{background:rgba(180,180,255,.35)}

/* Maniglia di resize unica: posizionata fuori dall'angolo top-right del box.
   Logica di resize "BR" (top-left ancorato, cambiano width e height) — più intuitivo per
   l'utente che il TR (che cambierebbe anche y). Icona visiva con frecce diagonali. */
.mod-handle{position:absolute;background:#185FA5;color:#fff;border:2px solid #fff;box-sizing:border-box;border-radius:3px;z-index:11;touch-action:none;-webkit-user-select:none;user-select:none;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;font-weight:700;cursor:nwse-resize;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.mod-handle-resize{width:24px;height:24px;right:-26px;top:-26px}
@media (max-width:600px){
  /* Su mobile maniglia più grande (target tap 32px) per facilitare il resize */
  .mod-handle-resize{width:32px;height:32px;right:-34px;top:-34px;font-size:16px;border-width:3px}
}

/* Pannello editor (sostituisce il form di compilazione) */
.mod-edit-section{margin-top:14px;padding-top:14px;border-top:1px solid var(--rule-soft)}
.mod-edit-section-title{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);margin-bottom:8px;font-weight:500}
.mod-box-list{display:flex;flex-direction:column;gap:2px;max-height:200px;overflow-y:auto;border:1px solid var(--rule-soft);border-radius:2px;background:var(--bg-base)}
.mod-box-list-item{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--rule-soft);transition:background .1s}
.mod-box-list-item:last-child{border-bottom:none}
.mod-box-list-item:hover{background:var(--bg-sink)}
.mod-box-list-item.selected{background:rgba(24,95,165,.1);color:var(--ink)}
.mod-box-list-num{font-family:var(--mono);font-size:11px;color:var(--ink-muted);min-width:20px}
.mod-box-list-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod-box-list-page{font-family:var(--mono);font-size:10px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em}
.mod-edit-details{margin-top:14px;padding-top:14px;border-top:1px solid var(--rule-soft);display:grid;gap:12px}
/* Lista campi del modulo (editor box) */
.mod-campi-list{display:flex;flex-direction:column;gap:2px;border:1px solid var(--rule-soft);border-radius:2px;background:var(--bg-base)}
.mod-campo-item{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;border-bottom:1px solid var(--rule-soft)}
.mod-campo-item:last-child{border-bottom:none}
.mod-campo-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod-campo-tipo{font-family:var(--mono);font-size:10px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.mod-campo-btn{flex:0 0 auto;background:transparent;border:none;cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;color:var(--ink-muted)}
.mod-campo-btn:hover{color:var(--ink)}

/* Su mobile in editMode: layout più compatto */
.mod-layout-edit .mod-form{max-height:none}
/* ============================ NUMERO ROW (compact mobile-first) ============================
   Layout:
   - Bordo sinistro 3px colorato per il tag (guardia/reparto/utile)
   - Riga superiore: label (flex 1, wrap libero) + numero principale (destra, fisso)
   - Riga inferiore (se presente): meta sede + numeri extra (cellulari, brevi)
   Il numero principale prende il colore del tag. Niente badge testuali. */
.numero-row{padding:9px 12px 9px 14px;border-bottom:1px solid var(--rule-soft);border-left:3px solid transparent}
.numero-row:last-child{border-bottom:none}
.numero-row-top{display:flex;gap:8px;align-items:flex-start}
.numero-label{flex:1;min-width:0;display:flex;align-items:flex-start;gap:2px;font-family:var(--serif);font-size:14.5px;line-height:1.3;color:var(--ink)}
.numero-label-text{min-width:0;word-wrap:break-word;overflow-wrap:anywhere}
.numero-num-primary{flex-shrink:0;font-family:var(--mono);font-size:13px;background:var(--bg-raised);border:1px solid var(--rule);padding:3px 9px;border-radius:3px;white-space:nowrap;color:var(--ink);margin-top:1px;font-weight:500;letter-spacing:.02em;cursor:pointer;transition:background .12s,color .12s}
.numero-num-primary:hover{background:var(--ink);color:var(--bg-paper)}
.numero-row-bottom{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.numero-luogo{font-family:var(--mono);font-size:10.5px;color:var(--ink-muted);letter-spacing:.02em;flex:1;min-width:0}
.numero-extras{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.numero-num-extra{font-family:var(--mono);font-size:11.5px;background:var(--bg-sink);border:1px solid var(--rule);padding:2px 7px;border-radius:3px;white-space:nowrap;color:var(--ink-soft);cursor:pointer;transition:background .12s,color .12s;font-weight:500}
.numero-num-extra:hover{background:var(--ink-soft);color:var(--bg-paper)}

/* Tag colorati: striscia sinistra + numero principale colorato */
.numero-row-guardia{border-left-color:var(--danger)}
.numero-row-guardia .numero-num-primary{background:#fef0ef;border-color:var(--danger);color:var(--danger)}
.numero-row-guardia .numero-num-primary:hover{background:var(--danger);color:#fff}
.numero-row-reparto{border-left-color:var(--accent)}
.numero-row-reparto .numero-num-primary{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.numero-row-reparto .numero-num-primary:hover{background:var(--accent);color:#fff}
/* Dropzone sezione Reparto — replica dello stile "Carica cartella" di LetteraAI */
.rep-card{background:var(--bg-paper);border:1px solid var(--rule);border-radius:2px;padding:16px 18px;margin-bottom:14px}
.rep-dz-title{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:10px}
.rep-dz{border:2px dashed var(--rule);border-radius:4px;padding:24px 20px;text-align:center;cursor:pointer;background:var(--bg-sink);transition:border-color .15s}
.rep-dz:hover,.rep-dz.drag{border-color:var(--accent)}
.rep-dz-ic{font-size:24px;margin-bottom:6px;opacity:.7}
.rep-dz-txt{font-family:var(--mono);font-size:11px;color:var(--ink-muted)}
.rep-dz-txt strong{color:var(--ink)}
.rep-dz-status{margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.rep-tabs{display:flex;gap:6px;flex-wrap:wrap}
.rep-tab{padding:6px 14px;border:1px solid var(--rule);border-radius:20px;background:transparent;font-size:12px;color:var(--ink-soft);cursor:pointer;transition:all .12s}
.rep-tab:hover{border-color:var(--accent);color:var(--ink)}
.rep-tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.numero-row-utile{border-left-color:#2e7d32}
.numero-row-utile .numero-num-primary{background:#e8f5e9;border-color:#2e7d32;color:#2e7d32}
.numero-row-utile .numero-num-primary:hover{background:#2e7d32;color:#fff}

/* Su schermo molto stretto: ridici padding e font etichetta */
@media (max-width:380px){
  .numero-row{padding:8px 10px 8px 12px}
  .numero-label{font-size:14px}
}
.uoc-compact-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-top:4px}
.uoc-compact-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--bg-paper);border:1px solid var(--rule);border-radius:3px;transition:border-color .12s,background .12s}
.uoc-compact-item:hover{border-color:var(--rule-strong);background:var(--bg-sink)}
.uoc-compact-item .pin-star{flex-shrink:0;font-size:16px;padding:2px 4px}
.uoc-compact-name{font-family:var(--serif);font-size:15px;font-weight:500;color:var(--ink);line-height:1.25;flex:1;min-width:0}
.uoc-compact-meta{font-family:var(--mono);font-size:11px;color:var(--ink-muted);white-space:nowrap;letter-spacing:.02em}
/* ======== CALENDARIO ======== */
.cal-wrap{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:900px){.cal-wrap{grid-template-columns:minmax(0,1fr) 340px}}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-head .cal-title{flex:1;font-family:var(--serif);font-size:20px;font-weight:500;text-transform:capitalize}
.cal-nav-btn{width:32px;height:32px;border:1px solid var(--rule);background:var(--bg-raised);border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:background .12s,color .12s}
.cal-nav-btn:hover{background:var(--bg-sink);color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule-soft);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.cal-dow{background:var(--bg-sink);text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:6px 4px;color:var(--ink-muted)}
.cal-day{background:var(--bg-paper);min-height:56px;padding:4px 6px;position:relative;cursor:pointer;transition:background .1s;display:flex;flex-direction:column;gap:2px}
.cal-day:hover{background:var(--bg-sink)}
.cal-day.other-month{color:var(--ink-faint);background:var(--bg)}
.cal-day.today{background:var(--accent-soft);font-weight:600}
.cal-day.selected{background:var(--accent);color:var(--bg-paper);font-weight:600}
.cal-day.selected .cal-day-num,.cal-day.today .cal-day-num{color:inherit}
.cal-day.festivo{background:#fef5f5}
[data-theme="dark"] .cal-day.festivo{background:#2a1818}
.cal-day.festivo.selected{background:var(--accent);color:var(--bg-paper)}
.cal-day-num{font-size:13px;font-family:var(--sans);color:var(--ink-soft);align-self:flex-end}
.cal-day.today .cal-day-num,.cal-day.selected .cal-day-num{color:inherit}
.cal-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.cal-dot{width:6px;height:6px;border-radius:50%}
.cal-dot.seminari{background:#6ba4f5}
.cal-dot.lezioni{background:#4a9b8e}
.cal-dot.compleanni{background:#f5a35f}
.cal-dot.congressi{background:#b388ff}
.cal-dot.guardie{background:#f07070}
.cal-dot.coguardie{background:#e8739e}
.cal-dot.amb_divisionale{background:#ffa94d}
.cal-dot.altro{background:#8fc857}
.cal-day.selected .cal-dot,.cal-day.today .cal-dot{box-shadow:0 0 0 1px var(--bg-paper)}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11px;color:var(--ink-muted);align-items:center;position:relative}
.cal-legend-item{display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:2px 6px;border-radius:2px;transition:background .1s;position:relative}
.cal-legend-item:hover{background:var(--bg-sink)}
.cal-legend-item.inactive{opacity:.35}
.cal-legend-dot{width:8px;height:8px;border-radius:50%}
.cal-legend-caret{font-size:9px;color:var(--ink-faint);margin-left:2px}
.cal-legend-dropdown{position:absolute;top:calc(100% + 4px);left:0;background:var(--bg-paper);border:1px solid var(--rule);border-radius:3px;padding:8px 10px;z-index:20;min-width:130px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:4px}
.cal-legend-dropdown label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);cursor:pointer;padding:2px 0}
.cal-legend-dropdown label input{margin:0;cursor:pointer}
.cal-events{background:var(--bg-paper);border:1px solid var(--rule);border-radius:3px;padding:14px 16px}
.cal-events-head{font-family:var(--serif);font-size:15px;font-weight:500;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--rule-soft);display:flex;align-items:center;gap:8px}
.cal-events-add{margin-left:auto;font-size:12px;padding:4px 10px;background:var(--accent);color:var(--bg-paper);border:none;border-radius:2px;cursor:pointer;font-family:var(--sans)}
.cal-events-add:hover{opacity:.9}
.cal-event{padding:10px 12px;border-left:3px solid var(--rule);background:var(--bg-sink);border-radius:0 2px 2px 0;margin-bottom:6px;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:start}
.cal-event-time-side{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--bg-paper);padding:3px 7px;border-radius:3px;border:1px solid var(--rule-soft);white-space:nowrap;align-self:start}
.cal-event-recur-icon{display:inline-block;margin-left:6px;font-size:11px;color:var(--ink-faint);vertical-align:middle;cursor:help}

.rubrica-alpha-btn.rubrica-alpha-source{min-width:auto;padding:0 10px;margin-left:4px;background:var(--bg-paper);border-color:var(--rule);font-size:11px;font-weight:600;letter-spacing:.05em}
.rubrica-alpha-btn.rubrica-alpha-source:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rubrica-pinned-section{margin:0 0 14px;border:1px solid var(--rule);border-radius:3px;background:var(--bg-paper);overflow:hidden}
.rubrica-pinned-summary{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-sink);cursor:pointer;list-style:none;font-family:var(--serif);font-size:14px;font-weight:500;color:var(--ink);user-select:none}
.rubrica-pinned-summary::-webkit-details-marker{display:none}
